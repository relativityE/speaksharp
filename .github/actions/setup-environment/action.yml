name: 'Setup Environment'
description: 'Sets up Node.js, pnpm and (opt-in) native deps, Playwright and the Supabase CLI for CI/CD'

# CI-PERF: every capability beyond Node/pnpm/dependencies is OPT-IN and defaults to false.
# Previously this action unconditionally installed ~80 apt packages (Canvas/Sharp build deps) and the
# Supabase CLI in EVERY job — including jobs that never use them (build, report, Lighthouse, E2E,
# health). That was removed for CI-PERF.
#
# #1195: pnpm is installed via COREPACK, not pnpm/action-setup. GitHub runners now pre-install pnpm
# v11.19.0; pnpm/action-setup "switches" the runner's pnpm (even v11->v11) and leaves PNPM_HOME in a
# hybrid layout, causing a flaky `ERR_PNPM_ENOENT: mkdir node_modules/@radix-ui` at install time.
# Corepack installs the EXACT `packageManager` version into its own clean location, ignoring the
# runner's pnpm — no switch, deterministic on any runner image. Version is chosen in ONE place
# (package.json "packageManager"); everything else derives from it.
inputs:
  install-dependencies:
    description: 'Run `pnpm install --frozen-lockfile`. Set false for jobs that only aggregate artifacts.'
    required: false
    default: 'true'
  install-native-deps:
    description: 'Install Canvas/Sharp native build dependencies (apt). Only needed by jobs that execute canvas/image code.'
    required: false
    default: 'false'
  install-playwright:
    description: 'Install Playwright browsers.'
    required: false
    default: 'false'
  install-supabase-cli:
    description: 'Install the Supabase CLI. Only needed by jobs that actually invoke `supabase`.'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    # #1306 CI-HARDENING (root fix) — MUST be the FIRST step, before ANY apt call.
    # unit-shard-3 (install-playwright:false) stalled ~6h on the Canvas/Sharp `apt-get`, with no Playwright
    # involved — proving the defect is UN-TIMED `apt` in setup, not a Playwright problem. A per-step timeout
    # wrapper would have missed that step entirely. A global apt.conf drop-in bounds EVERY apt invocation
    # (Canvas/Sharp AND Playwright) in one place, natively, with NO SIGKILL — killing apt mid-transaction
    # corrupts dpkg (-> `exit 100`). Trigger unidentified (one Azure-mirror `Ign:` is a thin reed); exposure
    # removed regardless. `http[s]::Timeout 30` caps a stalled fetch; `Retries 3` re-attempts; `DPkg::Lock::
    # Timeout 120` waits instead of failing if a boot-time upgrader still holds the lock. The job-level
    # `timeout-minutes` (ci.yml) stays as the outer backstop for a stalled TCP socket that ignores the timeout.
    - name: Bound apt network operations (global, pre-apt)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null <<'EOF'
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        Acquire::Retries "3";
        DPkg::Lock::Timeout "120";
        EOF
        echo "apt bounded (pre-apt): http/https timeout=30s, retries=3, dpkg lock wait=120s"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Activate pnpm via Corepack (single source = packageManager)
      id: pnpm
      shell: bash
      run: |
        # Install the EXACT packageManager pnpm cleanly. Do NOT use pnpm/action-setup (see #1195).
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        PM="$(node -p "require('./package.json').packageManager")"   # e.g. pnpm@10.29.1
        corepack prepare "$PM" --activate
        EXPECTED="${PM#pnpm@}"
        ACTUAL="$(pnpm --version)"
        echo "pnpm expected=$EXPECTED actual=$ACTUAL path=$(command -v pnpm)"
        # Guardrail: any drift/switch producing a different version fails loudly HERE, not at a
        # cryptic ENOENT later. This is the drift tripwire the whole outage was missing.
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error::pnpm version mismatch — expected $EXPECTED (packageManager) but got $ACTUAL"
          exit 1
        fi
        echo "version=$ACTUAL" >> "$GITHUB_OUTPUT"
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm.outputs.store }}
        # Version IN the key: a store from one pnpm version can never restore into another
        # (that cross-version restore is a documented failure mode — see #1195).
        key: ${{ runner.os }}-pnpm-${{ steps.pnpm.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-${{ steps.pnpm.outputs.version }}-

    - name: Install System Dependencies (Canvas/Sharp)
      if: runner.os == 'Linux' && inputs.install-native-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

    # #1306 CI-HARDENING step 2: every fragile NETWORK step gets a step-level timeout INSIDE a bounded retry.
    # A stalled socket (npm registry, apt mirror, Playwright CDN) is killed at 5m and retried on a fresh
    # connection instead of hanging the whole job (previously → GitHub's 6h default). Bash `timeout` + loop
    # keeps this self-contained (no new third-party action). The trailing `[ $n -lt 3 ]` fails the step if all
    # attempts are exhausted.
    - name: Install Dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: |
        n=0; until [ "$n" -ge 3 ]; do
          timeout 300 pnpm install --frozen-lockfile --prefer-offline && break
          n=$((n+1)); echo "::warning::pnpm install attempt $n failed/timed out; retrying"; sleep 5
        done
        [ "$n" -lt 3 ]

    - name: Remove Problematic Package Repositories
      if: inputs.install-playwright == 'true'
      shell: bash
      run: |
        # Remove Microsoft repos that are causing 403 errors in GitHub Actions
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo rm -f /etc/apt/sources.list.d/azure-cli.list
        echo "Removed problematic Microsoft package repositories"

    # #1306 CI-HARDENING step 4: cache the Playwright browser binaries. `actions/cache` only cached the pnpm
    # store, so EVERY e2e shard re-downloaded Chromium every run. Cache it keyed on the resolved Playwright
    # version; the browser-download step below then skips on a cache hit (speed win — NOT the hang fix).
    - name: Resolve Playwright version
      id: pw
      if: inputs.install-playwright == 'true'
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw-cache
      if: inputs.install-playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-ms-playwright-${{ steps.pw.outputs.version }}

    # #1306 CI-HARDENING step 1: split `playwright install --with-deps chromium` into its TWO operations —
    # OS-library apt install (`install-deps`) and browser-binary download (`install`) — so a future hang
    # NAMES ITSELF (apt vs CDN) instead of hiding inside one merged command.
    # This apt half is NOT timeout-wrapped: apt is bounded natively by the pre-apt `99ci-timeouts` drop-in,
    # and a `timeout ... kill` here would SIGKILL apt mid-transaction and corrupt dpkg (CI-proven `exit 100`).
    # The CDN half below IS timeout+retry-wrapped — a browser download is safe to kill and restart.
    - name: Install Playwright system deps (apt)
      if: inputs.install-playwright == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium

    - name: Install Playwright browser (chromium)
      if: inputs.install-playwright == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        n=0; until [ "$n" -ge 3 ]; do
          timeout 300 pnpm exec playwright install chromium && break
          n=$((n+1)); echo "::warning::playwright install chromium attempt $n failed/timed out; retrying"; sleep 5
        done
        [ "$n" -lt 3 ]

    - name: Setup Supabase CLI
      if: inputs.install-supabase-cli == 'true'
      uses: supabase/setup-cli@v2
      env:
        SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
      with:
        # Pin the CLI so parallel CI shards do not fail resolving "latest"
        # when GitHub release API rate limits are tight. Keep this modern
        # enough to read the repo's Deno v5 lockfile.
        version: 2.101.0
