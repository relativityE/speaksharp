name: Review Evidence (E2E screenshots)

# Produces reviewer-accessible evidence as a GitHub Actions artifact (NOT committed to the repo).
# Runs a chosen Playwright spec against a fresh production build and uploads the screenshots it
# captures. Artifacts are short-lived (retention-days: 1) and named with the PR number and the
# exact reviewed head SHA so a reviewer can trace evidence -> PR -> commit.
#
# Non-blocking: workflow_dispatch only. Never a PR-required check.

on:
  workflow_dispatch:
    inputs:
      spec:
        # Required, no default: the former default (tests/e2e/mode-selector-private-first.e2e.spec.ts) does not exist in the repo.
        description: 'Playwright spec to run for evidence (an existing tests/e2e/*.e2e.spec.ts path)'
        required: true
      pr:
        description: 'PR number this evidence supports'
        required: true
      reviewed_sha:
        description: 'Exact reviewed head SHA (full 40-char)'
        required: true

permissions:
  contents: read

concurrency:
  group: review-evidence-${{ github.ref }}-${{ github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: review-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Build production app (served by serve:e2e)
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: pnpm ci:build

      - name: Run evidence spec
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EDGE_FN_URL: ${{ vars.EDGE_FN_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          STT_ENGINE: mock
          # Codex security review on #1891: the free-form spec input reaches a step holding AGENT_SECRET. It is passed as data
          # through env (never interpolated into the script) and held to an existing tests/e2e/*.e2e.spec.ts path before use.
          EVIDENCE_SPEC: ${{ github.event.inputs.spec }}
        run: |
          case "$EVIDENCE_SPEC" in *..*) echo "::error::spec must not contain '..'"; exit 1 ;; esac
          [[ "$EVIDENCE_SPEC" =~ ^tests/e2e/[A-Za-z0-9._/-]+\.e2e\.spec\.ts$ ]] || { echo "::error::spec must be a tests/e2e/*.e2e.spec.ts path"; exit 1; }
          [ -f "$EVIDENCE_SPEC" ] || { echo "::error::spec does not exist at this commit"; exit 1; }
          npx playwright test "$EVIDENCE_SPEC" --project=full-suite --reporter=line

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p evidence
          # The mode-selector spec writes /tmp/ss-mode-selector-*.png; also sweep test-results.
          cp /tmp/ss-mode-selector-*.png evidence/ 2>/dev/null || true
          find test-results -name '*.png' -exec cp {} evidence/ \; 2>/dev/null || true
          echo "Collected evidence files:"
          ls -la evidence/ || echo "(none)"

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr${{ github.event.inputs.pr }}-${{ github.event.inputs.reviewed_sha }}-mode-selector-screenshots
          path: evidence/
          retention-days: 1
          if-no-files-found: error
