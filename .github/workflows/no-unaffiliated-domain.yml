name: "No unaffiliated domain (zero-reference CI)"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: no-unaffiliated-domain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: zero-reference scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Scan tracked text and paths
        run: node scripts/no-unaffiliated-domain-scan.mjs

  hosted-config:
    # SECURITY (#1279): this job holds SUPABASE_ACCESS_TOKEN — the Supabase MANAGEMENT credential — so it
    # must NEVER run in a pull_request context. On a same-repo PR, `actions/checkout` fetches the PR head and
    # the step below executes PR-controlled JavaScript (scripts/check-hosted-allowed-origin.mjs); a
    # contributor could rewrite that script to exfiltrate the token. Run the credentialed read-only proof
    # ONLY from trusted contexts where the executed code is trusted-base code: a maintainer
    # `workflow_dispatch`, or a `push` to the default branch (post-merge). The zero-reference `scan` job
    # above stays on pull_request precisely because it carries NO secrets. The first run necessarily happens
    # post-merge via the default-branch push; `workflow_dispatch` covers on-demand reruns thereafter.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    name: hosted ALLOWED_ORIGIN read-only check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Inspect hosted value without printing it
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing Supabase read credential or project identifier"
            exit 2
          fi
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/secrets")"
          printf '%s' "$response" | node scripts/check-hosted-allowed-origin.mjs
