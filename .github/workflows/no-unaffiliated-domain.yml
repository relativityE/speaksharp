name: "No unaffiliated domain (zero-reference CI)"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: no-unaffiliated-domain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: zero-reference scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Scan tracked text and paths
        run: node scripts/no-unaffiliated-domain-scan.mjs

  hosted-config:
    # New workflows cannot be manually dispatched until they exist on the default branch. Run the
    # read-only proof on this source PR too. Fork PRs receive empty secrets and fail closed at preflight.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    name: hosted ALLOWED_ORIGIN read-only check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Inspect hosted value without printing it
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing Supabase read credential or project identifier"
            exit 2
          fi
          response="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/secrets")"
          printf '%s' "$response" | node scripts/check-hosted-allowed-origin.mjs
