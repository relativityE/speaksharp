name: Device Qualification Foundation (no evidence upload)

on:
  pull_request:
    branches: [main]
    paths:
      - 'playwright.device-qualification.config.ts'
      - 'tests/e2e/device-qualification-foundation.e2e.spec.ts'
      - 'tests/release/deviceQualificationContract.ts'
      - 'tests/release/deviceQualificationContract.test.ts'
      - '.github/workflows/device-qualification.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  VITE_SUPABASE_URL: https://mock.supabase.co
  VITE_SUPABASE_ANON_KEY: mock_anon_key
  VITE_AUTH_MODE: mock
  VITE_USE_MOCK_AUTH: 'true'

jobs:
  browser-matrix:
    name: ${{ matrix.browser }} responsive/accessibility foundation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVIDENCE_SHA }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install exact browser runtime
        run: pnpm exec playwright install --with-deps "${{ matrix.browser }}"
      - name: Build exact-head application
        run: BUILD_ID="${{ env.EVIDENCE_SHA }}" pnpm build:test
      - name: Run dependency-neutral matrix without retained browser artifacts
        env:
          DEVICE_BROWSER: ${{ matrix.browser }}
        run: pnpm test:device-qualification

