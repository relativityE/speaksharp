name: "CI - Test Audit"

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Run the complete merge-candidate lane'
        type: boolean
        required: false
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  # Replaces the ~79s serial `prepare` barrier. Runs no install (node is preinstalled on the runner)
  # and only classifies the change. scripts/ci-change-scope.mjs is unit-tested and FAILS SAFE: any
  # control path (CI, deps, build/test config, migrations) or unrecognised path selects the full lane,
  # as does any push, any force_full dispatch, any non-draft PR, and any unresolvable diff.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      full_required: ${{ steps.classify.outputs.full_required }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      edge_changed: ${{ steps.classify.outputs.edge_changed }}
      e2e_required: ${{ steps.classify.outputs.e2e_required }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify Change
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ github.event.inputs.force_full || false }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA:-}" ]] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed.txt" || : > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          node scripts/ci-change-scope.mjs "$RUNNER_TEMP/changed.txt"

  # ---- Affected draft lane (NEW, non-required names; drafts cannot merge) ------------------------
  draft-checks:
    name: draft-checks
    needs: scope
    if: needs.scope.outputs.full_required != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-native-deps: ${{ needs.scope.outputs.docs_only != 'true' && 'true' || 'false' }}
          install-playwright: ${{ needs.scope.outputs.e2e_required }}

      - name: Diff Check
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

      - name: Typecheck
        if: needs.scope.outputs.docs_only != 'true'
        run: pnpm typecheck

      - name: Collect Changed Files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }}...HEAD \
            | grep -E '\.(js|jsx|ts|tsx)$' > "$RUNNER_TEMP/changed-code.txt" || true
          grep -E '(^|/)__tests__/|\.(test|spec)\.(js|jsx|ts|tsx)$' "$RUNNER_TEMP/changed-code.txt" \
            > "$RUNNER_TEMP/changed-tests.txt" || true
          echo "changed code files: $(wc -l < "$RUNNER_TEMP/changed-code.txt")"
          echo "changed test files: $(wc -l < "$RUNNER_TEMP/changed-tests.txt")"

      - name: Lint Changed Files
        if: needs.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s "$RUNNER_TEMP/changed-code.txt" ]]; then
            xargs pnpm exec eslint --max-warnings 0 < "$RUNNER_TEMP/changed-code.txt"
          else
            echo "No JS/TS files changed."
          fi

      - name: Documentation Contracts
        if: needs.scope.outputs.docs_only == 'true'
        run: |
          pnpm exec vitest run --config frontend/vitest.config.mjs --coverage.enabled=false \
            tests/config/documentationContract.test.ts tests/deps/docs-integrity.test.js

      - name: Directly Changed Test Files
        if: needs.scope.outputs.docs_only != 'true'
        shell: bash
        env:
          VITEST_MAX_FORKS: '2'
        run: |
          set -euo pipefail
          # `vitest related` selects tests that IMPORT a changed source file; it does not necessarily
          # select a changed test file itself. Run those explicitly.
          if [[ -s "$RUNNER_TEMP/changed-tests.txt" ]]; then
            mapfile -t files < "$RUNNER_TEMP/changed-tests.txt"
            pnpm exec vitest run --config frontend/vitest.config.mjs --coverage.enabled=false \
              --passWithNoTests "${files[@]}"
          else
            echo "No test files changed."
          fi

      - name: Related Unit Tests
        if: needs.scope.outputs.docs_only != 'true'
        shell: bash
        env:
          VITEST_MAX_FORKS: '2'
        run: |
          set -euo pipefail
          if [[ -s "$RUNNER_TEMP/changed-code.txt" ]]; then
            mapfile -t files < "$RUNNER_TEMP/changed-code.txt"
            # --passWithNoTests: a changed file with no importing test must NOT fail the lane.
            pnpm exec vitest related --run --config frontend/vitest.config.mjs \
              --coverage.enabled=false --passWithNoTests "${files[@]}"
          else
            echo "No JS/TS files changed."
          fi

      - name: Build (frontend/e2e-affecting changes only)
        if: needs.scope.outputs.frontend_changed == 'true' || needs.scope.outputs.e2e_required == 'true'
        run: pnpm ci:build

      - name: Setup Deno
        if: needs.scope.outputs.edge_changed == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Tests
        if: needs.scope.outputs.edge_changed == 'true'
        run: pnpm test:edge

      - name: Browser Infrastructure Probe
        if: needs.scope.outputs.e2e_required == 'true'
        env:
          STT_ENGINE: mock
        run: pnpm exec playwright test --config=playwright.config.ts --project=infra-probe

  # BRANCH-PROTECTION COMPATIBILITY GATES (temporary).
  # These names are still required by branch protection on `main`. They no longer run test shards —
  # the unit suite executes exactly ONCE in `unit-coverage` (with coverage + per-file thresholds).
  # Each gate FAILS unless both `unit-coverage` and `full-evidence` succeeded, so a required check can
  # never pass while the real work failed, and a skipped dependency produces a failed (not skipped) check.
  unit-shard:
    name: unit-shard-${{ matrix.shard }}
    needs: [scope, unit-coverage, full-evidence]
    if: always() && needs.scope.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Compatibility Gate
        env:
          UNIT_RESULT: ${{ needs.unit-coverage.result }}
          EVIDENCE_RESULT: ${{ needs.full-evidence.result }}
        run: |
          set -euo pipefail
          echo "unit-coverage=$UNIT_RESULT full-evidence=$EVIDENCE_RESULT"
          if [[ "$UNIT_RESULT" != "success" || "$EVIDENCE_RESULT" != "success" ]]; then
            echo "::error::unit-shard-${{ matrix.shard }} compatibility gate FAILED (unit-coverage=$UNIT_RESULT, full-evidence=$EVIDENCE_RESULT)"
            exit 1
          fi
          echo "Unit suite (single coverage run) and full evidence both succeeded."

  unit-coverage:
    name: unit-coverage
    needs: scope
    if: needs.scope.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-native-deps: 'true'
          install-playwright: 'false'

      - name: Run Unit Coverage (the ONLY full unit execution)
        env:
          VITEST_MAX_FORKS: '2'
        run: pnpm ci:unit

      - name: Upload Unit Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-artifacts
          path: |
            artifacts/coverage
            frontend/coverage
            unit-metrics.json
          retention-days: 30
          if-no-files-found: warn

  edge-tests:
    name: edge-tests
    needs: scope
    if: needs.scope.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'false'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function Tests
        run: pnpm test:edge

  build:
    name: build
    needs: scope
    if: needs.scope.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'false'

      - name: Build Test App
        run: pnpm ci:build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: frontend/dist
          retention-days: 30

  health-check:
    name: health-check
    needs: [scope, build]
    if: needs.scope.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: frontend/dist

      - name: Run Health Check Once
        env:
          STT_ENGINE: mock
        run: pnpm ci:health-check

      - name: Upload Health Check Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: health-check-report
          path: test-results/playwright-infra
          retention-days: 30
          if-no-files-found: error

  e2e:
    name: e2e-shard-${{ matrix.shard }}
    # CI-PERF: E2E consumes only the build artifact, so it no longer waits on unit work,
    # edge tests or health-check. Those still gate the overall result via `report`.
    needs: [scope, build]
    if: success() && needs.scope.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: frontend/dist

      - name: Run E2E Test Shard
        env:
          EDGE_FN_URL: ${{ vars.EDGE_FN_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          STT_ENGINE: mock
        run: pnpm ci:test ${{ matrix.shard }}

      - name: Upload Shard Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shard-report-${{ matrix.shard }}
          path: |
            blob-report
            test-results/playwright
          retention-days: 30
          if-no-files-found: warn

      # UX review screenshots (post-save consolidation + mode selector). ONE uploader, both paths.
      # Uploaded on whichever shard ran the producing spec; empty on the others.
      # Reviewers: download "ux-review-screenshots-*".
      - name: Upload UX Review Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ux-review-screenshots-shard-${{ matrix.shard }}
          path: |
            test-results/post-save-consolidation
            test-results/mode-selector
            test-results/practice-entry
          retention-days: 1
          if-no-files-found: ignore

  lighthouse-advisory:
    name: lighthouse-advisory
    needs: [scope, build]
    if: always() && !cancelled() && needs.scope.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: frontend/dist

      - name: Run Lighthouse CI Advisory
        run: |
          echo "=== Build artifacts check ==="
          ls -la frontend/ || echo "frontend/ not found"
          ls -la frontend/dist/ || echo "frontend/dist/ not found"

          echo "=== Port 4173 Status Check ==="
          lsof -i :4173 || echo "Port 4173 is available"

          mkdir -p lighthouse-results
          node scripts/generate-lhci-config.js
          npx lhci autorun || echo "⚠️ Lighthouse advisory failed; release gate continues."

          echo "=== LHCI Results Debug ==="
          ls -R lighthouse-results || echo "Directory empty or missing"

      - name: Upload Lighthouse Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-report
          path: lighthouse-results/
          retention-days: 30
          if-no-files-found: warn

  # Heavy evidence generation for the FULL lane. It installs dependencies because it genuinely needs
  # them (playwright merge-reports, ci:report:github, aggregate-ci, report-ci-timing). Splitting this
  # out keeps the required `report` gate thin AND keeps evidence inside the acceptance result.
  full-evidence:
    name: full-evidence
    needs: [scope, unit-coverage, edge-tests, build, health-check, e2e, lighthouse-advisory]
    if: always() && !cancelled() && needs.scope.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List Artifacts
        run: ls -R artifacts

      - name: Organize Canonical Artifacts
        run: |
          mkdir -p artifacts/coverage artifacts/playwright artifacts/lighthouse artifacts/metrics frontend

          if [ -d "artifacts/build-artifacts" ]; then
            mkdir -p frontend/dist
            cp -r artifacts/build-artifacts/* frontend/dist/
          fi

          if [ -d "artifacts/unit-artifacts/artifacts/coverage" ]; then
            cp -r artifacts/unit-artifacts/artifacts/coverage/* artifacts/coverage/ 2>/dev/null || true
          fi
          if [ -d "artifacts/unit-artifacts/frontend/coverage" ]; then
            cp -r artifacts/unit-artifacts/frontend/coverage/* artifacts/coverage/ 2>/dev/null || true
          fi
          cp artifacts/unit-artifacts/unit-metrics.json artifacts/metrics/ 2>/dev/null || true
          cp artifacts/unit-artifacts/unit-metrics.json . 2>/dev/null || true

          find artifacts -type f -name 'report-*.zip' | while read report; do
            shard_num=$(basename "$report" .zip | sed 's/report-//')
            mkdir -p artifacts/playwright/shard-${shard_num}
            cp "$report" artifacts/playwright/shard-${shard_num}/
          done

          if [ -d "artifacts/lighthouse-report" ]; then
            cp -r artifacts/lighthouse-report/* artifacts/lighthouse/ 2>/dev/null || true
          fi

          echo "✅ Canonical artifacts organized in /artifacts"
          ls -R artifacts/

      - name: Merge E2E Reports
        run: |
          mkdir -p test-results/playwright artifacts/playwright-merge
          find artifacts/playwright -type f -name '*.zip' -exec cp {} artifacts/playwright-merge/ \;

          if [ "$(find artifacts/playwright-merge -type f -name '*.zip' | wc -l)" -gt 0 ]; then
            pnpm exec playwright merge-reports --reporter json,html artifacts/playwright-merge > test-results/playwright/results.json
            echo "✅ Merged E2E report saved to test-results/playwright/results.json"
          else
            echo "⚠️ No E2E reports to merge"
          fi

      - name: Generate Final Report
        run: pnpm ci:report:github

      - name: Aggregate CI Metrics
        run: node scripts/aggregate-ci.mjs

      - name: Report CI Timing And Failures
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/report-ci-timing.mjs

      - name: Upload CI Metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-metrics
          path: |
            artifacts/ci-metrics.json
            artifacts/ci-wall-clock.json
            artifacts/ci-job-timing.json
            product_release/evidence/software-quality.latest.json
            product_release/evidence/software-quality-summary.latest.md
          retention-days: 30
          if-no-files-found: warn

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Assert Required Evidence Is Present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          [[ -s artifacts/coverage/coverage-summary.json ]] || { echo "::error::missing coverage-summary.json"; missing=1; }
          [[ -f unit-metrics.json || -f artifacts/metrics/unit-metrics.json ]] || { echo "::error::missing unit-metrics.json"; missing=1; }
          if ! ls artifacts/playwright/shard-*/ >/dev/null 2>&1; then
            echo "::error::missing Playwright shard evidence"; missing=1
          fi
          # Lighthouse is advisory and may be intentionally skipped by path policy — not required.
          exit "$missing"

  # ---- Thin, stable required gate ---------------------------------------------------------------
  # No checkout, no setup action, no dependency install, no cache restore. It only evaluates the
  # conclusions of whichever lane was selected — including full-evidence, so evidence generation can
  # never fail *after* the gate has already passed.
  report:
    name: report
    needs: [scope, draft-checks, unit-coverage, edge-tests, build, health-check, e2e, full-evidence]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Selected Lane
        env:
          FULL_REQUIRED: ${{ needs.scope.outputs.full_required }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          DRAFT_RESULT: ${{ needs.draft-checks.result }}
          UNIT_RESULT: ${{ needs.unit-coverage.result }}
          EDGE_RESULT: ${{ needs.edge-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          HEALTH_RESULT: ${{ needs.health-check.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          EVIDENCE_RESULT: ${{ needs.full-evidence.result }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "::error::change classification failed (scope=$SCOPE_RESULT); refusing to accept."
            exit 1
          fi
          if [[ "$FULL_REQUIRED" == "true" ]]; then
            echo "Full merge-candidate lane: unit=$UNIT_RESULT edge=$EDGE_RESULT build=$BUILD_RESULT health=$HEALTH_RESULT e2e=$E2E_RESULT evidence=$EVIDENCE_RESULT"
            for r in "$UNIT_RESULT" "$EDGE_RESULT" "$BUILD_RESULT" "$HEALTH_RESULT" "$E2E_RESULT" "$EVIDENCE_RESULT"; do
              [[ "$r" == "success" ]] || { echo "::error::full lane failed"; exit 1; }
            done
            echo "Full merge-candidate lane passed."
          else
            echo "Affected draft lane: draft-checks=$DRAFT_RESULT"
            [[ "$DRAFT_RESULT" == "success" ]] || { echo "::error::draft lane failed"; exit 1; }
            echo "Affected draft lane passed."
          fi
