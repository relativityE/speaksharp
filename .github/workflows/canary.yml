name: Production Canary Smoke Test

on:
  push:
    branches: [main]
  # workflow_dispatch stays ONLY as an active-trial diagnostic. It has NO billing input and can NEVER select
  # or count as the paid billing qualification — that runs strictly on the weekly schedule (no manual route).
  workflow_dispatch: {}
  schedule:
    # DAILY — the genuine active-trial product canary (complete Pro product path).
    - cron: '0 5 * * *'
    # WEEKLY (Mondays) — active-trial PLUS the automated Stripe test-mode/test-clock billing qualification.
    - cron: '0 6 * * 1'

# Partition concurrency so the DAILY active-trial cadence and the WEEKLY billing-qualification cadence NEVER
# cancel or replace each other: they live in separate groups. Within a group a newer run supersedes an older
# one of the SAME kind. Only the WEEKLY schedule is the `billing` group; every other trigger is `active-trial`.
concurrency:
  group: canary-${{ github.ref }}-${{ github.event.schedule == '0 6 * * 1' && 'billing' || 'active-trial' }}
  cancel-in-progress: true

jobs:
  migration-readiness:
    name: read-only runtime migration readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      state: ${{ steps.readiness.outputs.state }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0

      - name: Read exact production migration history
        working-directory: backend/supabase
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration list 2>&1 | tee "$RUNNER_TEMP/canary-migrations.txt"

      - name: Evaluate canary runtime prerequisite
        id: readiness
        run: |
          set -euo pipefail
          result="$(node scripts/canary-migration-readiness.mjs "$RUNNER_TEMP/canary-migrations.txt")"
          echo "ready=$(jq -r '.ready' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r '.state' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "### Canary migration readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required ordered set (all must be applied): \`20260812002000\` → \`20260811143000\` → \`20260812030000\` → \`20260812039500\` → \`20260812040000\` → \`20260812041000\` → \`20260812041500\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Held (must NOT be applied): \`20260812042000\` (commercial activation)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Read-only state: \`$(jq -r '.state' <<<"$result")\`" >> "$GITHUB_STEP_SUMMARY"
          state="$(jq -r '.state' <<<"$result")"
          if [ "$state" = 'activation-applied' ]; then
            # The held commercial-activation migration 20260812042000 is applied — an UNEXPECTED activated
            # state for this closeout. Fail closed (hard error); neither product lane may run.
            echo "- **FAIL CLOSED — held commercial-activation migration \`20260812042000\` is applied; the canary must not run in an activated state.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Held activation migration 20260812042000 is applied — canary fails closed."
            exit 1
          fi
          if [ "$(jq -r '.ready' <<<"$result")" != 'true' ]; then
            echo "- **HOLD — required migration(s) pending: \`$(jq -r '(.pending // []) | join(", ")' <<<"$result")\`; canary product lanes were not executed.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  canary-check:
    name: canary-check (${{ matrix.lane }})
    needs: migration-readiness
    if: ${{ needs.migration-readiness.outputs.ready == 'true' }}
    strategy:
      fail-fast: false
      # DAILY (and push): the active-trial lane proves the complete product through a genuine active trial.
      # WEEKLY (Mondays, or an optional opt-in dispatch): ALSO run the automated Stripe test-mode/test-clock
      # billing-qualification lane. It never charges a real card and is never implied by a daily green canary.
      matrix:
        lane: ${{ fromJSON(github.event.schedule == '0 6 * * 1' && '["active-trial","billing-qualification"]' || '["active-trial"]') }}
    runs-on: ubuntu-latest
    # 15 (was 10) so the #1106 deploy-race gate can spend its full budget and still emit its diagnostic:
    # the smoke test may now wait up to 4 min for the expected SHA to go live, plus 2 min for the product
    # path, on top of checkout/setup/provision. Without this the JOB would be killed before the test could
    # report DEPLOYMENT NOT LIVE — the same generic-timeout failure mode the gate exists to eliminate.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Validate protected canary identities
        env:
          # #1294 email cutover: canary EMAILS resolve from repository Variables (non-secret, operator-owned).
          # BOTH emails are ALWAYS validated for distinctness/domain (a config invariant used for ceiling
          # safety). Only the EXECUTING lane's credential is required: the active-trial lane needs
          # CANARY_TRIAL_PASSWORD; the billing-qualification lane authenticates to Stripe (validated in its own
          # step), NOT a canary account, so it requires no canary password here.
          CANARY_TRIAL_EMAIL: ${{ vars.CANARY_TRIAL_EMAIL }}
          CANARY_PAID_EMAIL: ${{ vars.CANARY_PAID_EMAIL }}
          CANARY_EXPECTED_ACCESS: ${{ matrix.lane }}
          CANARY_LANE_PASSWORD: ${{ matrix.lane == 'active-trial' && secrets.CANARY_TRIAL_PASSWORD || '' }}
        run: node scripts/canary-identity-config.mjs

      # ── Routine active-trial lane: the COMPLETE Pro product path through a genuine, server-active 30-day
      #    trial (its effective tier is already 'pro'). Read-only sign-in; never mutates or charges. ──
      - name: Provision Canary User (active-trial)
        if: matrix.lane == 'active-trial'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          # READ-ONLY canary: the PUBLIC anon key is the ONLY credential. No service-role key is injected —
          # the canary cannot create an account, reset a password, or grant/extend a trial. Any sign-in or
          # verification failure fails closed.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CANARY_LANE_PASSWORD: ${{ secrets.CANARY_TRIAL_PASSWORD }}
          CANARY_EMAIL: ${{ vars.CANARY_TRIAL_EMAIL }}
          CANARY_EXPECTED_ACCESS: active-trial
          CANARY_MAX: '2'
          CANARY_ENFORCE: fail
        run: node scripts/provision-canary.mjs

      - name: Run Smoke Test (active-trial product path)
        if: matrix.lane == 'active-trial'
        env:
          VITE_TEST_MODE: "true"
          VITE_USE_LIVE_DB: "true"
          CANARY_LANE_PASSWORD: ${{ secrets.CANARY_TRIAL_PASSWORD }}
          CANARY_EMAIL: ${{ vars.CANARY_TRIAL_EMAIL }}
          CANARY_EXPECTED_ACCESS: active-trial
          BASE_URL: https://speaksharp-public.vercel.app/
          # #1106 deploy-race gate: the commit this run was triggered from. The canary must confirm the
          # deployed build (window.__APP_RELEASE__) equals this SHA BEFORE it asserts product behavior.
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: pnpm test:deploy:prod

      # ── Automated WEEKLY Stripe test-mode/test-clock billing lifecycle qualification. NO live charge, NO real
      #    card. It fails closed BEFORE creating anything unless Stripe proves livemode=false with a sk_test_ key
      #    and a test-mode Price, then drives checkout → webhook → renewal → payment failure → cancellation →
      #    continuation on a Stripe TEST CLOCK. It does NOT sign in as, or depend on, the canary-paid account or
      #    its password. The strict production paid verifier (provision-canary paid lane) is PRESERVED for a
      #    future, separately-authorized live commercial-readiness proof — it is NOT this scheduled lane. ──
      - name: Setup Deno (billing qualification)
        if: matrix.lane == 'billing-qualification'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Stripe Test-Mode/Test-Clock Billing Qualification (billing-qualification)
        if: matrix.lane == 'billing-qualification'
        env:
          # Test-scoped Stripe credentials ONLY. Live keys are refused (below + inside the runner's
          # assertStripeTestMode preflight) before any Stripe object is created.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_TEST_PRO_PRICE_ID }}
        run: |
          set -euo pipefail
          # Defence in depth (the runner also proves livemode=false): refuse a live key outright up front.
          case "${STRIPE_SECRET_KEY:-}" in
            sk_live_*) echo '::error::Billing qualification is TEST-MODE only; a live Stripe key was supplied.'; exit 1 ;;
            sk_test_*) : ;;
            *) echo '::error::Billing qualification requires a Stripe TEST secret key (sk_test_...).'; exit 1 ;;
          esac
          # Deno runs the REAL stripe-webhook handler against an ephemeral migrated PGlite DB (no prod Supabase).
          deno run --config scripts/billing-qualification/deno.json --node-modules-dir=auto --allow-read --allow-write --allow-env --allow-net --allow-ffi --allow-sys \
            scripts/billing-qualification/qualify.ts

      # Admin hygiene is SEPARATE from the tester-equivalent product smoke above and runs regardless of
      # its result (if: always()), so a hygiene problem never masks the product result — and with
      # CANARY_ENFORCE=fail an unverifiable ceiling fails the job (never silently "green").
      - name: Canary Account Ceiling (hygiene)
        if: always()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CANARY_TRIAL_EMAIL: ${{ vars.CANARY_TRIAL_EMAIL }}
          CANARY_PAID_EMAIL: ${{ vars.CANARY_PAID_EMAIL }}
          CANARY_MAX: '2'
          CANARY_ENFORCE: fail
        run: node scripts/canary-ceiling.mjs

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canary-test-results-${{ matrix.lane }}
          path: |
            playwright-report/
            test-results/canary/
          retention-days: 7

      - name: Cleanup Secrets
        if: always()
        run: rm -f .env.development

  canary-result:
    name: canary-result
    if: always()
    needs: [migration-readiness, canary-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require truthful terminal state
        env:
          READINESS_RESULT: ${{ needs.migration-readiness.result }}
          MIGRATION_READY: ${{ needs.migration-readiness.outputs.ready }}
          PRODUCT_LANES_RESULT: ${{ needs.canary-check.result }}
          # This run INCLUDED the billing-qualification lane iff it is the weekly schedule or an opt-in dispatch.
          # The billing-qualification lane runs ONLY on the weekly schedule — there is no manual route.
          BILLING_QUALIFICATION_RAN: ${{ github.event.schedule == '0 6 * * 1' }}
        run: |
          set -euo pipefail
          if [ "$READINESS_RESULT" != 'success' ]; then
            echo '::error::Canary migration readiness could not be established.'
            exit 1
          fi
          if [ "$MIGRATION_READY" != 'true' ]; then
            echo '## HOLD — migration pending; canary not executed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Daily active-trial product lane: produced no evidence (held).' >> "$GITHUB_STEP_SUMMARY"
            if [ "$BILLING_QUALIFICATION_RAN" = 'true' ]; then
              echo 'Weekly Stripe test-mode/test-clock billing qualification: produced no evidence (held).' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'Weekly billing qualification: not part of this run (daily active-trial cadence).' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if [ "$PRODUCT_LANES_RESULT" != 'success' ]; then
            if [ "$BILLING_QUALIFICATION_RAN" = 'true' ]; then
              echo '::error::The active-trial product lane or the weekly Stripe test-mode/test-clock billing qualification failed.'
            else
              echo '::error::The required daily active-trial product lane failed.'
            fi
            exit 1
          fi
          echo '## Canary qualification passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Daily active-trial product journey: completed.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$BILLING_QUALIFICATION_RAN" = 'true' ]; then
            echo 'Weekly Stripe test-mode/test-clock billing qualification: completed (no live charge).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Weekly billing qualification: not part of this run (runs automatically every Monday).' >> "$GITHUB_STEP_SUMMARY"
          fi
