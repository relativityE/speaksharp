name: Production Canary Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Every day at 5 AM UTC

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary-check:
    runs-on: ubuntu-latest
    # 15 (was 10) so the #1106 deploy-race gate can spend its full budget and still emit its diagnostic:
    # the smoke test may now wait up to 4 min for the expected SHA to go live, plus 2 min for the product
    # path, on top of checkout/setup/provision. Without this the JOB would be killed before the test could
    # report DEPLOYMENT NOT LIVE — the same generic-timeout failure mode the gate exists to eliminate.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Provision Canary User
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          # Sign-in-first: the healthy path uses the public anon flow (the same path testers authenticate
          # through) and read-only verifies the local paid profile binding. Authoritative Stripe identity,
          # active status, and approved-price proof are required by the coordinated cutover runbook. CI
          # never resets a one-shot sample, grants Pro, or extends a customer-style trial.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Service-role is the RECOVERY-only path (deterministic invalid-credentials → account lookup /
          # create-or-sync). An auth/config rejection here is reported as a scoped, actionable config
          # failure that affects recovery only; the healthy path never depends on it. No key is rotated.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CANARY_PASSWORD: ${{ secrets.CANARY_PASSWORD }}
          # Stable email so provision-canary.mjs reuses ONE account every run (its idempotent
          # create-or-sync pattern) instead of minting a new canary-* user each run and bloating
          # auth.users. The job concurrency guard above (one run per ref, cancel-in-progress) already
          # prevents overlapping runs, so a fixed email is safe.
          CANARY_EMAIL: canary@speaksharp.app
          # Ceiling guard: at most CANARY_MAX canary-like accounts may exist (reuse, never accumulate).
          # The legacy canary-<runid> residue has been deleted, so this is now fail-closed: if a stray
          # canary-* account ever reappears (count > 1), the canary job hard-fails to surface it.
          CANARY_MAX: '1'
          CANARY_ENFORCE: fail
        run: node scripts/provision-canary.mjs

      - name: Run Smoke Test
        env:
          VITE_TEST_MODE: "true"
          VITE_USE_LIVE_DB: "true"
          CANARY_PASSWORD: ${{ secrets.CANARY_PASSWORD }}
          CANARY_EMAIL: canary@speaksharp.app
          BASE_URL: https://speaksharp-public.vercel.app/
          # #1106 deploy-race gate: the commit this run was triggered from. The canary must confirm the
          # deployed build (window.__APP_RELEASE__) equals this SHA BEFORE it asserts product behavior —
          # otherwise a run that fires ~90s after merge (before Vercel finishes) tests the PREVIOUS build
          # and misattributes a stale result to the new commit. On push=the pushed commit; on
          # dispatch/schedule=main HEAD; on a re-run=the original commit (all are the SHA that should be live).
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: pnpm test:deploy:prod

      # Admin hygiene is SEPARATE from the tester-equivalent product smoke above and runs regardless of
      # its result (if: always()), so a hygiene problem never masks the product result — and with
      # CANARY_ENFORCE=fail an unverifiable ceiling fails the job (never silently "green").
      - name: Canary Account Ceiling (hygiene)
        if: always()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CANARY_MAX: '1'
          CANARY_ENFORCE: fail
        run: node scripts/canary-ceiling.mjs

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canary-test-results
          path: |
            playwright-report/
            test-results/canary/
          retention-days: 7

      - name: Cleanup Secrets
        if: always()
        run: rm -f .env.development
