name: Stress and Endurance

on:
  workflow_dispatch:
    inputs:
      new_free_count:
        description: 'Free Users'
        required: false
        default: '0'
        type: string
      new_pro_count:
        description: 'Pro Users'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '0 4 * * *' # Every day at 4 AM UTC

jobs:
  run-stress-endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Setup test users
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOAK_TEST_PASSWORD: ${{ secrets.SOAK_TEST_PASSWORD }}
          MODE: "soak"
          NEW_FREE_COUNT: ${{ github.event.inputs.new_free_count || '0' }}
          NEW_PRO_COUNT: ${{ github.event.inputs.new_pro_count || '0' }}
        run: node scripts/setup-test-users.mjs
      
      - name: Run backend stress check
        env:
          SOAK_TEST_PASSWORD: ${{ secrets.SOAK_TEST_PASSWORD }}
          API_LOAD_CONCURRENCY: "15"
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: pnpm test:stress:backend

      - name: Run browser endurance check
        env:
          VITE_TEST_MODE: "true"
          VITE_USE_LIVE_DB: "true"
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SOAK_TEST_PASSWORD: ${{ secrets.SOAK_TEST_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # The duration is owned by tests/constants.ts (SOAK_MEMORY_DURATION_MS), which resolves its own
          # default when the variable is unset. It is not re-parsed from that file here: the former
          # `grep | grep | tr` masked its own failure and took the WRONG number whenever the default was not a
          # bare literal (`10 * 60000;` became 60000 — one minute, not ten). #1315.
          pnpm test:endurance:browser

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stress-endurance-results
          path: |
            test-results/stress/
            test-results/endurance/
            test-results/soak/
            test-results/soak-report/
          retention-days: 7
