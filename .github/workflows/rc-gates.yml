name: Release Candidate Gates

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or preview URL for live/UX gates
        required: false
        default: https://speaksharp-public.vercel.app
      stripe_webhook_secret_sha256:
        description: Supabase TEST STRIPE_WEBHOOK_SECRET SHA-256 digest for the controlled/non-paid equality proof
        required: false
        default: a3f5b0be67a3e8c24d7eaae36deef5649dba96fa18d00e4ef6fdeb05309ad937
      stripe_live_webhook_secret_sha256:
        description: Supabase LIVE STRIPE_WEBHOOK_SECRET SHA-256 digest for the paid-launch equality proof (required when paid_launch=true; release-owner supplied, fails closed if absent)
        required: false
        default: ''
      gate:
        description: Gate to run
        required: true
        default: all
        type: choice
        options:
          - all
          - gate-1-product
          - gate-2-sast
          - gate-3-dast
          - gate-4-sca
          - gate-5-ux
          - comparison-authorization
      diagnostic_dast_spec:
        description: 'DIAGNOSTIC ONLY — run a single live-DAST spec file for root-cause classification (e.g. tests/live/stt-switching-contract.live.spec.ts). EMPTY = full Gate 3 unchanged. A diagnostic run is NOT a Gate 3 pass.'
        required: false
        default: ''
      diagnostic_dast_grep:
        description: 'DIAGNOSTIC ONLY — restrict the single spec to tests matching this title (used with diagnostic_dast_spec).'
        required: false
        default: ''
      comparison_cell:
        description: 'COMPARISON ONLY (gate comparison-authorization, or the #1437 diagnostic) — the ONE cell (candidate/journey) this run authorizes; none = no authorization. The nonce is minted inside this run; no key or second workflow exists.'
        required: false
        default: none
        type: choice
        options:
          - none
          - 'v2:base.en/open_mic'
          - 'v2:base.en/focus_points'
          - 'v4:distil:q4/open_mic'
          - 'v4:distil:q4/focus_points'
      comparison_release_sha:
        description: 'COMPARISON ONLY — exact 40-character release SHA: must equal the dispatched head this run executes and the release Production serves.'
        required: false
        default: ''
      comparison_evidence_document_id:
        description: 'COMPARISON ONLY — lowercase UUIDv4 evidence document shared by one four-cell packet.'
        required: false
        default: ''
      paid_launch:
        description: "Set to 'true' to ALSO run the PAID Stripe live-readiness specs in Gate 3 (checkout / webhook / billing-portal). Default empty = CONTROLLED non-paid scope: paid Stripe readiness is a separate paid-launch concern and does NOT gate the controlled soft release."
        required: false
        default: ''

permissions:
  contents: read
  # #1432 PM decision 5651684739 — trusted Node live-reads this run's own attempt and jobs; nothing is written.
  actions: read

jobs:
  gate-1-product:
    name: Gate 1 - Product Truth
    if: ${{ github.event.inputs.gate == 'all' || github.event.inputs.gate == 'gate-1-product' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'
      - name: Run Product Truth Gate
        env:
          # Public Supabase build env (required by validate-env/build:test).
          # Non-secret client values; never the service-role key.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EDGE_FN_URL: ${{ vars.EDGE_FN_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          STT_ENGINE: mock
        run: pnpm rc:gate:1:product

  gate-2-sast:
    name: Gate 2 - SAST / OWASP Code Review
    if: ${{ github.event.inputs.gate == 'all' || github.event.inputs.gate == 'gate-2-sast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'false'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run SAST Gate
        run: pnpm rc:gate:2:sast

  gate-3-dast:
    name: Gate 3 - DAST / Running App
    if: ${{ github.event.inputs.gate == 'all' || github.event.inputs.gate == 'gate-3-dast' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'
      - name: Classify Gate 3 evidence target
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EVIDENCE_SCOPE: ${{ github.event.inputs.diagnostic_dast_spec == '' && 'canonical-production' || 'diagnostic' }}
          EVIDENCE_ELIGIBILITY_FILE: ${{ runner.temp }}/gate-3-evidence-eligibility.json
        run: node scripts/rc-evidence-target-preflight.mjs
      - name: Run DAST Local Gate
        if: ${{ github.event.inputs.diagnostic_dast_spec == '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          PRO_TEST_EMAIL: ${{ vars.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          EDGE_FN_URL: ${{ vars.EDGE_FN_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: pnpm rc:dast:local
      # Controlled/non-paid equality proof: the GitHub TEST webhook secret matches the digest of the
      # Supabase test webhook verifier. Default digest is the prior generic (test) secret's SHA-256;
      # if STRIPE_TEST_WEBHOOK_SECRET differs from the old generic, this step surfaces it (fails).
      - name: Verify Stripe Webhook Secret Digest (test)
        if: ${{ github.event.inputs.diagnostic_dast_spec == '' }}
        env:
          SECRET_DIGEST_LABEL: STRIPE_TEST_WEBHOOK_SECRET
          SECRET_VALUE: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          EXPECTED_SHA256: ${{ github.event.inputs.stripe_webhook_secret_sha256 }}
        run: node scripts/verify-secret-digest.mjs
      # Paid-launch equality proof: the GitHub LIVE webhook secret matches the deployed Supabase LIVE
      # webhook verifier. Runs ONLY in paid scope and requires the release-owner-supplied live digest
      # (verify-secret-digest.mjs fails closed if stripe_live_webhook_secret_sha256 is absent).
      - name: Verify Stripe Webhook Secret Digest (live, paid-launch only)
        if: ${{ github.event.inputs.diagnostic_dast_spec == '' && github.event.inputs.paid_launch == 'true' }}
        env:
          SECRET_DIGEST_LABEL: STRIPE_LIVE_WEBHOOK_SECRET
          SECRET_VALUE: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}
          EXPECTED_SHA256: ${{ github.event.inputs.stripe_live_webhook_secret_sha256 }}
        run: node scripts/verify-secret-digest.mjs
      - name: Verify live test-user profile rows
        if: ${{ github.event.inputs.diagnostic_dast_spec == '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FREE_TEST_EMAIL: ${{ vars.FREE_TEST_EMAIL }}
          PRO_TEST_EMAIL: ${{ vars.PRO_TEST_EMAIL }}
        run: pnpm verify:test-users
      - name: Run DAST Live Gate
        if: ${{ github.event.inputs.diagnostic_dast_spec == '' }}
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EVIDENCE_SCOPE: canonical-production
          EVIDENCE_ELIGIBILITY_FILE: ${{ runner.temp }}/gate-3-evidence-eligibility.json
          # #960: pass Vercel Protection Bypass so DAST can reach a PROTECTED preview (fix validation /
          # per-commit bisect). No-op against the public prod URL. playwright.deployed-live.config.ts
          # sends x-vercel-protection-bypass when this is set.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          FREE_TEST_EMAIL: ${{ vars.FREE_TEST_EMAIL }}
          FREE_TEST_PASSWORD: ${{ secrets.FREE_TEST_PASSWORD }}
          PRO_TEST_EMAIL: ${{ vars.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          EDGE_FN_URL: ${{ vars.EDGE_FN_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: pnpm rc:dast:live
      # PAID Stripe live-readiness (checkout/webhook/billing-portal) is a SEPARATE paid-launch
      # concern (release-owner 2026-06-18). It does NOT gate the controlled non-paid soft release
      # and runs only when paid_launch == 'true'. Requires the four-corner live Stripe alignment
      # (Vercel pk_live + Supabase sk_live/whsec/SITE_URL + valid live customer) — see
      # product_release/LAUNCH_ENV_CHECKLIST.md §1. A controlled-scope run leaves these unrun.
      - name: Run DAST Live Gate — PAID Stripe readiness (paid-launch scope only)
        if: ${{ github.event.inputs.diagnostic_dast_spec == '' && github.event.inputs.paid_launch == 'true' }}
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EVIDENCE_SCOPE: canonical-production
          EVIDENCE_ELIGIBILITY_FILE: ${{ runner.temp }}/gate-3-evidence-eligibility.json
          # #960: pass Vercel Protection Bypass so DAST can reach a PROTECTED preview (fix validation /
          # per-commit bisect). No-op against the public prod URL. playwright.deployed-live.config.ts
          # sends x-vercel-protection-bypass when this is set.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || secrets.STRIPE_PUBLISHABLE_KEY }}
          # The test-scoped STRIPE_TEST_WEBHOOK_SECRET stays test-only. The paid webhook-readiness
          # spec signs with STRIPE_LIVE_WEBHOOK_SECRET (the LIVE endpoint whsec, Ops-created) so the
          # signature matches the deployed Supabase live verifier; the spec fails fast if it's absent.
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}
          FREE_TEST_EMAIL: ${{ vars.FREE_TEST_EMAIL }}
          FREE_TEST_PASSWORD: ${{ secrets.FREE_TEST_PASSWORD }}
          PRO_TEST_EMAIL: ${{ vars.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          # stripe-checkout-readiness consumes CHECKOUT_TEST_EMAIL/CHECKOUT_TEST_PASSWORD as ONE atomic
          # pair and fails closed when either is absent. There is no FREE/PRO fallback any more: the old
          # chains could run this gate as the wrong role, or assemble a mixed pair from two identities,
          # and a missing credential skipped the gate so it reported green having proven nothing.
          #
          # #1294 sourcing split, completed: this email is an IDENTIFIER, so the Variable is the ONLY source.
          # It was the one test-account email the cutover missed. The Secret is no longer read here, and the
          # forbidden-token guard now covers the name, so the old source cannot return. If the Variable is
          # unset this gate FAILS rather than substituting the Free reviewer — the spec consumes the
          # dedicated checkout pair atomically and fails closed.
          CHECKOUT_TEST_EMAIL: ${{ vars.CHECKOUT_TEST_EMAIL }}
          CHECKOUT_TEST_PASSWORD: ${{ secrets.CHECKOUT_TEST_PASSWORD }}
          EDGE_FN_URL: ${{ vars.EDGE_FN_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
        run: pnpm rc:gate:3:dast:paid
      # #1432 PM decisions 5651684739 / 5651830241 — NONQUALIFYING #1437 FIXTURE DIAGNOSTIC. It may mint and check its own
      # nonce inside this job, before navigation, and keeps the terminal rejection below. The mint refuses unless the
      # owner dispatched and triggered (reruns included) this definition at the exact release the run executes. No key,
      # secret, variable or second workflow; no wall-clock expiry. Any refusal fails this step, so no product step runs.
      - name: Authorize the model-comparison cell in this run (DIAGNOSTIC comparison only)
        if: ${{ github.event.inputs.diagnostic_dast_spec != '' && github.event.inputs.comparison_cell != 'none' }}
        env:
          COMPARISON_CELL: ${{ github.event.inputs.comparison_cell }}
          RELEASE_SHA: ${{ github.event.inputs.comparison_release_sha }}
          EVIDENCE_DOCUMENT_ID: ${{ github.event.inputs.comparison_evidence_document_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          AUTHORIZATION_OUT: ${{ runner.temp }}/model-comparison-authorization/model-comparison-authorization.json
        run: |
          set -euo pipefail
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::HOLD: comparison_release_sha is not the exact commit this run executes"; exit 1
          fi
          node scripts/human-test/mint-model-comparison-authorization.mjs
      - name: Run DAST Live Gate (DIAGNOSTIC single spec — NOT a Gate 3 pass)
        if: ${{ github.event.inputs.diagnostic_dast_spec != '' }}
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EVIDENCE_SCOPE: diagnostic
          EVIDENCE_ELIGIBILITY_FILE: ${{ runner.temp }}/gate-3-evidence-eligibility.json
          # #960: pass Vercel Protection Bypass so DAST can reach a PROTECTED preview (fix validation /
          # per-commit bisect). No-op against the public prod URL. playwright.deployed-live.config.ts
          # sends x-vercel-protection-bypass when this is set.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          FREE_TEST_EMAIL: ${{ vars.FREE_TEST_EMAIL }}
          FREE_TEST_PASSWORD: ${{ secrets.FREE_TEST_PASSWORD }}
          PRO_TEST_EMAIL: ${{ vars.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          # #1492 — this step can run ANY live spec, including stripe-checkout-readiness, which now accepts
          # only the dedicated checkout pair. FREE/PRO stay for the other specs this path can select.
          CHECKOUT_TEST_EMAIL: ${{ vars.CHECKOUT_TEST_EMAIL }}
          CHECKOUT_TEST_PASSWORD: ${{ secrets.CHECKOUT_TEST_PASSWORD }}
          EDGE_FN_URL: ${{ vars.EDGE_FN_URL }}
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          DIAGNOSTIC_DAST_SPEC: ${{ github.event.inputs.diagnostic_dast_spec }}
          DIAGNOSTIC_DAST_GREP: ${{ github.event.inputs.diagnostic_dast_grep }}
          # #1432 PM decision 5651684739 — the authorization minted by the previous step of THIS run. Empty when no cell was
          # dispatched, so the spec HOLDs before product steps. The token is used only in Node to read this run attempt.
          MODEL_COMPARISON_AUTHORIZATION_FILE: ${{ github.event.inputs.comparison_cell != 'none' && format('{0}/model-comparison-authorization/model-comparison-authorization.json', runner.temp) || '' }}
          MODEL_COMPARISON_GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "DIAGNOSTIC_SINGLE_SPEC=true"
          echo "::warning::DIAGNOSTIC single-spec run — NOT a full Gate 3 pass. Release gate stays FAIL until a full Gate 3 run (no diagnostic input) passes."
          echo "spec=$DIAGNOSTIC_DAST_SPEC grep=${DIAGNOSTIC_DAST_GREP:-<none>}"
          node scripts/rc-dast-live-preflight.mjs
          if [ -n "$DIAGNOSTIC_DAST_GREP" ]; then
            VITE_USE_LIVE_DB=true pnpm exec playwright test "$DIAGNOSTIC_DAST_SPEC" --grep "$DIAGNOSTIC_DAST_GREP" --config=playwright.deployed-live.config.ts --project=deployed-live-chromium --reporter=line
          else
            VITE_USE_LIVE_DB=true pnpm exec playwright test "$DIAGNOSTIC_DAST_SPEC" --config=playwright.deployed-live.config.ts --project=deployed-live-chromium --reporter=line
          fi
      # Content-free: repository, run, actor, release, origin, cell, document and nonce. Never a credential or content.
      - name: Upload model-comparison authorization (content-free)
        if: ${{ always() && github.event.inputs.diagnostic_dast_spec != '' && github.event.inputs.comparison_cell != 'none' }}
        uses: actions/upload-artifact@v4
        with:
          name: model-comparison-authorization-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-comparison-authorization/model-comparison-authorization.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Diagnostic single-spec notice (NOT a Gate 3 pass)
        if: ${{ always() && github.event.inputs.diagnostic_dast_spec != '' }}
        run: |
          {
            echo "### ⚠️ DIAGNOSTIC single-spec run — NOT a full Gate 3 pass"
            echo ""
            echo "- spec: \`${{ github.event.inputs.diagnostic_dast_spec }}\`"
            echo "- grep: \`${{ github.event.inputs.diagnostic_dast_grep }}\`"
            echo ""
            echo "Root-cause classification only. The release gate stays **FAIL** until a FULL Gate 3 (no diagnostic input) passes."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Reject diagnostic run as release qualification
        if: ${{ always() && github.event.inputs.diagnostic_dast_spec != '' }}
        run: |
          echo "::error::Diagnostic DAST completed as ineligible evidence; Gate 3 remains failed closed."
          exit 1
      - name: Upload canonical Production Gate 3 artifacts
        if: ${{ success() && github.event.inputs.diagnostic_dast_spec == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-3-dast-production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gate-3-evidence-eligibility.json
            test-results/
            playwright-report/
            blob-report/
          retention-days: 14
          if-no-files-found: error
      - name: Upload failed canonical-target diagnostics as ineligible
        if: ${{ failure() && github.event.inputs.diagnostic_dast_spec == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-3-dast-canonical-ineligible-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gate-3-evidence-eligibility.json
            test-results/
            playwright-report/
            blob-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload ineligible diagnostic Gate 3 artifacts
        if: ${{ always() && github.event.inputs.diagnostic_dast_spec != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-3-dast-diagnostic-ineligible-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gate-3-evidence-eligibility.json
            test-results/
            playwright-report/
            blob-report/
          retention-days: 14
          if-no-files-found: error

  # #1432 PM decisions 5651830241 / 5651842972 — ONE PRODUCT OWNER COMPARISON CELL. This job is the authorization
  # boundary for one spoken take on the Product Owner's device; it records no speech and runs no product step. Dispatch
  # `gate=comparison-authorization` against the EXACT reviewed candidate head. It refuses unless that head is exactly
  # the requested release and the release Production serves, and the repository owner dispatched and triggered the
  # run; it then mints one nonce bound to this run attempt, with no wall-clock expiry. The attempt-named artifact is
  # content-free. Every other gate is skipped, which the observer and the terminal validator require.
  comparison-authorization:
    name: Model Comparison Authorization
    if: ${{ github.event.inputs.gate == 'comparison-authorization' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Authorize one comparison cell (exact release, Production, repository owner)
        env:
          COMPARISON_CELL: ${{ github.event.inputs.comparison_cell }}
          RELEASE_SHA: ${{ github.event.inputs.comparison_release_sha }}
          EVIDENCE_DOCUMENT_ID: ${{ github.event.inputs.comparison_evidence_document_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          AUTHORIZATION_OUT: ${{ runner.temp }}/model-comparison-authorization/model-comparison-authorization.json
          BASE_URL: https://speaksharp-public.vercel.app
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          EVIDENCE_SCOPE: canonical-production
          EVIDENCE_ELIGIBILITY_FILE: ${{ runner.temp }}/comparison-authorization-eligibility.json
        run: |
          set -euo pipefail
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::HOLD: comparison_release_sha is not the exact commit this run executes"; exit 1
          fi
          node scripts/rc-evidence-target-preflight.mjs
          node scripts/human-test/mint-model-comparison-authorization.mjs
      - name: Upload model-comparison authorization (content-free)
        uses: actions/upload-artifact@v4
        with:
          name: model-comparison-authorization-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-comparison-authorization/model-comparison-authorization.json
          retention-days: 30
          if-no-files-found: error

  gate-4-sca:
    name: Gate 4 - SCA / Dependency Review
    if: ${{ github.event.inputs.gate == 'all' || github.event.inputs.gate == 'gate-4-sca' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'false'
      - name: Run SCA Gate
        run: pnpm rc:gate:4:sca

  gate-5-ux:
    name: Gate 5 - UX Smoke
    if: ${{ github.event.inputs.gate == 'all' || github.event.inputs.gate == 'gate-5-ux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'
      - name: Run UX Gate
        env:
          # Public Supabase build env (required by validate-env/build:test).
          # Non-secret client values; never the service-role key.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STT_ENGINE: mock
        run: pnpm rc:gate:5:ux
