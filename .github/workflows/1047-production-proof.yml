name: '#1047 authenticated production proof'

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: 'Exact PO-authorized deployed product SHA'
        required: true
      confirmation:
        description: 'Must equal RUN_AUTHORIZED_1047_PROOF'
        required: true
      base_url:
        description: 'Canonical production origin'
        required: true
        default: 'https://speaksharp-public.vercel.app'

permissions:
  contents: read

concurrency:
  group: 1047-authenticated-production-proof
  cancel-in-progress: false

jobs:
  production-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ inputs.base_url }}
      EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PROOF_EVIDENCE_DIR: test-results/1047-production-proof
      PROOF_RECOVERY_FILE: ${{ runner.temp }}/1047-proof-account.json
      PROGRESS_RECORD_MS: '45000'
    steps:
      - name: Validate authorization and inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [ "$CONFIRMATION" = 'RUN_AUTHORIZED_1047_PROOF' ] || { echo '::error::explicit proof confirmation missing'; exit 1; }
          echo "$EXPECTED_RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo '::error::expected_release_sha must be 40 lowercase hex characters'; exit 1; }
          [ "$BASE_URL" = 'https://speaksharp-public.vercel.app' ] || { echo '::error::base_url is not the reviewed canonical production origin'; exit 1; }
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo '::error::required Supabase configuration missing'; exit 1; }
          echo "PROOF_RUN_ID=u3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install reviewed dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Create unique disposable proof account
        run: node scripts/1047-production-proof-account.mjs create

      - name: Run authenticated canonical-production Progress loop
        run: >-
          pnpm exec playwright test tests/live/progress-journey.live.spec.ts
          --config=playwright.deployed-live.config.ts
          --project=deployed-live-chromium
          --reporter=list
          --workers=1

      - name: Delete run-owned data and prove zero residue
        if: always()
        run: node scripts/1047-production-proof-account.mjs cleanup

      - name: Upload sanitized one-day evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 1047-production-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/1047-production-proof/
          if-no-files-found: error
          retention-days: 1
