name: Tester Evidence Audit (READ-ONLY)

# Manual-only, read-only production tester audit. Supabase is the completion source of truth.
# Performs SELECT/list operations ONLY — the script hard-blocks insert/update/upsert/delete/rpc at
# runtime and fails the job if a mutation is attempted. Emits aggregates only: never emails,
# credentials, tokens, user/session ids, audio, or transcript bodies.

on:
  workflow_dispatch:
    inputs:
      practice_deploy_at:
        description: 'ISO timestamp of the /practice deploy (c99208b9) — window B boundary'
        required: false
        default: '2026-07-23T14:37:41Z'
      final_deploy_at:
        description: 'ISO timestamp of the FINAL production deploy — optional window C (post-final baseline)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: tester-evidence-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only tester evidence audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `version:` input — the pnpm version comes from package.json `packageManager`. Pinning it here
      # too makes action-setup fail with "Multiple versions of pnpm specified". Matches ops-health.yml.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Configuration/credential preflight — the EXISTING, unchanged scripts/verify-test-users.mjs. It is
      # INTENTIONALLY REDUNDANT with the audit's own first Auth Admin read: running it first fails the job
      # here (before any audit output) if the key/URL pairing or Auth Admin is broken, so no tester totals
      # are ever published on a broken credential. verify-test-users.mjs is read-only (Auth Admin listUsers
      # + a profile read); the mutating setup-test-users.mjs / provision-canary.mjs are NOT run.
      - name: Preflight — Auth Admin + key reachability (existing verify-test-users.mjs, unchanged)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASIC_TEST_EMAIL: ${{ secrets.BASIC_TEST_EMAIL }}
          FREE_TEST_EMAIL: ${{ secrets.FREE_TEST_EMAIL || secrets.BASIC_TEST_EMAIL }}
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
        run: |
          set -euo pipefail
          node scripts/verify-test-users.mjs

      # Secrets/variables are injected by GitHub and consumed only inside the Node process. They are never
      # echoed, written to the summary, or uploaded. The script prints aggregates + category names only.
      - name: Run read-only tester evidence audit
        env:
          # SUPABASE_URL is a GitHub Actions VARIABLE; SUPABASE_SERVICE_ROLE_KEY is a SECRET. This audit
          # uses the repository's established service-role key (same as the existing Auth-Admin callers).
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Centrally-managed exclusion manifest (SECRET). A JSON object of categorized address arrays
          # (owner_admin/synthetic/checkout/canary/qa). REQUIRED — the audit fails closed if it is
          # absent/malformed/empty. Addresses are never printed; only per-category counts are reported.
          # The audit no longer consumes OWNER_EMAIL/BASIC/FREE/PRO/CHECKOUT individually.
          AUDIT_EXCLUDED_EMAILS_JSON: ${{ secrets.AUDIT_EXCLUDED_EMAILS_JSON }}
          # Non-secret VARIABLE — printed for traceability of which manifest version was applied.
          AUDIT_EXCLUSION_LIST_VERSION: ${{ vars.AUDIT_EXCLUSION_LIST_VERSION }}
          PRACTICE_DEPLOY_AT: ${{ github.event.inputs.practice_deploy_at }}
          FINAL_DEPLOY_AT: ${{ github.event.inputs.final_deploy_at }}
        # No `tee`: the script writes the sanitized report itself. `set -euo pipefail` so any failure
        # fails the job (run 30057301254 went green because tee's exit status masked the script's exit 1).
        run: |
          set -euo pipefail
          node scripts/tester-evidence-audit.mjs > "$RUNNER_TEMP/tester-evidence-audit.txt"
          cat "$RUNNER_TEMP/tester-evidence-audit.txt"

      # Upload ONLY on success: a failed/partial run must never produce a successful-looking audit
      # artifact. `if-no-files-found: error` so a missing report is a hard failure, not a silent pass.
      - name: Upload sanitized aggregate report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tester-evidence-audit-aggregates
          path: ${{ runner.temp }}/tester-evidence-audit.txt
          if-no-files-found: error
          retention-days: 7
