name: R10 full-chain rehearsal (scratch; synthetic; production blocked)
# Scratch branch elon/r10-rehearsal only. No secrets, no environment, contents: read. Every production host the harness names resolves
# to a local TLS stub before any rehearsal stage runs; accounts and credentials are synthetic.
on:
  push:
    branches: [elon/r10-rehearsal]
permissions:
  contents: read
concurrency:
  group: r10-rehearsal
  cancel-in-progress: false
jobs:
  rehearse:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      CT_CONFIG: tools/cloud-test/config/test-config.v1.json
      CT_EXISTING_DEPENDENCY_ROOT: ${{ github.workspace }}/tools/cloud-test/runner
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the accepted journal root (read-only)
        run: git fetch --no-tags origin cloud-test-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - name: Install the pinned Python execution-evidence dependency
        run: python3 -m pip install --quiet pyyaml==6.0.2
      - name: Pinned runner dependencies from the reviewed lockfile
        run: npm --prefix tools/cloud-test/runner ci --ignore-scripts --no-audit --no-fund
      - name: Discover the preinstalled browser against the reviewed baseline
        run: |
          set -euo pipefail
          cd tools/cloud-test
          python3 -I scripts/install_browser.py --config config/test-config.v1.json --installed --environment github-hosted \
            --baselines config/browser-baselines.v1.json --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID.1" \
            --receipt "$RUNNER_TEMP/browser-receipt.json" > "$RUNNER_TEMP/chrome-path.txt"
          echo "CT_CHROME=$(cat "$RUNNER_TEMP/chrome-path.txt")" >> "$GITHUB_ENV"
          echo "CT_BROWSER_RECEIPT=$RUNNER_TEMP/browser-receipt.json" >> "$GITHUB_ENV"
      - name: Allow the clean-room network namespace on this ephemeral runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn true
      - name: Generate the exact-head browser-bound proof and offline checks
        env:
          CT_REQUIRE_INTEGRATION: '1'
          CT_EXISTING_PDFJS_DIR: ${{ github.workspace }}/tools/cloud-test/runner/node_modules/pdfjs-dist
        run: |
          set -euo pipefail
          cd tools/cloud-test
          python3 -I scripts/generate_offline_proof.py --work "$RUNNER_TEMP/offline-proof-work" \
            --proof-out "$RUNNER_TEMP/offline-proof.json" --chrome "$CT_CHROME" \
            --browser-receipt "$CT_BROWSER_RECEIPT" --playwright-cwd "$CT_EXISTING_DEPENDENCY_ROOT"
          CT_PROOF_FILE="$RUNNER_TEMP/offline-proof.json" python3 -I scripts/run_offline_checks.py --out "$RUNNER_TEMP/offline-checks.json"
          echo "CT_OFFLINE_PROOF=$RUNNER_TEMP/offline-proof.json" >> "$GITHUB_ENV"
          echo "CT_OFFLINE_CHECKS=$RUNNER_TEMP/offline-checks.json" >> "$GITHUB_ENV"
      - name: Lock production out (every production host resolves to a local TLS stub)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stub"; mkdir -p "$d"; cd "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=rehearsal-ca' -keyout ca.key -out ca.crt \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj '/CN=speaksharp-public.vercel.app' -keyout srv.key -out srv.csr 2>/dev/null
          printf 'subjectAltName=DNS:speaksharp-public.vercel.app\nextendedKeyUsage=serverAuth\n' > ext.cnf
          openssl x509 -req -in srv.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 -extfile ext.cnf -out srv.crt 2>/dev/null
          sudo cp ca.crt /usr/local/share/ca-certificates/rehearsal-ca.crt && sudo update-ca-certificates >/dev/null
          for h in speaksharp-public.vercel.app yxlapjuovrsvjswkwnrk.supabase.co us.posthog.com us.i.posthog.com us-assets.i.posthog.com app.posthog.com eu.posthog.com; do
            echo "127.0.0.1 $h" | sudo tee -a /etc/hosts >/dev/null
          done
          printf '<!doctype html><html><head><script>window.__APP_RELEASE__="5a7bf6a1cbd0fb2f4a1c2b363d891c8fcc462bd2";</script></head><body>rehearsal stub</body></html>\n' > index.html
          cat > serve.py <<'PY'
          import http.server, ssl, sys
          body = open(sys.argv[1], "rb").read()
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200); self.send_header("Content-Type", "text/html"); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
              def log_message(self, *a): pass
          s = http.server.ThreadingHTTPServer(("127.0.0.1", 443), H)
          c = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER); c.load_cert_chain(sys.argv[2], sys.argv[3]); s.socket = c.wrap_socket(s.socket, server_side=True)
          s.serve_forever()
          PY
          sudo nohup python3 serve.py index.html srv.crt srv.key > serve.log 2>&1 &
          sleep 2
          for h in speaksharp-public.vercel.app yxlapjuovrsvjswkwnrk.supabase.co us.posthog.com us.i.posthog.com us-assets.i.posthog.com app.posthog.com eu.posthog.com; do
            [ "$(getent hosts "$h" | awk '{print $1}' | sort -u)" = 127.0.0.1 ] || { echo "LOCK FAILED for $h"; exit 1; }
          done
          curl -sS --max-time 5 https://speaksharp-public.vercel.app/ | grep -c __APP_RELEASE__
          echo "every production host resolves to the local stub"
      - name: Rehearse steps 11-18 with the exact R10 request and synthetic accounts
        run: python3 -I rehearsal-scratch/r10_rehearsal.py
      - name: Upload the content-free rehearsal summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r10-rehearsal-summary
          path: |
            ${{ runner.temp }}/rehearsal-summary.json
            ${{ runner.temp }}/offline-checks.json
          retention-days: 1
          if-no-files-found: warn
