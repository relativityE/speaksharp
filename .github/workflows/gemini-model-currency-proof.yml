name: Gemini Model Currency Proof

# #1424 G4. workflow_dispatch ONLY, and deliberately so: this job spends a real paid Gemini call. Running it
# on push would bill every commit for evidence that only changes when the model or the prompt changes.
on:
  workflow_dispatch:
  # A dispatch can only be issued against the DEFAULT branch, so on its own it cannot run before this PR
  # merges - and this proof IS the merge gate. Firing on a label lets it run once, on the exact PR head,
  # without putting a billed call on every push.
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: gemini-model-currency-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'gemini-proof' || github.event.label.name == 'gemini-sample'
    runs-on: ubuntu-latest
    # The sampling label makes ten spaced calls to characterise the word-count distribution, so it needs
    # materially more wall clock than the single-call gate.
    timeout-minutes: 25
    steps:
      # A labeled `pull_request` run checks out the event's synthetic MERGE commit by default, not the PR
      # head (Codex finding). Claiming a proof ran at an exact head while the runner built a different tree
      # is exactly the kind of evidence that is worse than none, so pin the head explicitly.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record the commit this proof actually runs against
        id: proven
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ONE call, with a FABRICATED transcript. No user data, no production database, no deploy.
      - name: Call the model the edge function names
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROOF_OUT: artifacts/gemini-model-currency-proof.json
          PROOF_SHA: ${{ steps.proven.outputs.sha }}
          # One call for the gate; ten when the sampling label fires.
          SAMPLE_N: ${{ github.event.label.name == 'gemini-sample' && '10' || '1' }}
        run: node scripts/gemini-model-currency-proof.mjs

      - name: Retain the raw response as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-model-currency-proof
          path: artifacts/gemini-model-currency-proof*.json
          if-no-files-found: warn
