name: Gemini Model Currency Proof

# This workflow exists on and executes from the trusted default branch. It never checks out or runs code
# from the target PR. The only candidate input is an inert JSON contract read with `git show`.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full candidate commit SHA whose contract is being proven
        required: true
        type: string
      sample_count:
        description: One merge-gate call or ten distribution samples
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '10'

permissions:
  contents: read

concurrency:
  group: gemini-model-currency-proof-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  proof:
    # `workflow_dispatch --ref` can select a feature-branch copy of this file, whose steps could be rewritten
    # to consume the API key directly. Fail closed unless GitHub is executing the DEFAULT-BRANCH revision.
    # Proven, not assumed: dispatched against this branch before publication (run `34676874628`), this job
    # concluded `skipped` and not one step ran.
    #
    # A protected `gemini-model-proof` environment with reviewer approval was declared here and is REMOVED
    # under PO release policy `5643985190` and PM UNBLOCK `5643977200`. Two reasons, and the second is the
    # one that matters: the environment does not exist, and a job naming an absent environment has one
    # auto-created with NO protection rules and NO branch policy — so the line read as a gate and gated
    # nothing. Declaring it was worse than omitting it, because it invited the belief that approval was
    # required. The environment, reviewer approval and secret migration are post-MVP debt in #1399.
    #
    # The default-branch check above is the boundary this workflow actually enforces. The key is read from
    # the repository secret, is never echoed, and never reaches a log or an artifact.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the trusted harness only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read candidate contract as inert data
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          mkdir -p artifacts
          node -e 'const fs=require("fs"); fs.writeFileSync("artifacts/gemini-model-currency-proof.json", JSON.stringify({target_sha:process.env.TARGET_SHA,success:false,phase:"candidate-extraction"},null,2)+"\n")'
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "target_sha must be a full 40-character commit"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git show "$TARGET_SHA:backend/supabase/functions/get-ai-suggestions/contract.json" > /tmp/gemini-coaching-contract.json
          echo "Trusted harness: $(git rev-parse HEAD)"
          echo "Candidate data: $TARGET_SHA"

      - name: Call Gemini with fabricated evidence
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CONTRACT_PATH: /tmp/gemini-coaching-contract.json
          TARGET_SHA: ${{ inputs.target_sha }}
          SAMPLE_N: ${{ inputs.sample_count }}
          PROOF_OUT: artifacts/gemini-model-currency-proof.json
        run: node scripts/gemini-model-currency-proof.mjs

      - name: Retain the fabricated proof response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-model-currency-proof-${{ inputs.target_sha }}
          path: artifacts/gemini-model-currency-proof.json
          if-no-files-found: error
          retention-days: 14
