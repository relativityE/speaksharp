name: "Share Feedback PostgREST proof (disposable stack)"
# #1258 — the API-layer rung for the Share Feedback write. PGlite proves the database refuses
# `INSERT … ON CONFLICT (idempotency_key)` for `authenticated` (INSERT-only); this drives the REAL issueReportService
# through the installed @supabase/postgrest-js, with signed JWTs, against a real PostgREST on a disposable Postgres
# holding ONLY the migration-defined grants. No Production access, no secrets: the JWT secret below is disposable.
# Postgres 16/17 match the existing PostgREST contract matrix (postgrest-contract-matrix.yml).
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'frontend/src/services/issueReportService.ts'
      - 'backend/supabase/migrations/*user_issue_reports*.sql'
      - 'backend/supabase/migrations/20260721130000_report_session_ownership_guard.sql'
      - 'backend/supabase/migrations/20260903140000_feedback_kind_severity_contract.sql'
      - 'backend/supabase/migrations/20260904150000_share_feedback_redesign.sql'
      - 'scripts/feedback-postgrest-bootstrap.sh'
      - 'tests/http/**'
      - '.github/workflows/feedback-postgrest-proof.yml'
permissions:
  contents: read
concurrency:
  group: feedback-postgrest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    name: "Share Feedback PostgREST (postgres:${{ matrix.pg }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable_ci_only
      PGDATABASE: matrix_test
      PGRST_JWT_SECRET: disposable-ci-only-secret-at-least-32-chars-long
      PGRST_PORT: '3999'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Install psql client (bounded)
        run: |
          timeout 180 sudo apt-get update -qq || { echo "::error::apt-get update exceeded its 180s bound"; exit 1; }
          timeout 180 sudo apt-get install -y -qq postgresql-client \
            || { echo "::error::apt-get install exceeded its 180s bound"; exit 1; }
          set -o pipefail
          psql -Atc 'select version()'

      - name: Bootstrap the disposable schema (migration-defined grants only)
        run: |
          # BEFORE PostgREST starts: its anonymous role (`anon`, as on Supabase) must exist for the readiness probe.
          set -o pipefail
          bash scripts/feedback-postgrest-bootstrap.sh | tee feedback-pgrst-${{ matrix.pg }}.txt

      - name: Start disposable PostgREST
        run: |
          docker run -d --name pgrst --network host \
            -e PGRST_DB_URI="postgres://postgres:disposable_ci_only@127.0.0.1:5432/matrix_test" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$PGRST_JWT_SECRET" \
            -e PGRST_SERVER_PORT="$PGRST_PORT" \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:${PGRST_PORT}/" >/dev/null && break
            sleep 2
          done
          curl -sf "http://127.0.0.1:${PGRST_PORT}/" >/dev/null || { echo '::error::PostgREST did not become ready'; docker logs pgrst; exit 1; }

      - name: Share Feedback PostgREST proof (real service + installed postgrest-js)
        env:
          FEEDBACK_PGRST_URL: http://127.0.0.1:3999
        run: |
          # pipefail is REQUIRED: GitHub runs steps with `bash -e` only, and a tee would otherwise mask a FAIL.
          set -o pipefail
          pnpm exec vitest run --config tests/http/vitest.http.config.mjs --reporter=verbose 2>&1 | tee -a feedback-pgrst-${{ matrix.pg }}.txt

      - name: PostgREST logs on failure
        if: failure()
        run: docker logs pgrst || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Share Feedback PostgREST proof — postgres:${{ matrix.pg }}"
            echo '```'
            grep -E '^bootstrap:|✓|×|Tests |Test Files' feedback-pgrst-${{ matrix.pg }}.txt 2>/dev/null || echo 'no result captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
