# #1259 T4 / #1382 — RUN THE READBACK THAT ALREADY EXISTS.
#
# `scripts/telemetry-readback-qualification.mts` and the governed envelope (#1374) have been on `main`
# since T1/T2, and `tests/unit/controlledTrafficTypeGate.test.js` already compiles the script's
# controlled-class claim. What was missing is the only thing that produces evidence: NOTHING INVOKED IT.
# The script was reachable solely through `pnpm telemetry:readback-qualification` on someone's laptop, so
# #1259's closure packet holds no receipt for any release — not because the telemetry is absent, but
# because the readback never ran.
#
# DISPATCH ONLY, AND DELIBERATELY NOT SCHEDULED. A recurring run would mint a HOLD every night for a
# release nobody exercised, and a gate that always fails is as useless as one that always passes.
# Qualification follows a controlled run; it does not go looking for one.
#
# READ-ONLY. This queries the PostHog HogQL API and writes nothing: no capture, no identify, no
# annotation, no dashboard mutation, no repository or database change. It cannot alter the population it
# measures, which is the point of a readback gate.
#
# WHAT THIS WORKFLOW DOES NOT DO. It does not issue or mutate an account claim, deploy anything, activate
# telemetry, or run a paid proof. Those are separate, explicitly authorized acts (PM direction, #1382).
name: telemetry-readback-qualification (read-only)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact 40-char deployed release SHA the run was observed on (read from window.__APP_RELEASE__, never inferred from a merge)'
        required: true
      journey_id:
        description: 'The journey id of the controlled run. Completeness is a property of ONE journey, never of a time window.'
        required: true
      traffic_type:
        description: 'The controlled class the run actually carried. Only these two can qualify a release.'
        required: true
        type: choice
        options:
          - internal_test
          - canary
      stages:
        description: 'Comma-separated UI stages this run exercised (share_feedback, session_during, session_after_open_mic, session_after_focus_points)'
        required: true
      window_hours:
        description: 'Readback window in hours (1-168)'
        required: false
        default: '24'

permissions:
  contents: read

concurrency:
  group: telemetry-readback-qualification
  cancel-in-progress: false

jobs:
  readback:
    name: Telemetry readback qualification (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # VALIDATE BEFORE ANY API CALL. A malformed input must not reach the query as a value that can only
      # ever match zero rows, because zero rows is indistinguishable from "the telemetry is broken".
      #
      # The script HOLDs on each of these too — that is its job, and the HOLD paths are tested. This step
      # exists so the refusal names the operator's mistake before a credentialed request is spent on it,
      # and so an unknown stage is refused here as well: the script checks stage names only AFTER the
      # query returns, so offline it cannot refuse one at all.
      - name: Validate dispatch inputs (fail closed)
        env:
          RELEASE_SHA: ${{ github.event.inputs.release_sha }}
          JOURNEY_ID: ${{ github.event.inputs.journey_id }}
          TRAFFIC_TYPE: ${{ github.event.inputs.traffic_type }}
          STAGES: ${{ github.event.inputs.stages }}
          WINDOW_HOURS: ${{ github.event.inputs.window_hours }}
        run: |
          set -euo pipefail
          # A full 40-hex SHA, never an abbreviation: an abbreviated release identity cannot be matched
          # against the envelope's release_sha, and a gate pinned to an ambiguous release proves nothing.
          echo "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::release_sha must be a full 40-character lowercase SHA"; exit 1; }
          echo "$JOURNEY_ID" | grep -Eq '^[A-Za-z0-9_-]{8,128}$' \
            || { echo "::error::journey_id must be 8-128 chars of [A-Za-z0-9_-]"; exit 1; }
          # The CONTROLLED classes only, matching CONTROLLED_EVIDENCE_TRAFFIC in the script. `user` is real
          # customer activity — a copied journey id would otherwise certify a release on someone's actual
          # session. `internal` marks a build Production users never receive, so it can never describe the
          # canonical deployment this gate qualifies.
          case "$TRAFFIC_TYPE" in
            canary|internal_test) ;;
            *) echo "::error::traffic_type must be a controlled evidence class (canary or internal_test)"; exit 1;;
          esac
          [ -n "$STAGES" ] || { echo "::error::stages is required — a run declares what it exercised"; exit 1; }
          # Count the parsed stages, not the raw string (Codex P2): `,` or whitespace is non-empty but
          # declares NOTHING, and would reach a credentialed query that can only HOLD.
          declared=0
          for s in $(echo "$STAGES" | tr ',' ' '); do
            declared=$((declared + 1))
            case "$s" in
              share_feedback|session_during|session_after_open_mic|session_after_focus_points) ;;
              *) echo "::error::unknown qualification stage '$s'"; exit 1;;
            esac
          done
          [ "$declared" -ge 1 ] || { echo "::error::stages declares no stage (separator or whitespace only)"; exit 1; }
          echo "$WINDOW_HOURS" | grep -Eq '^[0-9]{1,3}$' \
            || { echo "::error::window_hours must be numeric"; exit 1; }
          [ "$WINDOW_HOURS" -ge 1 ] && [ "$WINDOW_HOURS" -le 168 ] \
            || { echo "::error::window_hours must be between 1 and 168"; exit 1; }
          echo "inputs validated"

      # PIN TO THE RELEASE UNDER TEST, not to the default branch. The required event families and the stage
      # contract are code: reading them from a newer tree would qualify a deployed release against a
      # contract it never shipped.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_sha }}

      - name: Verify the checkout is the release under test
        env:
          RELEASE_SHA: ${{ github.event.inputs.release_sha }}
        run: |
          set -euo pipefail
          got="$(git rev-parse HEAD)"
          [ "$got" = "$RELEASE_SHA" ] || { echo "::error::checked out $got, expected $RELEASE_SHA"; exit 1; }

      - uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'false'

      - name: Readback qualification (PostHog HogQL, read-only)
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          # A repository VARIABLE, like every other PostHog workflow here (Codex P2): read from `secrets.*`
          # it resolved empty and the script silently defaulted to us.posthog.com — a non-US project would
          # be queried against the wrong region and HOLD for a reason unrelated to its telemetry.
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
          RELEASE_SHA: ${{ github.event.inputs.release_sha }}
          TELEMETRY_QUALIFICATION_JOURNEY_ID: ${{ github.event.inputs.journey_id }}
          TELEMETRY_QUALIFICATION_TRAFFIC_TYPE: ${{ github.event.inputs.traffic_type }}
          QUALIFICATION_STAGES: ${{ github.event.inputs.stages }}
          WINDOW_HOURS: ${{ github.event.inputs.window_hours }}
        run: |
          set -euo pipefail
          # Named, never printed. A missing credential is a refusal, not a skip — the script HOLDs on this
          # too, but spending a checkout and an install to discover it is waste.
          [ -n "${POSTHOG_PERSONAL_API_KEY:-}" ] || { echo "::error::POSTHOG_PERSONAL_API_KEY is not configured"; exit 1; }
          [ -n "${POSTHOG_PROJECT_ID:-}" ] || { echo "::error::POSTHOG_PROJECT_ID is not configured"; exit 1; }
          pnpm telemetry:readback-qualification --window-hours "$WINDOW_HOURS" 2>&1 | tee "$RUNNER_TEMP/telemetry-readback.log"

      # The evidence line is content-free BY CONSTRUCTION (#1374): event family names, a verdict, reasons,
      # and the journey/boot ids the contract owns. No transcript, no audio, no error text, no email, no
      # account id.
      - name: Publish the sanitized verdict
        if: ${{ always() }}
        run: |
          set -euo pipefail
          line="$(grep -a 'TELEMETRY_READBACK_QUALIFICATION_EVIDENCE' "$RUNNER_TEMP/telemetry-readback.log" | tail -1 || true)"
          if [ -z "$line" ]; then
            echo "::error::no evidence line was emitted — the readback did not reach its verdict"
            exit 1
          fi
          {
            echo '## Telemetry readback qualification'
            echo ''
            echo "${line#TELEMETRY_READBACK_QUALIFICATION_EVIDENCE }"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence line
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-readback-${{ github.event.inputs.release_sha }}
          path: ${{ runner.temp }}/telemetry-readback.log
          retention-days: 14
          if-no-files-found: error
