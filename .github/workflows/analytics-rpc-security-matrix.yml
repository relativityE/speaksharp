name: "Analytics RPC security matrix (disposable Postgres)"

# #1091 — BOUNDED RELEASE ARTIFACT, not a permanent CI system.
#
# The eight-item authorization matrix for public.get_analytics_summary already runs in-process against
# PGlite (real PostgreSQL, WASM) in the normal unit lane. That proves the SQL and the arithmetic. It
# does NOT prove the security contract, which depends on server-side roles, GRANT/REVOKE, SECURITY
# DEFINER ownership and RLS interaction on the PostgreSQL major version production actually runs.
#
# This job stands up a throwaway `postgres` service container, applies the bootstrap and the migration
# VERBATIM, runs the portable psql matrix, and records the server version, the effective grants and the
# full output. The container is destroyed with the runner. NOTHING is applied to any hosted database and
# no production credential is used — there are no secrets in this workflow at all.
#
# VERSION MATRIX: the PostgreSQL major version of the production Supabase project is NOT recorded
# anywhere in this repository (config.toml has no [db] major_version). Rather than guess, this runs the
# plausible Supabase range so that whichever major production runs is covered. Recording the production
# major version somewhere in-repo would let this collapse to a single job.
#
# Once the migration has been applied and this evidence is filed, this workflow can be deleted.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'backend/supabase/migrations/20260729130000_analytics_summary_evidence_validity.sql'
      - 'tests/db/analytics-summary-bootstrap.sql'
      - 'tests/db/analytics-summary-security-matrix.sql'
      - '.github/workflows/analytics-rpc-security-matrix.yml'

permissions:
  contents: read

concurrency:
  group: analytics-rpc-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: "eight-item matrix (postgres:${{ matrix.pg }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16', '17']

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Disposable container on localhost. Not a credential of any real system.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable_ci_only
      PGDATABASE: matrix_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Record server version
        run: |
          set -euo pipefail
          {
            echo "## postgres:${{ matrix.pg }}"
            echo '```'
            echo "\$ psql -c 'select version()'"
            psql -Atc "select version()"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply bootstrap schema (throwaway)
        run: psql -v ON_ERROR_STOP=1 -f tests/db/analytics-summary-bootstrap.sql

      - name: Apply the migration VERBATIM
        run: |
          set -euo pipefail
          echo "\$ psql -v ON_ERROR_STOP=1 -f backend/supabase/migrations/20260729130000_analytics_summary_evidence_validity.sql"
          psql -v ON_ERROR_STOP=1 -f backend/supabase/migrations/20260729130000_analytics_summary_evidence_validity.sql

      - name: Run the eight-item security matrix
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/db/analytics-summary-security-matrix.sql 2>&1 | tee matrix-output.txt
          # Every item RAISEs on failure and ON_ERROR_STOP makes that a non-zero exit, but assert the
          # completion banner too so a silently truncated run cannot read as a pass.
          grep -q 'ALL EIGHT MATRIX ITEMS PASSED' matrix-output.txt
          grep -q 'SECURITY MATRIX COMPLETE' matrix-output.txt

      - name: FALSIFICATION — the matrix must REJECT the superseded definition
        run: |
          set -euo pipefail
          # A matrix that passes against the defective function proves nothing. Rebuild on a clean
          # database, apply the definition currently deployed, and require the matrix to FAIL.
          psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; DROP SCHEMA IF EXISTS auth CASCADE;'
          psql -v ON_ERROR_STOP=1 -f tests/db/analytics-summary-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f backend/supabase/migrations/20260522110000_cleanup_stale_schema_lint.sql
          if psql -v ON_ERROR_STOP=1 -f tests/db/analytics-summary-security-matrix.sql > falsify-output.txt 2>&1; then
            echo "::error::VACUOUS — the matrix passed against the SUPERSEDED (defective) definition"
            cat falsify-output.txt
            exit 1
          fi
          echo "Matrix correctly rejected the superseded definition:"
          grep -E 'FAIL [0-9]' falsify-output.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish evidence
        if: always()
        run: |
          {
            echo "### Matrix output (postgres:${{ matrix.pg }})"
            echo '```'
            cat matrix-output.txt 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analytics-rpc-security-matrix-pg${{ matrix.pg }}
          path: |
            matrix-output.txt
            falsify-output.txt
          retention-days: 30
          if-no-files-found: warn
