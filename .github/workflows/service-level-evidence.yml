name: Service-Level Evidence
# Isolated diagnostic branch only. Never merge this replacement into main.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed diagnostic commit SHA
        required: true
        type: string
      confirm_two_calls:
        description: Type TWO-PAID-GEMINI-CALLS
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gemini-two-call-diagnostic-20261110
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/sam/gemini-two-call-diagnostic-20261110' && github.run_attempt == 1 && inputs.expected_sha == github.sha && inputs.confirm_two_calls == 'TWO-PAID-GEMINI-CALLS'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Offline contract controls (no secret)
        run: node --test scripts/gemini-two-call-diagnostic.test.mjs
      - name: Two sequential provider attempts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM_TWO_CALLS: ${{ inputs.confirm_two_calls }}
        run: node scripts/gemini-two-call-diagnostic.mjs
      - name: Save sanitized evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gemini-two-call-diagnostic
          path: artifacts/gemini-two-call/
          if-no-files-found: warn
          retention-days: 7
