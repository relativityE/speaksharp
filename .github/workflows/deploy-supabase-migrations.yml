name: Deploy Supabase

on:
  workflow_call:
    inputs:
      deploy_production:
        description: 'Explicit separately authorized production operation; ordinary merges stay off'
        type: boolean
        default: false
      expected_head_sha:
        type: string
        required: true
      deploy_edge_functions:
        description: 'Whether this use case is authorized to publish Edge Functions'
        type: boolean
        required: true
      operation:
        description: 'Independent migration/secrets operation'
        type: string
        required: true
      confirm:
        description: 'Explicit confirmation for migrations/secrets'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Explicit separately authorized production operation'
        type: boolean
        default: false
      expected_head_sha:
        description: 'Exact qualified current main SHA'
        type: string
        required: true
      operation:
        description: 'What to deploy'
        required: true
        default: edge-functions
        type: choice
        options:
          - edge-functions
          - migrations
          - migrations-and-edge-functions
          - secrets
          - all
      confirm:
        description: 'Type "DEPLOY" for migrations, secrets, or all'
        required: false
        default: ''

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate-edge-configuration:
    if: ${{ inputs.deploy_production == true && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
      deploy_edge_functions: ${{ steps.resolve.outputs.deploy_edge_functions }}
      account_closure_only: ${{ steps.resolve.outputs.account_closure_only }}
    steps:
      - name: Checkout caller commit with comparison history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - id: policy
        name: Require explicit production intent and exact green main
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release-policy.mjs authorize

      - id: resolve
        name: Resolve and validate Edge deployment configuration
        env:
          CALLED_DEPLOY_EDGE: ${{ inputs.deploy_edge_functions }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            edge-functions|account-closure-only) ;;
            migrations|migrations-and-edge-functions|secrets|all)
              confirmation="$(printf '%s' "$CONFIRM_INPUT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
              [ "$confirmation" = 'DEPLOY' ] || { echo '::error::backend mutation confirmation missing BEFORE invalidation'; exit 1; }
              ;;
            *) echo "::error::unsupported deployment operation: $OPERATION"; exit 1 ;;
          esac
          deploy_edge="$CALLED_DEPLOY_EDGE"
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            case "$OPERATION" in
              edge-functions|migrations-and-edge-functions|all) deploy_edge=true ;;
              # account-closure-only never enables the ten-function path; its own job publishes exactly one function.
              migrations|secrets|account-closure-only) deploy_edge=false ;;
              *) echo "::error::unsupported deployment operation: $OPERATION"; exit 1 ;;
            esac
          elif [ "$EVENT_NAME" = 'push' ]; then
            sha_re='^[0-9a-f]{40}$'
            if [[ ! "$BEFORE_SHA" =~ $sha_re || ! "$HEAD_SHA" =~ $sha_re || "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "::error::cannot establish a trustworthy push base/head comparison"
              exit 1
            fi
            git cat-file -e "$BEFORE_SHA^{commit}" || { echo "::error::push base commit is unavailable"; exit 1; }
            git cat-file -e "$HEAD_SHA^{commit}" || { echo "::error::push head commit is unavailable"; exit 1; }
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" | scripts/validate-edge-deploy-scope.sh "$deploy_edge"
          else
            echo "::error::unsupported caller event: $EVENT_NAME"
            exit 1
          fi
          echo "deploy_edge_functions=$deploy_edge" >> "$GITHUB_OUTPUT"
          if [ "$OPERATION" = 'account-closure-only' ]; then
            [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$deploy_edge" = false ] || { echo '::error::account-closure-only must not enable the ten-function path'; exit 1; }
            echo 'account_closure_only=true' >> "$GITHUB_OUTPUT"
          else
            echo 'account_closure_only=false' >> "$GITHUB_OUTPUT"
          fi

  verify-t2-database-prerequisites:
    needs: validate-edge-configuration
    if: ${{ inputs.deploy_production == true && needs.validate-edge-configuration.outputs.allowed == 'true' }}
    environment: production-db
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify reviewed T2 database before authority invalidation
        env:
          DEPLOY_EDGE: ${{ needs.validate-edge-configuration.outputs.deploy_edge_functions }}
          ACCOUNT_CLOSURE_ONLY: ${{ needs.validate-edge-configuration.outputs.account_closure_only }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq postgresql-client
          bash scripts/supabase-pooler-connection.sh "$RUNNER_TEMP/t2-pooler.env"
          set -a; . "$RUNNER_TEMP/t2-pooler.env"; set +a
          export PGPASSWORD="${SUPABASE_DB_PASSWORD}"
          unset DB_URL
          bash scripts/assert-db-connectivity-tls.sh
          if [ "$ACCOUNT_CLOSURE_ONLY" = true ]; then
            # The narrow route requires the post-129 ledger with completion OFF and unbound; nothing else qualifies.
            node scripts/t2-migration-postflight.mjs verify account-closure-release
          else
            case "$DEPLOY_EDGE" in
              true) node scripts/t2-migration-postflight.mjs verify edge-release ;;
              false) node scripts/t2-migration-postflight.mjs verify release ;;
              *) echo '::error::resolved Edge deployment intent unavailable'; exit 1 ;;
            esac
          fi

  # Authority invalidation is a separate production decision for account-closure-only and never runs on that route.
  invalidate-account-closure-authority:
    needs: [validate-edge-configuration, verify-t2-database-prerequisites]
    if: ${{ inputs.deploy_production == true && needs.validate-edge-configuration.outputs.allowed == 'true' && needs.verify-t2-database-prerequisites.result == 'success' && (needs.validate-edge-configuration.outputs.deploy_edge_functions == 'true' || inputs.operation != 'edge-functions') && inputs.operation != 'account-closure-only' }}
    environment: production-db
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Recheck exact green main immediately before invalidation
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release-policy.mjs authorize
      - name: Invalidate deletion drain authority before ANY backend context change
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/account-closure-invalidate.mjs

  deploy-edge-functions:
    needs: [validate-edge-configuration, verify-t2-database-prerequisites, invalidate-account-closure-authority, deploy-production-db]
    if: ${{ always() && inputs.deploy_production == true && needs.validate-edge-configuration.outputs.allowed == 'true' && needs.validate-edge-configuration.result == 'success' && needs.verify-t2-database-prerequisites.result == 'success' && needs.invalidate-account-closure-authority.result == 'success' && needs.validate-edge-configuration.outputs.deploy_edge_functions == 'true' && (needs.deploy-production-db.result == 'success' || needs.deploy-production-db.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0

      - name: Recheck exact green main before Edge publication
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release-policy.mjs authorize

      - name: Recheck T2 database immediately before Edge publication
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq postgresql-client
          bash scripts/supabase-pooler-connection.sh "$RUNNER_TEMP/t2-pooler.env"
          set -a; . "$RUNNER_TEMP/t2-pooler.env"; set +a
          export PGPASSWORD="${SUPABASE_DB_PASSWORD}"
          unset DB_URL
          bash scripts/assert-db-connectivity-tls.sh
          node scripts/t2-migration-postflight.mjs verify edge-release

      # Release readback (cutover review): record every reviewed function's deployed version BEFORE publication, so the
      # reconciliation below can show exactly which functions changed even when a later deploy in the list fails.
      # Metadata only (slug, version, status, updated_at): never source, secrets or environment.
      - name: Capture Edge function versions before publication
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" -o json \
            | jq --arg names "stripe-webhook check-usage-limit create-user observability-smoke attest-session-engine objective-register-source get-ai-suggestions stripe-checkout stripe-billing-portal account-closure" '[($names | split(" "))[] as $n | (map(select(.slug == $n)) | first // null) as $f
                | {slug: $n, version: ($f.version // null), status: ($f.status // null), updated_at: ($f.updated_at // null)}]' \
            > "$RUNNER_TEMP/edge-versions-before.json"
          jq -c '.[]' "$RUNNER_TEMP/edge-versions-before.json"

      - name: Deploy Edge Functions
        id: deploy_edge
        working-directory: backend/supabase
        run: |
          supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
          supabase functions deploy check-usage-limit --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
          supabase functions deploy create-user --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
          supabase functions deploy observability-smoke --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
          supabase functions deploy attest-session-engine --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
          supabase functions deploy objective-register-source --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
          supabase functions deploy get-ai-suggestions --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
          supabase functions deploy stripe-checkout --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
          supabase functions deploy stripe-billing-portal --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
          supabase functions deploy account-closure --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api

      # Runs after success AND after a partial failure: the after-versions are reconciled against the before-versions,
      # function by function, so a release that stopped midway reports exactly which functions are already live.
      - name: Reconcile Edge function versions after publication
        if: ${{ always() && steps.deploy_edge.outcome != 'skipped' }}
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_edge.outcome }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" -o json \
            | jq --arg names "stripe-webhook check-usage-limit create-user observability-smoke attest-session-engine objective-register-source get-ai-suggestions stripe-checkout stripe-billing-portal account-closure" '[($names | split(" "))[] as $n | (map(select(.slug == $n)) | first // null) as $f
                | {slug: $n, version: ($f.version // null), status: ($f.status // null), updated_at: ($f.updated_at // null)}]' \
            > "$RUNNER_TEMP/edge-versions-after.json"
          jq -n --arg outcome "$DEPLOY_OUTCOME" --slurpfile before "$RUNNER_TEMP/edge-versions-before.json" \
            --slurpfile after "$RUNNER_TEMP/edge-versions-after.json" \
            '{schemaVersion: 1, deployOutcome: $outcome, functions: [range(0; ($before[0] | length)) as $i
              | ($before[0][$i]) as $b | ($after[0][$i]) as $a
              | {slug: $b.slug, before: $b.version, after: $a.version, status: $a.status,
                 advanced: (($a.version // 0) > ($b.version // 0))}]}
             | .allAdvanced = ([.functions[].advanced] | all)
             | .advanced = [.functions[] | select(.advanced) | .slug]
             | .notAdvanced = [.functions[] | select(.advanced | not) | .slug]' > edge-version-reconciliation.json
          cat edge-version-reconciliation.json
          if [ "$DEPLOY_OUTCOME" = success ] && [ "$(jq -r .allAdvanced edge-version-reconciliation.json)" != true ]; then
            echo "::error::Deploy reported success but these functions did not advance: $(jq -c .notAdvanced edge-version-reconciliation.json)"
            exit 1
          fi

      - name: Keep the Edge version reconciliation
        if: ${{ always() && steps.deploy_edge.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: edge-version-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: edge-version-reconciliation.json
          if-no-files-found: warn
          retention-days: 1

  # account-closure-only (deletion rollout step 5, plan #1952): publish EXACTLY the account-closure bundle at the exact
  # SHA, on the post-129 ledger with completion OFF and unbound, and prove that only account-closure advanced. No other
  # function, no migration, no secrets and no authority invalidation (that write is a separate decision). The
  # ten-function path above is unchanged.
  # Approval (PO, 2026-11-23, option 1): no second GitHub reviewer exists (every agent shares one login), so the
  # approval is the PO's yes recorded in the coordinator's approval thread, and the coordinator dispatches this
  # operation once at the exact SHA with the confirm phrase. Publication uses the EXISTING production-db environment,
  # the same main-only gate every production migration apply uses. A job that names a missing environment would
  # silently create an unprotected one, so this read-only job refuses unless production-db exists and allows main only.
  require-account-closure-main-gate:
    needs: [validate-edge-configuration]
    if: ${{ inputs.deploy_production == true && inputs.operation == 'account-closure-only' && needs.validate-edge-configuration.outputs.account_closure_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the existing production-db environment, restricted to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          policy="$(gh api "repos/$REPOSITORY/environments/production-db" --jq '.deployment_branch_policy.custom_branch_policies' 2>/dev/null)" \
            || { echo '::error::environment production-db does not exist; this route never creates an environment'; exit 1; }
          [ "$policy" = true ] || { echo "::error::production-db is not restricted to selected branches ($policy)"; exit 1; }
          branches="$(gh api "repos/$REPOSITORY/environments/production-db/deployment-branch-policies" --jq '[.branch_policies[].name]')"
          jq -e '. == ["main"]' <<< "$branches" >/dev/null \
            || { echo "::error::production-db must allow main only ($branches)"; exit 1; }

  deploy-account-closure-only:
    needs: [validate-edge-configuration, verify-t2-database-prerequisites, require-account-closure-main-gate]
    if: ${{ inputs.deploy_production == true && inputs.operation == 'account-closure-only' && needs.validate-edge-configuration.outputs.allowed == 'true' && needs.validate-edge-configuration.outputs.account_closure_only == 'true' && needs.validate-edge-configuration.outputs.deploy_edge_functions == 'false' && needs.verify-t2-database-prerequisites.result == 'success' && needs.require-account-closure-main-gate.result == 'success' }}
    environment: production-db
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      # The only function this route may change. Every other deployed function (the FULL roster, not a named list)
      # must be identical before and after, including no additions or removals.
      PUBLISHED_FUNCTION: account-closure
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0

      - name: Recheck exact green main before account-closure publication
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release-policy.mjs authorize

      - name: Recheck the post-129 ledger and completion OFF immediately before publication
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq postgresql-client
          bash scripts/supabase-pooler-connection.sh "$RUNNER_TEMP/t2-pooler.env"
          set -a; . "$RUNNER_TEMP/t2-pooler.env"; set +a
          export PGPASSWORD="${SUPABASE_DB_PASSWORD}"
          unset DB_URL
          bash scripts/assert-db-connectivity-tls.sh
          node scripts/t2-migration-postflight.mjs verify account-closure-release

      - name: Capture every function's version before account-closure publication
        run: |
          set -euo pipefail
          [ "$PUBLISHED_FUNCTION" = account-closure ] || { echo '::error::only account-closure may be published on this route'; exit 1; }
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" -o json > "$RUNNER_TEMP/functions-before.raw.json"
          jq -f scripts/edge-roster.jq "$RUNNER_TEMP/functions-before.raw.json" > "$RUNNER_TEMP/account-closure-versions-before.json"
          # The target must already be deployed with a version: a missing prior target can never count as an advance.
          jq -e --arg published "$PUBLISHED_FUNCTION" '[.[] | select(.slug == $published)] | length == 1' \
            "$RUNNER_TEMP/account-closure-versions-before.json" >/dev/null \
            || { echo '::error::account-closure is not deployed before publication; this route only updates it'; exit 1; }
          jq -c '.[]' "$RUNNER_TEMP/account-closure-versions-before.json"

      - name: Publish only account-closure
        id: deploy_account_closure
        working-directory: backend/supabase
        run: supabase functions deploy account-closure --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api

      # After success AND after a failure: account-closure must have advanced on success, and every OTHER function's
      # version and updated_at must be unchanged either way. A partial or failed publication names what changed.
      - name: Reconcile versions after account-closure publication
        if: ${{ always() && steps.deploy_account_closure.outcome != 'skipped' }}
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_account_closure.outcome }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID" -o json > "$RUNNER_TEMP/functions-after.raw.json"
          jq -f scripts/edge-roster.jq "$RUNNER_TEMP/functions-after.raw.json" > "$RUNNER_TEMP/account-closure-versions-after.json"
          jq -n --arg outcome "$DEPLOY_OUTCOME" --arg published "$PUBLISHED_FUNCTION" \
            --slurpfile before "$RUNNER_TEMP/account-closure-versions-before.json" \
            --slurpfile after "$RUNNER_TEMP/account-closure-versions-after.json" \
            -f scripts/account-closure-reconcile.jq > account-closure-version-reconciliation.json
          cat account-closure-version-reconciliation.json
          if [ "$(jq -r .othersUnchanged account-closure-version-reconciliation.json)" != true ]; then
            echo "::error::functions other than account-closure changed: $(jq -c .changedOthers account-closure-version-reconciliation.json)"
            exit 1
          fi
          if [ "$DEPLOY_OUTCOME" = success ] && [ "$(jq -r .publishedAdvanced account-closure-version-reconciliation.json)" != true ]; then
            echo '::error::deploy reported success but account-closure did not advance'
            exit 1
          fi

      - name: Recheck completion OFF and unbound after publication
        if: ${{ always() && steps.deploy_account_closure.outcome != 'skipped' }}
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          set -a; . "$RUNNER_TEMP/t2-pooler.env"; set +a
          export PGPASSWORD="${SUPABASE_DB_PASSWORD}"
          unset DB_URL
          node scripts/t2-migration-postflight.mjs verify account-closure-release

      - name: Keep the account-closure version reconciliation
        if: ${{ always() && steps.deploy_account_closure.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: account-closure-version-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: account-closure-version-reconciliation.json
          if-no-files-found: warn
          retention-days: 1

  verify-edge-functions:
    needs: [validate-edge-configuration, deploy-edge-functions]
    # Hosted readback MUST run after a successful Edge deployment even when an unrelated upstream job is
    # intentionally skipped. deploy-edge-functions depends on deploy-production-db, which is skipped for
    # operation=edge-functions; without a leading always() that skip propagates and silently skips this
    # required verification (the post-#1290 defect: deployment succeeded but readback was skipped). The
    # always() forces GitHub to evaluate the condition regardless, and it still runs ONLY when the Edge
    # deploy itself succeeded — mirroring the deploy-edge-functions gate above.
    if: ${{ always() && inputs.deploy_production == true && needs.validate-edge-configuration.outputs.allowed == 'true' && needs.validate-edge-configuration.outputs.deploy_edge_functions == 'true' && needs.deploy-edge-functions.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0
      - name: Verify reviewed Edge Functions are deployed
        run: |
          set -euo pipefail
          deployed="$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")"
          for function_name in stripe-webhook check-usage-limit create-user observability-smoke attest-session-engine objective-register-source get-ai-suggestions stripe-checkout stripe-billing-portal account-closure; do
            grep -Fq "$function_name" <<< "$deployed" || { echo "::error::$function_name missing after Edge deployment"; exit 1; }
          done

  deploy-production-db:
    needs: [validate-edge-configuration, invalidate-account-closure-authority]
    if: ${{ inputs.deploy_production == true && needs.validate-edge-configuration.outputs.allowed == 'true' && needs.invalidate-account-closure-authority.result == 'success' && inputs.operation != 'edge-functions' && inputs.operation != 'account-closure-only' }}
    environment: production-db
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      OPERATION: ${{ inputs.operation }}
      CONFIRM_INPUT: ${{ inputs.confirm }}
    steps:
      - name: Validate confirmation
        run: |
          user_input="$(printf '%s' "$CONFIRM_INPUT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$user_input" != "DEPLOY" ]; then
            echo "❌ Deployment cancelled - confirmation not provided"
            exit 1
          fi
          echo "✅ Deployment confirmed"

      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0

      - name: Validate environment secrets
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "❌ Missing SUPABASE_PROJECT_ID (expected as GitHub secret)" >&2
            exit 1
          fi
          echo "✅ Project ID validated"

      - name: Link to Supabase project
        working-directory: backend/supabase
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          echo "✅ Linked to Supabase project"

      - name: Recheck exact green main before database or configuration mutation
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release-policy.mjs authorize

      - name: Push migrations to production
        if: ${{ inputs.operation == 'migrations' || inputs.operation == 'migrations-and-edge-functions' || inputs.operation == 'all' }}
        working-directory: backend/supabase
        run: |
          echo "🛠️ Repairing migration history..."
          supabase migration repair 20260116000000 --status applied

          echo "🔎 Dry-running migrations before production apply..."
          supabase db push --dry-run

          echo "🚀 Pushing migrations to production..."
          supabase db push --yes
          echo "✅ Migrations applied successfully"

      - name: Lint production public schema
        if: ${{ inputs.operation == 'migrations' || inputs.operation == 'migrations-and-edge-functions' || inputs.operation == 'all' }}
        working-directory: backend/supabase
        run: |
          echo "🔎 Linting production public schema..."
          supabase db lint --linked --schema public --fail-on warning
          echo "✅ Production public schema lint passed"

      - name: Recheck exact green main before secret synchronization
        if: ${{ inputs.operation == 'secrets' || inputs.operation == 'all' }}
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release-policy.mjs authorize

      - name: Set Supabase secrets
        if: ${{ inputs.operation == 'secrets' || inputs.operation == 'all' }}
        env:
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: backend/supabase
        run: |
          # SOURCE-OF-TRUTH POLICY (2026-06-18, release-owner): live Stripe RUNTIME secrets are
          # Ops-managed DIRECTLY in Supabase and are intentionally NOT synced from GitHub here.
          # That covers STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRO_PRICE_ID,
          # and SITE_URL. Rationale: with one Supabase project and mixed
          # test/live history, a GitHub→Supabase secrets sync is a foot-gun — a CI/test price or
          # key could silently overwrite the live production runtime value. GitHub's Stripe secrets
          # feed test-mode CI jobs only; they must never become the implicit production authority.
          # If a guarded production price sync is ever needed, add it behind an explicit
          # confirm_live_stripe_secret_sync input — never as a default operation=secrets/all step.
          if [ -z "$AGENT_SECRET" ]; then
            echo "❌ AGENT_SECRET not available in GitHub Secrets!"
            exit 1
          fi
          supabase secrets set \
            AGENT_SECRET="$AGENT_SECRET" \
            ALLOWED_ORIGIN="https://speaksharp-public.vercel.app,http://localhost:5174" \
            --project-ref "$SUPABASE_PROJECT_ID"
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$SUPABASE_PROJECT_ID"
            echo "✅ GEMINI_API_KEY synchronized to Supabase"
          else
            echo "⚠️ GEMINI_API_KEY is not available in GitHub Secrets; get-ai-suggestions will return GEMINI_KEY_MISSING until configured"
          fi
          echo "✅ AGENT_SECRET and ALLOWED_ORIGIN synchronized to Supabase (Stripe runtime secrets are Ops-managed in Supabase, NOT synced from GitHub)"

      - name: Save migration list to file
        if: ${{ inputs.operation == 'migrations' || inputs.operation == 'migrations-and-edge-functions' || inputs.operation == 'all' }}
        working-directory: backend/supabase
        run: |
          supabase migration list > migration_list.txt || true
          head -n 300 migration_list.txt > migration_list_trimmed.txt || true
          echo "Saved migration list"

      - name: Add migration list to job summary
        if: ${{ inputs.operation == 'migrations' || inputs.operation == 'migrations-and-edge-functions' || inputs.operation == 'all' }}
        run: |
          echo "### Migration list" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,200p' backend/supabase/migration_list_trimmed.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Migration list added to job summary"

      - name: Post-deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Operation: $OPERATION"
          echo ""
          echo "⚠️  IMPORTANT - Post-Deployment Actions:"
          echo "  1. Verify Supabase Dashboard state for changed resources"
          echo "  2. Test affected features in production"
          echo "  3. Monitor error logs for 24h"
