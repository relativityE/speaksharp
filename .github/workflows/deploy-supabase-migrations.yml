name: Deploy Supabase

on:
  workflow_call:
    inputs:
      deploy_edge_functions:
        description: 'Whether this use case is authorized to publish Edge Functions'
        type: boolean
        required: true
      operation:
        description: 'Independent migration/secrets operation'
        type: string
        required: true
      confirm:
        description: 'Explicit confirmation for migrations/secrets'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      operation:
        description: 'What to deploy'
        required: true
        default: edge-functions
        type: choice
        options:
          - edge-functions
          - migrations
          - migrations-and-edge-functions
          - secrets
          - all
      confirm:
        description: 'Type "DEPLOY" for migrations, secrets, or all'
        required: false
        default: ''

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  validate-edge-configuration:
    runs-on: ubuntu-latest
    outputs:
      deploy_edge_functions: ${{ steps.resolve.outputs.deploy_edge_functions }}
    steps:
      - name: Checkout caller commit with comparison history
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - id: resolve
        name: Resolve and validate Edge deployment configuration
        env:
          CALLED_DEPLOY_EDGE: ${{ inputs.deploy_edge_functions }}
          OPERATION: ${{ inputs.operation }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deploy_edge="$CALLED_DEPLOY_EDGE"
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            case "$OPERATION" in
              edge-functions|migrations-and-edge-functions|all) deploy_edge=true ;;
              migrations|secrets) deploy_edge=false ;;
              *) echo "::error::unsupported deployment operation: $OPERATION"; exit 1 ;;
            esac
          elif [ "$EVENT_NAME" = 'push' ]; then
            sha_re='^[0-9a-f]{40}$'
            if [[ ! "$BEFORE_SHA" =~ $sha_re || ! "$HEAD_SHA" =~ $sha_re || "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "::error::cannot establish a trustworthy push base/head comparison"
              exit 1
            fi
            git cat-file -e "$BEFORE_SHA^{commit}" || { echo "::error::push base commit is unavailable"; exit 1; }
            git cat-file -e "$HEAD_SHA^{commit}" || { echo "::error::push head commit is unavailable"; exit 1; }
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" | scripts/validate-edge-deploy-scope.sh "$deploy_edge"
          else
            echo "::error::unsupported caller event: $EVENT_NAME"
            exit 1
          fi
          echo "deploy_edge_functions=$deploy_edge" >> "$GITHUB_OUTPUT"

  deploy-edge-functions:
    needs: [validate-edge-configuration, deploy-production-db]
    if: ${{ always() && needs.validate-edge-configuration.outputs.deploy_edge_functions == 'true' && (needs.deploy-production-db.result == 'success' || needs.deploy-production-db.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0

      - name: Deploy Edge Functions
        working-directory: backend/supabase
        run: |
          supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy check-usage-limit --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy create-user --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy observability-smoke --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy assemblyai-token --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy attest-session-engine --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy get-ai-suggestions --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy stripe-checkout --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy stripe-billing-portal --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

  verify-edge-functions:
    needs: [validate-edge-configuration, deploy-edge-functions]
    if: ${{ needs.validate-edge-configuration.outputs.deploy_edge_functions == 'true' && needs.deploy-edge-functions.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0
      - name: Verify reviewed Edge Functions are deployed
        run: |
          set -euo pipefail
          deployed="$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")"
          for function_name in stripe-webhook check-usage-limit create-user observability-smoke assemblyai-token attest-session-engine get-ai-suggestions stripe-checkout stripe-billing-portal; do
            grep -Fq "$function_name" <<< "$deployed" || { echo "::error::$function_name missing after Edge deployment"; exit 1; }
          done

  deploy-production-db:
    needs: validate-edge-configuration
    if: ${{ inputs.operation != 'edge-functions' }}
    environment: production-db
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - name: Validate confirmation
        run: |
          user_input="$(echo "${{ inputs.confirm }}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ "$user_input" != "DEPLOY" ]; then
            echo "❌ Deployment cancelled - confirmation not provided"
            exit 1
          fi
          echo "✅ Deployment confirmed"

      - name: Checkout code
        uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0

      - name: Validate environment secrets
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "❌ Missing SUPABASE_PROJECT_ID (expected as GitHub secret)" >&2
            exit 1
          fi
          echo "✅ Project ID validated"

      - name: Link to Supabase project
        working-directory: backend/supabase
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          echo "✅ Linked to Supabase project"

      - name: Push migrations to production
        if: ${{ inputs.operation == 'migrations' || inputs.operation == 'migrations-and-edge-functions' || inputs.operation == 'all' }}
        working-directory: backend/supabase
        run: |
          echo "🛠️ Repairing migration history..."
          supabase migration repair 20260116000000 --status applied

          echo "🔎 Dry-running migrations before production apply..."
          supabase db push --dry-run

          echo "🚀 Pushing migrations to production..."
          supabase db push --yes
          echo "✅ Migrations applied successfully"

      - name: Lint production public schema
        if: ${{ inputs.operation == 'migrations' || inputs.operation == 'migrations-and-edge-functions' || inputs.operation == 'all' }}
        working-directory: backend/supabase
        run: |
          echo "🔎 Linting production public schema..."
          supabase db lint --linked --schema public --fail-on warning
          echo "✅ Production public schema lint passed"

      - name: Set Supabase secrets
        if: ${{ inputs.operation == 'secrets' || inputs.operation == 'all' }}
        env:
          AGENT_SECRET: ${{ secrets.AGENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: backend/supabase
        run: |
          # SOURCE-OF-TRUTH POLICY (2026-06-18, release-owner): live Stripe RUNTIME secrets are
          # Ops-managed DIRECTLY in Supabase and are intentionally NOT synced from GitHub here.
          # That covers STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRO_PRICE_ID,
          # STRIPE_BASIC_PRICE_ID, and SITE_URL. Rationale: with one Supabase project and mixed
          # test/live history, a GitHub→Supabase secrets sync is a foot-gun — a CI/test price or
          # key could silently overwrite the live production runtime value. GitHub's Stripe secrets
          # feed test-mode CI jobs only; they must never become the implicit production authority.
          # If a guarded production price sync is ever needed, add it behind an explicit
          # confirm_live_stripe_secret_sync input — never as a default operation=secrets/all step.
          if [ -z "$AGENT_SECRET" ]; then
            echo "❌ AGENT_SECRET not available in GitHub Secrets!"
            exit 1
          fi
          supabase secrets set \
            AGENT_SECRET="$AGENT_SECRET" \
            ALLOWED_ORIGIN="https://speaksharp-public.vercel.app,http://localhost:5174" \
            --project-ref "$SUPABASE_PROJECT_ID"
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set GEMINI_API_KEY="$GEMINI_API_KEY" --project-ref "$SUPABASE_PROJECT_ID"
            echo "✅ GEMINI_API_KEY synchronized to Supabase"
          else
            echo "⚠️ GEMINI_API_KEY is not available in GitHub Secrets; get-ai-suggestions will return GEMINI_KEY_MISSING until configured"
          fi
          echo "✅ AGENT_SECRET and ALLOWED_ORIGIN synchronized to Supabase (Stripe runtime secrets are Ops-managed in Supabase, NOT synced from GitHub)"

      - name: Save migration list to file
        if: ${{ inputs.operation == 'migrations' || inputs.operation == 'migrations-and-edge-functions' || inputs.operation == 'all' }}
        working-directory: backend/supabase
        run: |
          supabase migration list > migration_list.txt || true
          head -n 300 migration_list.txt > migration_list_trimmed.txt || true
          echo "Saved migration list"

      - name: Add migration list to job summary
        if: ${{ inputs.operation == 'migrations' || inputs.operation == 'migrations-and-edge-functions' || inputs.operation == 'all' }}
        run: |
          echo "### Migration list" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,200p' backend/supabase/migration_list_trimmed.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Migration list added to job summary"

      - name: Post-deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Operation: $OPERATION"
          echo ""
          echo "⚠️  IMPORTANT - Post-Deployment Actions:"
          echo "  1. Verify Supabase Dashboard state for changed resources"
          echo "  2. Test affected features in production"
          echo "  3. Monitor error logs for 24h"
