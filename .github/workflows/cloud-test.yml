name: Cloud Test control plane (manual, secret-free)

# Manually dispatched ONLY, and it holds NO credentials: this workflow references no secret, no variable, no Environment and no write permission.
# It is the control plane of the Cloud test: offline checks, sealed-receipt verification, release verification from git, cumulative-usage
# reconciliation, gate evaluation, automatic latest-versus-prior comparison, spend/cost reporting and the report. It never contacts the product.
# The live run itself happens in the Claude task environment (the only runtime the harness admission accepts), driven by tools/cloud-test/scripts/execute_run.sh.
#
#   mode=preflight (default): evaluates every gate for the request and builds the report with Latest = PENDING.
#   mode=report: after a run's receipts were sealed into config/history/receipts/<latest_label>/ (and pinned in the config), compares Latest against the
#                previous run automatically and derives gap status, spend and the summary from that evidence.
#
# Network use: setup downloads only (PyPI pyyaml pinned, the npm lockfile, the pinned browser archive verified by sha256). The control-plane scripts run
# under a network guard; the attestation artifact records secret-free: true, network attempts: 0 and product hosts contacted: 0.
on:
  workflow_dispatch:
    inputs:
      run_request:
        description: Path of the run request inside this repository (tools/cloud-test/config/runs/<id>.json)
        required: true
        default: tools/cloud-test/config/runs/R6-aht12-prove-1744.json
      mode:
        description: preflight evaluates gates and reports with Latest pending; report compares a sealed latest run automatically
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - report
      latest_label:
        description: For mode=report only, the sealed receipt label of the latest run (for example R6). Leave empty for preflight.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: cloud-test-control-plane
  cancel-in-progress: false

jobs:
  control-plane:
    name: Offline checks, gates, comparison and report (no secrets, no product traffic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # PO 2026-10-30: no retained evidence is supplied to GitHub. The package's no-history mode reports the evidence-bound
      # checks and tests NOT APPLICABLE (never passed); every other check gates. The history-bound pipeline steps below are
      # skipped in this mode. "required" restores them and needs the sealed history in the checkout.
      CT_HISTORY: none
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - name: Validate dispatch inputs
        env:
          RUN_REQUEST: ${{ inputs.run_request }}
          MODE: ${{ inputs.mode }}
          LATEST_LABEL: ${{ inputs.latest_label }}
        run: |
          python3 -I - <<'PY'
          import os, re, sys
          p, mode, lab = os.environ["RUN_REQUEST"], os.environ["MODE"], os.environ["LATEST_LABEL"]
          if not re.fullmatch(r"tools/cloud-test/config/runs/[A-Za-z0-9._-]+\.json", p) or ".." in p:
              sys.exit("invalid run_request path")
          if mode == "report" and not re.fullmatch(r"[A-Za-z0-9._-]{1,32}", lab):
              sys.exit("mode=report needs latest_label")
          if mode == "preflight" and lab:
              sys.exit("latest_label is only for mode=report")
          PY
      - name: Record job start (usage account)
        run: python3 -I tools/cloud-test/scripts/record_timing.py start --job control-plane --dir "$RUNNER_TEMP/timings"
      - name: Install the test dependency (pinned)
        run: python -m pip install --quiet pyyaml==6.0.2
      - name: Install runner dependencies from the lockfile
        run: npm --prefix tools/cloud-test/runner ci --ignore-scripts --no-audit --no-fund
      # No separate browser archive (PO 10-30): the same Playwright 1.57.0 chromium install the existing CI job performs,
      # then the binary must equal the package's pinned hash. A missing or different binary fails; nothing is substituted.
      - name: Install the pinned browser (existing CI Playwright 1.57.0 chromium; package no-fetch --existing verifier; any mismatch fails the job)
        working-directory: tools/cloud-test
        run: |
          set -euo pipefail
          runner/node_modules/.bin/playwright install chromium
          CT_CHROME="$(python3 -I -c 'import json, os; b = json.load(open("config/test-config.v1.json"))["tools"]["browser"]; print(os.path.expanduser("~/.cache/ms-playwright/%s/chrome-linux64/chrome" % b["playwrightRevision"]))')"
          EXPECTED="$(python3 -I -c 'import json; print(json.load(open("config/test-config.v1.json"))["tools"]["browser"]["chromeBinarySha256"])')"
          ACTUAL=missing
          if [ -f "$CT_CHROME" ]; then ACTUAL="$(sha256sum "$CT_CHROME" | cut -d' ' -f1)"; fi
          echo "chromium identity: expected_sha256=$EXPECTED actual_sha256=$ACTUAL"
          python3 -I scripts/install_browser.py --config config/test-config.v1.json --existing "$CT_CHROME" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" --receipt "$RUNNER_TEMP/cloud-browser-identity.json"
          echo "CT_CHROME=$CT_CHROME" >> "$GITHUB_ENV"
      - name: Verify the vendored reviewed harness against the approved hashes
        run: python3 -I tools/cloud-test/scripts/verify_harness.py --config tools/cloud-test/config/test-config.v1.json
      - name: Offline checks (package tests, report tests, workflow policy, integration proof on loopback)
        working-directory: tools/cloud-test
        env:
          CT_REQUIRE_INTEGRATION: '1'
          # The policy tests otherwise read the package's preserved fixture; they must judge this workflow.
          CLOUD_TEST_YML: ${{ github.workspace }}/.github/workflows/cloud-test.yml
        run: python3 -I scripts/run_offline_checks.py --out "$RUNNER_TEMP/offline-checks.json"
      # Minimal exposure (PO 2026-10-30): this repository is public, so only check names and pass/fail counts leave the
      # runner. The full results, including captured stdout/stderr, stay on the runner and are discarded with it.
      - name: Reduce the offline results to check names and counts
        if: always()
        run: |
          python3 -I - <<'PY'
          import json, os, re, sys
          temp = os.environ["RUNNER_TEMP"]
          full = os.path.join(temp, "offline-checks.json")
          reduced = os.environ["CT_HISTORY"] == "none"
          # Reduced scope (Sam 1793373376): the history-bound pipeline and its attestation do not run, so neither is claimed.
          summary = {"schema": "speaksharp.cloud-test.offline-checks-summary.v2", "historyMode": os.environ["CT_HISTORY"],
                     "reducedScope": reduced, "liveExecutionAuthorized": False,
                     "steps": {"control-plane-pipeline": "NOT APPLICABLE" if reduced else "REQUIRED",
                               "preflight-attestation": "NOT APPLICABLE" if reduced else "REQUIRED"},
                     "resultValid": False, "overallPassed": False}

          def finish(error=None):
              if error:
                  summary["error"] = error
              json.dump(summary, open(os.path.join(temp, "offline-checks-summary.json"), "w"), indent=1)
              print("offline checks: %s" % (error or "%(passed)d passed, %(failed)d failed, %(notApplicable)d not applicable; reduced scope %(reducedScope)s; overall %(overall)s"
                                            % dict(summary, overall="PASS" if summary["overallPassed"] else "FAIL")))
              sys.exit(1 if error or not summary["overallPassed"] else 0)

          if not os.path.isfile(full):
              finish("RESULT_MISSING")
          try:
              result = json.load(open(full))
              checks = result["checks"]
              assert isinstance(result, dict) and isinstance(checks, list) and checks
              assert all(isinstance(c, dict) and isinstance(c.get("id"), str) for c in checks)
          except Exception:
              finish("RESULT_MALFORMED")
          status = lambda c: "N/A" if c.get("applicable", True) is False and c.get("passed") is None else "PASS" if c.get("passed") is True else "FAIL"
          # unittest names and counts only, from its own summary lines; never messages or tracebacks.
          text = lambda c: str(c.get("stdout", "")) + "\n" + str(c.get("stderr", ""))
          failing = lambda c: sorted({m.group(1) for m in re.finditer(r"^(?:ERROR|FAIL): (test\w* \([\w.]+\))", text(c), re.M)})
          def counts(c):
              ran = re.findall(r"^Ran (\d+) tests?", text(c), re.M)
              if not ran:
                  return {}
              tail = text(c)[text(c).rindex("Ran " + ran[-1]):]
              got = lambda key: int((re.search(key + r"=(\d+)", tail) or [0, 0])[1])
              return {"ran": int(ran[-1]), "failures": got("failures"), "errors": got("errors"), "skipped": got("skipped")}
          rows = []
          for c in checks:
              row = {"id": c["id"], "status": status(c)}
              row.update({"tests": counts(c)} if counts(c) else {})
              row.update({"failingTests": failing(c)} if row["status"] == "FAIL" and failing(c) else {})
              rows.append(row)
          count = lambda value: sum(r["status"] == value for r in rows)
          summary.update(checks=rows, passed=count("PASS"), failed=count("FAIL"), notApplicable=count("N/A"))
          for r in rows:
              print("%-4s %s" % (r["status"], r["id"]), *(["tests %s" % json.dumps(r["tests"], sort_keys=True)] if "tests" in r else []) + r.get("failingTests", []), sep="\n       ")
          applicable = [r for r in rows if r["status"] != "N/A"]
          derived = bool(applicable) and all(r["status"] == "PASS" for r in applicable)
          if result.get("historyMode", "required") != os.environ["CT_HISTORY"] or (result.get("passed") is True) != derived \
                  or (summary["reducedScope"] is False and count("N/A")):
              finish("RESULT_INCONSISTENT")
          summary.update(resultValid=True, overallPassed=derived)
          finish()
          PY
      - name: Record job end (usage account)
        run: python3 -I tools/cloud-test/scripts/record_timing.py end --job control-plane --dir "$RUNNER_TEMP/timings"
      - name: Control-plane pipeline (secret-free; stops if a credential-like variable is present)
        if: env.CT_HISTORY != 'none'
        working-directory: tools/cloud-test
        env:
          RUN_REQUEST: ${{ inputs.run_request }}
          MODE: ${{ inputs.mode }}
          LATEST_LABEL: ${{ inputs.latest_label }}
        run: |
          set -euo pipefail
          ARGS=(--request "../../$RUN_REQUEST" --out-dir "$RUNNER_TEMP/control-plane" --offline-checks "$RUNNER_TEMP/offline-checks.json" --timings "$RUNNER_TEMP/timings" --require-secret-free)
          if [ "$MODE" = "report" ]; then ARGS+=(--latest-label "$LATEST_LABEL"); fi
          python3 -I scripts/pipeline.py "${ARGS[@]}"
      - name: Assert the attestation (secret-free, no network attempts, no product host)
        if: env.CT_HISTORY != 'none'
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          a = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "control-plane", "preflight-attestation.json")))
          bad = [k for k, ok in (("secretFree", a["secretFree"] is True), ("networkAttempts", a["networkAttempts"] == 0), ("productHostsContacted", a["productHostsContacted"] == 0)) if not ok]
          if bad:
              sys.exit("attestation failed: %s" % bad)
          print("attestation ok: secret-free, 0 network attempts, 0 product hosts")
          PY
      - name: Upload the control-plane outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloud-test-control-plane
          # Minimal exposure (PO 2026-10-30, Sam RETURN 1793371883): names, statuses and counts only. Browser identity, the
          # attestation and timings stay on the runner.
          path: ${{ runner.temp }}/offline-checks-summary.json
          retention-days: 14
          if-no-files-found: error
