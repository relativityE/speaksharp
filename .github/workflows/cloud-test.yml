name: Cloud Test control plane (manual, secret-free)

# Manually dispatched ONLY, and it holds NO credentials: this workflow references no secret, no variable, no Environment and no write permission.
# It is the control plane of the Cloud test: offline checks, sealed-receipt verification, release verification from git, cumulative-usage
# reconciliation, gate evaluation, automatic latest-versus-prior comparison, spend/cost reporting and the report. It never contacts the product.
# The live run itself happens in the Claude task environment (the only runtime the harness admission accepts), driven by tools/cloud-test/scripts/execute_run.sh.
#
#   mode=preflight (default): evaluates every gate for the request and builds the report with Latest = PENDING.
#   mode=report: after a run's receipts were sealed into config/history/receipts/<latest_label>/ (and pinned in the config), compares Latest against the
#                previous run automatically and derives gap status, spend and the summary from that evidence.
#
# Network use: setup downloads only (PyPI pyyaml pinned, the npm lockfile); no browser is downloaded or installed. The control-plane scripts run
# under a network guard; the attestation artifact records secret-free: true, network attempts: 0 and product hosts contacted: 0.
on:
  workflow_dispatch:
    inputs:
      run_request:
        description: The labelled SYNTHETIC request fixture the control-plane pipeline runs on (current-code qualification, never campaign evidence); no other request is accepted
        required: true
        default: tools/cloud-test/tests/fixtures/partial-request.json
      mode:
        description: preflight evaluates gates and reports with Latest pending; report compares a sealed latest run automatically
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - report
      latest_label:
        description: For mode=report only, the sealed receipt label of the latest run (for example R6). Leave empty for preflight.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: cloud-test-control-plane
  cancel-in-progress: false

jobs:
  control-plane:
    name: Offline checks, gates, comparison and report (no secrets, no product traffic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PO 2026-10-30 redesign: every check and test here is a current-run check on current code and versioned synthetic fixtures; nothing reads
    # retained campaign history and nothing is N/A. The retained campaigns are audited separately (scripts/run_legacy_audit.py), never here.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - name: Validate dispatch inputs
        env:
          RUN_REQUEST: ${{ inputs.run_request }}
          MODE: ${{ inputs.mode }}
          LATEST_LABEL: ${{ inputs.latest_label }}
        run: |
          python3 -I - <<'PY'
          import os, re, sys
          p, mode, lab = os.environ["RUN_REQUEST"], os.environ["MODE"], os.environ["LATEST_LABEL"]
          # Explicit fixture selection (Sam 1793404770): any other or real/private request is refused, never reinterpreted.
          if p != "tools/cloud-test/tests/fixtures/partial-request.json":
              sys.exit("run_request must be the synthetic fixture tools/cloud-test/tests/fixtures/partial-request.json")
          if mode == "report" and not re.fullmatch(r"[A-Za-z0-9._-]{1,32}", lab):
              sys.exit("mode=report needs latest_label")
          if mode == "preflight" and lab:
              sys.exit("latest_label is only for mode=report")
          PY
      - name: Record job start (usage account)
        run: python3 -I tools/cloud-test/scripts/record_timing.py start --job control-plane --dir "$RUNNER_TEMP/timings"
      - name: Install the test dependency (pinned)
        run: python -m pip install --quiet pyyaml==6.0.2
      - name: Install runner dependencies from the lockfile
        run: npm --prefix tools/cloud-test/runner ci --ignore-scripts --no-audit --no-fund
      # No browser download or install (PO 2026-10-31): the runner must already hold the pinned Playwright 1.57.0 chromium, and the binary
      # must equal the package's pinned hash. An absent or different binary is SETUP-BLOCKED; nothing is fetched or substituted.
      - name: Verify the preinstalled pinned browser (no download or install; absent or mismatched is setup-blocked)
        working-directory: tools/cloud-test
        run: |
          set -euo pipefail
          CT_CHROME="$(python3 -I -c 'import json, os; b = json.load(open("config/test-config.v1.json"))["tools"]["browser"]; print(os.path.expanduser("~/.cache/ms-playwright/%s/chrome-linux64/chrome" % b["playwrightRevision"]))')"
          EXPECTED="$(python3 -I -c 'import json; print(json.load(open("config/test-config.v1.json"))["tools"]["browser"]["chromeBinarySha256"])')"
          ACTUAL=missing
          if [ -f "$CT_CHROME" ]; then ACTUAL="$(sha256sum "$CT_CHROME" | cut -d' ' -f1)"; fi
          echo "chromium identity: expected_sha256=$EXPECTED actual_sha256=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then echo "SETUP-BLOCKED: the pinned browser is absent or different on this runner at $CT_CHROME; no download or install is permitted"; exit 1; fi
          python3 -I scripts/install_browser.py --config config/test-config.v1.json --existing "$CT_CHROME" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" --receipt "$RUNNER_TEMP/cloud-browser-identity.json"
          echo "CT_CHROME=$CT_CHROME" >> "$GITHUB_ENV"
      - name: Verify the vendored reviewed harness against the approved hashes
        run: python3 -I tools/cloud-test/scripts/verify_harness.py --config tools/cloud-test/config/test-config.v1.json
      # PO 2026-10-30 (option A): ubuntu-24.04 blocks unprivileged user namespaces through AppArmor, so the package's strict
      # no-route clean-room proof (unshare -rn) cannot run. Re-enable them on this ephemeral runner only, then prove it works.
      - name: Allow the clean-room network namespace on this ephemeral runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn true
      # Proof v2: the offline proof is generated HERE from the vendored harness, the pinned Chrome and the tracked fixtures, so its TAP,
      # mutation and plan-control inputs have same-job provenance and need no retained history. TAP, plans and the proof stay on the runner.
      - name: Generate the offline proof in this job (pinned harness and Chrome)
        working-directory: tools/cloud-test
        run: python3 -I scripts/generate_offline_proof.py --work "$RUNNER_TEMP/proof" --proof-out "$RUNNER_TEMP/offline-proof.json"
      - name: Offline checks (package tests, report tests, workflow policy, integration proof on loopback)
        working-directory: tools/cloud-test
        env:
          CT_REQUIRE_INTEGRATION: '1'
          # The policy tests otherwise read the package's preserved fixture; they must judge this workflow.
          CLOUD_TEST_YML: ${{ github.workspace }}/.github/workflows/cloud-test.yml
          CT_PROOF_FILE: ${{ runner.temp }}/offline-proof.json
        run: python3 -I scripts/run_offline_checks.py --out "$RUNNER_TEMP/offline-checks.json"
      # Minimal exposure (PO 2026-10-30): this repository is public, so only check names and pass/fail counts leave the
      # runner. The full results, including captured stdout/stderr, stay on the runner and are discarded with it.
      - name: Reduce the offline results to check names and counts
        if: always()
        # Exact inventory, legal applicability and fail-closed handling live in the package and are unit-tested there
        # (tests/test_offline_summary.py); a missing, malformed or inconsistent result fails this step.
        run: python3 -I tools/cloud-test/scripts/summarize_offline_checks.py --in "$RUNNER_TEMP/offline-checks.json" --out "$RUNNER_TEMP/offline-checks-summary.json"
      - name: Record job end (usage account)
        run: python3 -I tools/cloud-test/scripts/record_timing.py end --job control-plane --dir "$RUNNER_TEMP/timings"
      # The real pipeline over a labelled SYNTHETIC sealed history and the selected synthetic request fixture, with this job's own offline proof:
      # current-code qualification of the control plane (Sam 1793404770), never campaign evidence and never live credit.
      - name: Build the synthetic sealed history for the control-plane pipeline (labelled fixtures, no live credit)
        env:
          RUN_REQUEST: ${{ inputs.run_request }}
        run: python3 -I tools/cloud-test/tests/_synthetic_history.py --out "$RUNNER_TEMP/synthetic-history" --request "$RUN_REQUEST" --proof "$RUNNER_TEMP/offline-proof.json"
      - name: Control-plane pipeline (secret-free; stops if a credential-like variable is present)
        working-directory: tools/cloud-test
        env:
          MODE: ${{ inputs.mode }}
          LATEST_LABEL: ${{ inputs.latest_label }}
        run: |
          set -euo pipefail
          mapfile -t FIXTURE < "$RUNNER_TEMP/synthetic-history/pipeline-args.txt"
          ARGS=("${FIXTURE[@]}" --out-dir "$RUNNER_TEMP/control-plane" --offline-checks "$RUNNER_TEMP/offline-checks.json" --timings "$RUNNER_TEMP/timings" --require-secret-free)
          if [ "$MODE" = "report" ]; then ARGS+=(--latest-label "$LATEST_LABEL"); fi
          python3 -I scripts/pipeline.py "${ARGS[@]}"
      - name: Assert the attestation (secret-free, no network attempts, no product host)
        run: |
          python3 -I - <<'PY'
          import json, os, sys
          a = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "control-plane", "preflight-attestation.json")))
          bad = [k for k, ok in (("secretFree", a["secretFree"] is True), ("networkAttempts", a["networkAttempts"] == 0), ("productHostsContacted", a["productHostsContacted"] == 0)) if not ok]
          if bad:
              sys.exit("attestation failed: %s" % bad)
          print("attestation ok: secret-free, 0 network attempts, 0 product hosts")
          PY
      - name: Upload the control-plane outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloud-test-control-plane
          # Minimal exposure (PO 2026-10-30, Sam RETURN 1793371883): names, statuses and counts only. Browser identity, the
          # attestation and timings stay on the runner.
          path: ${{ runner.temp }}/offline-checks-summary.json
          retention-days: 14
          if-no-files-found: error
