# Outcome 7 / outcome 8: billing user journeys on a DISPOSABLE LOCAL Supabase stack, Stripe TEST MODE only.
#
# Dispatch-only and approval-gated. Each run starts its own local Supabase (database migrated from this
# commit, local Auth and Edge functions), serves this commit's app on http://localhost:5173, forwards
# genuine Stripe test-mode events to the LOCAL stripe-webhook with `stripe listen`, runs the billing
# journey spec against that stack, verifies the Stripe test objects are gone, and tears everything down.
#
# It creates NO live object, no hosted Supabase project, changes no secret or setting, deploys nothing,
# and never touches production. A PASS here is "sandbox-qualified": it does not prove the deployed public
# webhook endpoint, production configuration, or a real charge.
name: Billing journeys on a local stack (TEST MODE)

on:
  workflow_dispatch:
    inputs:
      acknowledge_test_mode:
        description: 'Type ISOLATED-TEST-MODE-ONLY to confirm a disposable local stack and Stripe test mode'
        required: true
        type: string
      commit_sha:
        description: 'Exact 40-character commit to test (must equal the dispatched ref head)'
        required: true
        type: string
      journey:
        description: 'Which billing journey to run'
        required: true
        type: choice
        default: conversion
        options: [conversion, renewal_recovery, portal_expiry, failed_checkout, portal_recovery, refund_period_end]

permissions:
  contents: read

concurrency:
  # Shares the Stripe test account with the commercial lifecycle workflow: never overlap, never cancel
  # a run mid-cleanup.
  group: stripe-commercial-lifecycle
  cancel-in-progress: false

jobs:
  journey:
    name: billing ${{ inputs.journey }} (local stack, test mode)
    runs-on: ubuntu-latest
    # Protected environment: required reviewers must approve each run before any secret is exposed.
    environment: billing-local-stack
    timeout-minutes: 60
    env:
      SUPABASE_WORKDIR: backend
      LOCAL_STACK_PROJECT: billing-local-stack-${{ github.run_id }}-${{ github.run_attempt }}
      LOCAL_API_URL: http://127.0.0.1:54321
      LOCAL_APP_URL: http://localhost:5173
      PRODUCTION_SUPABASE_URL: https://yxlapjuovrsvjswkwnrk.supabase.co
      STRIPE_CLI_VERSION: '1.21.8'
      # Count only a genuine Stripe list. `.data | length` alone reads {} and {"data":null} as 0 (clean);
      # anything that is not {"object":"list","data":[...]} is an error, never zero.
      STRIPE_LIST_COUNT: 'if type == "object" and .object == "list" and (.data | type) == "array" then (.data | length) else error("not a Stripe list") end'
    steps:
      - name: Refuse an unacknowledged or inexact dispatch
        env:
          ACK: ${{ inputs.acknowledge_test_mode }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$ACK" = 'ISOLATED-TEST-MODE-ONLY' ] || { echo '::error::Dispatch must acknowledge ISOLATED-TEST-MODE-ONLY.'; exit 1; }
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::commit_sha must be a full 40-character SHA.'; exit 1; }
          [ "$REQUESTED_SHA" = "$DISPATCHED_SHA" ] || { echo '::error::commit_sha does not match the dispatched ref head.'; exit 1; }

      - name: Stripe account check (before anything is created)
        id: stripe_account
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_PRO_PRICE_ID: ${{ secrets.STRIPE_TEST_PRO_PRICE_ID }}
          EXPECTED_ACCOUNT_ID: ${{ vars.STRIPE_TEST_ACCOUNT_ID }}
          STRIPE_TEST_PUBLISHABLE_KEY: ${{ vars.STRIPE_TEST_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          case "${STRIPE_TEST_SECRET_KEY:-}" in
            sk_test_*) : ;;
            *) echo '::error::A Stripe TEST secret key (sk_test_...) is required; any other key is refused.'; exit 1 ;;
          esac
          case "${STRIPE_TEST_PUBLISHABLE_KEY:-}" in
            pk_test_*) : ;;
            *) echo '::error::vars.STRIPE_TEST_PUBLISHABLE_KEY must be a pk_test_ key.'; exit 1 ;;
          esac
          [[ "${EXPECTED_ACCOUNT_ID:-}" =~ ^acct_[A-Za-z0-9]+$ ]] || { echo '::error::vars.STRIPE_TEST_ACCOUNT_ID is not configured; refusing to guess the account.'; exit 1; }
          stripe_get() { curl -fsS --max-time 30 -u "${STRIPE_TEST_SECRET_KEY}:" "https://api.stripe.com/v1/$1"; }
          # GET only. The key must belong to the one approved test account, and that account must answer in test mode.
          account_id="$(stripe_get account | jq -r '.id // empty')"
          [ "$account_id" = "$EXPECTED_ACCOUNT_ID" ] || { echo '::error::The Stripe key does not belong to the approved test account. Stopping.'; exit 1; }
          [ "$(stripe_get balance | jq -r '.livemode')" = 'false' ] || { echo '::error::Stripe did not answer in test mode. Stopping.'; exit 1; }
          price="$(stripe_get "prices/${STRIPE_TEST_PRO_PRICE_ID}")"
          jq -e '.livemode == false and .active == true and .unit_amount == 1000 and .currency == "usd"
            and .recurring.interval == "month" and .recurring.interval_count == 1' <<<"$price" >/dev/null \
            || { echo '::error::The test price is not the active $10 monthly test price. Stopping.'; exit 1; }
          echo 'Stripe account check passed: approved test account, test mode, expected price.'
          # The test account is reused across runs, so the end-of-run check is account-wide. Refuse to start
          # on an account that already holds fixtures, so that check judges only what this run created.
          # Every subscription state that is still live or can still bill counts as a leftover fixture.
          stripe_count() {
            local body
            body="$(stripe_get "$1")" || { echo "::error::BLOCKED PREREQUISITE: could not read $2 from Stripe. Nothing was created." >&2; exit 1; }
            jq -e "$STRIPE_LIST_COUNT" <<<"$body" 2>/dev/null \
              || { echo "::error::BLOCKED PREREQUISITE: Stripe's answer for $2 was not a list, so it cannot be read as zero. Nothing was created." >&2; exit 1; }
          }
          dirty=0
          clocks="$(stripe_count 'test_helpers/test_clocks?limit=1' 'test clocks')"
          echo "Test clocks before the run: $clocks"
          [ "$clocks" = '0' ] || dirty=1
          for state in active trialing past_due unpaid incomplete; do
            count="$(stripe_count "subscriptions?status=${state}&limit=1" "${state} subscriptions")"
            echo "Subscriptions in ${state} before the run: $count"
            [ "$count" = '0' ] || dirty=1
          done
          if [ "$dirty" != '0' ]; then
            echo 'blocked=dirty_test_account' >> "$GITHUB_OUTPUT"
            echo '::error::BLOCKED PREREQUISITE, not a billing failure: the test account already holds test clocks or live subscriptions (active, trialing, past_due, unpaid or incomplete) from an earlier run. This run refuses and deletes nothing, and it never cleans up objects another run created. Before anyone deletes them, confirm the run that created them has stopped; age alone is not proof it was abandoned.'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0

      - name: Start the disposable local Supabase stack (migrations from this commit)
        id: stack_start
        run: |
          set -euo pipefail
          # backend/supabase/seed.sql is a stale local-dev fixture: it writes the generated auth.users.confirmed_at
          # column, collides with the profile trigger and ends in a psql-only \echo, so seeding stops the start. The
          # journey makes its own throwaway accounts, so this runner's checkout skips seeding; the repo file is untouched.
          printf '\n[db.seed]\nenabled = false\n' >> "$SUPABASE_WORKDIR/supabase/config.toml"
          # A run-unique project id names every container, volume and network this stack creates, so the
          # destruction proof below can only match this run's stack (never the repo's real project id).
          sed -i "s/^project_id = .*/project_id = \"$LOCAL_STACK_PROJECT\"/" "$SUPABASE_WORKDIR/supabase/config.toml"
          grep -qx "project_id = \"$LOCAL_STACK_PROJECT\"" "$SUPABASE_WORKDIR/supabase/config.toml" \
            || { echo '::error::Could not give the disposable stack its run-unique project id.'; exit 1; }
          supabase start --workdir "$SUPABASE_WORKDIR" -x studio,imgproxy,vector,logflare
          status="$(supabase status --workdir "$SUPABASE_WORKDIR" -o json)"
          api_url="$(jq -r '.API_URL' <<<"$status")"
          [ "$api_url" = "$LOCAL_API_URL" ] || { echo "::error::Unexpected local API URL."; exit 1; }
          anon="$(jq -r '.ANON_KEY' <<<"$status")"; service="$(jq -r '.SERVICE_ROLE_KEY' <<<"$status")"
          echo "::add-mask::$anon"; echo "::add-mask::$service"
          { echo "LOCAL_ANON_KEY=$anon"; echo "LOCAL_SERVICE_ROLE_KEY=$service"; } >> "$GITHUB_ENV"

      # Sam's #1813 return (b): record exactly what this run created, right after creation. Each Docker query is
      # checked on its own; the label and name selectors must agree and include this run's database container
      # and data volume, and the database must answer with its own system identifier. A wrong selector fails here.
      - name: Record this run's stack identity
        id: stack_identity
        run: |
          set -euo pipefail
          # Kept in the workspace and uploaded with the receipts: the baseline the destruction proof is checked
          # against (Docker ids only, no secrets). The proof and the combined receipt carry its sha256.
          node tests/billing/user-journey/localStackResources.mjs capture "$LOCAL_STACK_PROJECT" \
            > billing-local-stack-identity.json
          jq -c '{project, containers: (.containers | length), volumes: (.volumes | length), networks: (.networks | length)}' \
            billing-local-stack-identity.json

      - name: Install the Stripe CLI (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}"
          archive="stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSL "$base/stripe-linux-checksums.txt" -o checksums.txt
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" stripe
          install -m 0755 stripe /usr/local/bin/stripe
          stripe version

      - name: Forward genuine test-mode Stripe events to the LOCAL webhook
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          set -euo pipefail
          # A per-run signing secret: the webhook only accepts events signed for this run's listener.
          secret="$(stripe listen --print-secret)"
          [[ "$secret" =~ ^whsec_ ]] || { echo '::error::stripe listen did not issue a signing secret.'; exit 1; }
          echo "::add-mask::$secret"
          echo "LOCAL_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
          nohup stripe listen --forward-to "$LOCAL_API_URL/functions/v1/stripe-webhook" \
            > "$RUNNER_TEMP/stripe-listen.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/stripe-listen.pid"

      - name: Serve this commit's Edge functions locally
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_PRO_PRICE_ID: ${{ secrets.STRIPE_TEST_PRO_PRICE_ID }}
          # Coaching (get-ai-suggestions) reads its provider key from env; the paid-value-loop journey needs it.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/functions.env"
          ( umask 077
            {
              echo "STRIPE_SECRET_KEY=$STRIPE_TEST_SECRET_KEY"
              echo "STRIPE_PRO_PRICE_ID=$STRIPE_TEST_PRO_PRICE_ID"
              echo "STRIPE_WEBHOOK_SECRET=$LOCAL_WEBHOOK_SECRET"
              echo "PAYMENTS_ENABLED=true"
              # stripe-checkout/localSandbox.ts: the only non-live checkout path, loopback stack only.
              echo "BILLING_LOCAL_SANDBOX=ISOLATED-TEST-MODE-ONLY"
              echo "SITE_URL=$LOCAL_APP_URL"
              echo "GEMINI_API_KEY=${GEMINI_API_KEY:-}"
            } > "$env_file" )
          # Fingerprints only (never the values): the runner refuses a key or price other than these before
          # any Stripe call (runnerPreflight.mjs).
          {
            echo "BILLING_LOCAL_FUNCTIONS_STRIPE_KEY_SHA256=$(printf '%s' "$STRIPE_TEST_SECRET_KEY" | sha256sum | cut -d' ' -f1)"
            echo "BILLING_LOCAL_FUNCTIONS_PRICE_SHA256=$(printf '%s' "$STRIPE_TEST_PRO_PRICE_ID" | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"
          # --no-verify-jwt matches how production publishes every function.
          nohup supabase functions serve --workdir "$SUPABASE_WORKDIR" --no-verify-jwt --env-file "$env_file" \
            > "$RUNNER_TEMP/functions.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/functions.pid"
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $LOCAL_APP_URL" \
              "$LOCAL_API_URL/functions/v1/stripe-checkout" || true)"
            [ "$code" = '204' ] || [ "$code" = '200' ] && break
            sleep 2
          done
          [ "$code" = '204' ] || [ "$code" = '200' ] || { echo '::error::Local Edge functions did not come up.'; exit 1; }

      - name: Build and serve this commit's app on the local origin
        env:
          VITE_SUPABASE_URL: ${{ env.LOCAL_API_URL }}
          VITE_AUTH_MODE: real
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_TEST_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # Release id is GITHUB_SHA (vite release-inject), which the first step bound to commit_sha.
          VITE_SUPABASE_ANON_KEY="$LOCAL_ANON_KEY" pnpm --dir frontend exec vite build --mode production
          # Fingerprint only: the runner refuses a publishable key other than the one this app was built with.
          echo "BILLING_LOCAL_APP_PUBLISHABLE_KEY_SHA256=$(printf '%s' "$VITE_STRIPE_PUBLISHABLE_KEY" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          nohup pnpm --dir frontend exec vite preview --host localhost --port 5173 --strictPort \
            > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null "$LOCAL_APP_URL/" && break; sleep 2; done
          curl -fsS -o /dev/null "$LOCAL_APP_URL/" || { echo '::error::Local app did not come up.'; exit 1; }

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the billing journey against the local stack
        env:
          BILLING_SANDBOX_TARGET: local-disposable-stack
          BILLING_JOURNEY_APPROVAL: ISOLATED-TEST-MODE-ONLY
          BILLING_SANDBOX_APP_URL: ${{ env.LOCAL_APP_URL }}
          BILLING_SANDBOX_SUPABASE_URL: ${{ env.LOCAL_API_URL }}
          BILLING_PRODUCTION_SUPABASE_URL: ${{ env.PRODUCTION_SUPABASE_URL }}
          BILLING_SANDBOX_STRIPE_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          BILLING_SANDBOX_PUBLISHABLE_KEY: ${{ vars.STRIPE_TEST_PUBLISHABLE_KEY }}
          BILLING_SANDBOX_PRICE_ID: ${{ secrets.STRIPE_TEST_PRO_PRICE_ID }}
          BILLING_SANDBOX_RELEASE_SHA: ${{ inputs.commit_sha }}
          JOURNEY: ${{ inputs.journey }}
          # Collects all six branches; -g below runs only the dispatched one.
          BILLING_RUNNER_MODE: full
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-report.json
        run: |
          set -euo pipefail
          BILLING_SANDBOX_ANON_KEY="$LOCAL_ANON_KEY" BILLING_SANDBOX_SERVICE_ROLE_KEY="$LOCAL_SERVICE_ROLE_KEY" \
            pnpm exec playwright test -c playwright.billing-journey.config.ts --reporter=list,json -g "billing ${JOURNEY}:"

      - name: Extract the content-free receipt only
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/playwright-report.json"
          if [ -f "$report" ]; then
            # Only the spec's own sanitized receipt attachment leaves the runner; never the raw report or logs.
            jq '[.. | objects | select(.name? == "billing-user-journey.json") | .body | @base64d | fromjson]' \
              "$report" > billing-local-stack-receipt.json
            sha256sum billing-local-stack-receipt.json | tee billing-local-stack-receipt.sha256
          fi

      - name: Verify no Stripe test fixture remains
        id: stripe_residue
        # Only after the dispatch check AND the approved test-account check succeeded: a rejected ACK, SHA or
        # account makes zero provider calls here. Still runs after a later journey failure.
        if: always() && steps.stripe_account.outcome == 'success'
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          set -euo pipefail
          stripe_get() { curl -fsS --max-time 30 -u "${STRIPE_TEST_SECRET_KEY}:" "https://api.stripe.com/v1/$1"; }
          stripe_count() {
            local body
            body="$(stripe_get "$1")" || { echo "::error::Could not read $2 from Stripe, so no residue can be claimed absent." >&2; exit 1; }
            jq -e "$STRIPE_LIST_COUNT" <<<"$body" 2>/dev/null \
              || { echo "::error::Stripe's answer for $2 was not a list, so it cannot be read as zero." >&2; exit 1; }
          }
          dirty=0
          clocks="$(stripe_count 'test_helpers/test_clocks?limit=1' 'test clocks')"
          echo "Remaining test clocks: $clocks"
          [ "$clocks" = '0' ] || dirty=1
          for state in active trialing past_due unpaid incomplete; do
            count="$(stripe_count "subscriptions?status=${state}&limit=1" "${state} subscriptions")"
            echo "Remaining subscriptions in ${state}: $count"
            [ "$count" = '0' ] || dirty=1
          done
          [ "$dirty" = '0' ] \
            || { echo '::error::Stripe test fixtures remain after the run. Invoices and events are immutable audit records and are not counted.'; exit 1; }

      - name: Tear down the local stack and listeners
        id: stack_stop
        # Checked: a failed stop fails this step, and the combined receipt below cannot pass.
        if: always() && steps.stack_start.outcome != 'skipped'
        run: |
          set -euo pipefail
          for pid_file in stripe-listen.pid functions.pid; do
            [ -f "$RUNNER_TEMP/$pid_file" ] && kill "$(cat "$RUNNER_TEMP/$pid_file")" 2>/dev/null || true
          done
          rm -f "$RUNNER_TEMP/functions.env"
          supabase stop --workdir "$SUPABASE_WORKDIR" --no-backup

      # The journey cannot read three billing tables (service_role has no access), so it never claims they
      # are empty. What makes their rows harmless is that the whole database is gone: prove it.
      - name: Prove the disposable stack was destroyed
        id: stack_destroyed
        # Only after a CHECKED stop: an empty selector after a failed stop is not proof.
        if: always() && steps.stack_start.outcome != 'skipped' && steps.stack_stop.outcome == 'success'
        run: |
          set -euo pipefail
          # Each identity recorded after creation must now be absent (Docker's own "no such" answer); any
          # other inspect error is unverified, and the selectors are re-read, each checked on its own.
          node tests/billing/user-journey/localStackResources.mjs verify "$LOCAL_STACK_PROJECT" \
            billing-local-stack-identity.json > billing-local-stack-destroyed.json \
            || { echo '::error::The disposable stack was not proven destroyed; its billing rows were never read, so this run cannot pass.'; exit 1; }
          cat billing-local-stack-destroyed.json

      # The journey's own receipt can only say PENDING_STACK_DESTRUCTION on this stack. It becomes PASSED only
      # here, after the checked teardown, the destruction proof and the Stripe residue check all succeeded.
      - name: Finalise the combined receipt
        id: combined
        if: always() && steps.stack_start.outcome != 'skipped'
        env:
          JOURNEY: ${{ inputs.journey }}
          RELEASE: ${{ inputs.commit_sha }}
          STACK_STOPPED: ${{ steps.stack_stop.outcome }}
          STACK_DESTROYED: ${{ steps.stack_destroyed.outcome }}
          STRIPE_CLEAN: ${{ steps.stripe_residue.outcome }}
        run: |
          set -euo pipefail
          [ -f billing-local-stack-receipt.json ] || echo 'null' > billing-local-stack-receipt.json
          # Sam's #1813 return (c): the finalizer checks the receipt is exactly this dispatch's journey, release
          # and stack, with every step PASSED, and that the destruction proof is for the same stack. The
          # combined result carries the raw receipt's sha256, so the two stay bound to this run.
          node tests/billing/user-journey/localStackReceipt.mjs \
            --receipt billing-local-stack-receipt.json --destruction billing-local-stack-destroyed.json \
            --identity billing-local-stack-identity.json \
            --journey "$JOURNEY" --release "$RELEASE" --run "$LOCAL_STACK_PROJECT" \
            --stack-stopped "$STACK_STOPPED" --stack-destroyed "$STACK_DESTROYED" --stripe-clean "$STRIPE_CLEAN" \
            > billing-local-stack-combined.json && status=0 || status=$?
          cat billing-local-stack-combined.json
          sha256sum billing-local-stack-combined.json | tee billing-local-stack-combined.sha256
          [ "$status" = '0' ] || { echo '::error::Combined receipt is NOT_PROVEN: the journey, teardown, destruction proof or Stripe residue check did not all pass.'; exit 1; }

      # Runs even after the dispatch check refused the inputs, so every value reaches the shell only as a quoted
      # environment variable: no expression is ever interpolated into shell source (Codex, #1813).
      - name: Summarize
        id: summary
        if: always()
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          JOURNEY: ${{ inputs.journey }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STRIPE_BLOCKED: ${{ steps.stripe_account.outputs.blocked }}
          STACK_STOPPED: ${{ steps.stack_stop.outcome }}
          STACK_DESTROYED: ${{ steps.stack_destroyed.outcome }}
          STRIPE_CLEAN: ${{ steps.stripe_residue.outcome }}
        run: |
          {
            echo '## Billing journey on a local stack (TEST MODE, sandbox-qualified only)'
            printf -- '- Commit: `%s`\n' "$COMMIT_SHA"
            printf -- '- Journey: %s\n' "$JOURNEY"
            printf -- '- Run: %s\n' "$RUN_URL"
            if [ -f billing-local-stack-receipt.sha256 ]; then
              echo "- Receipt SHA-256: \`$(cut -d' ' -f1 billing-local-stack-receipt.sha256)\`"
            else
              echo '- No receipt: the run stopped before the journey wrote one.'
            fi
            if [ "$STRIPE_BLOCKED" = 'dirty_test_account' ]; then
              echo '- BLOCKED PREREQUISITE: the test account held fixtures from an earlier run. Not a billing failure; nothing was created or deleted.'
            fi
            echo '- Billing rows (fences, checkout operations, save obligations): not read; service_role has no access.'
            printf -- '- Stack stopped: %s; destroyed: %s; Stripe residue check: %s\n' "$STACK_STOPPED" "$STACK_DESTROYED" "$STRIPE_CLEAN"
            if [ -f billing-local-stack-combined.json ]; then
              echo "- Combined result: $(jq -r '.result' billing-local-stack-combined.json)"
              echo "- Stack identity SHA-256: \`$(jq -r '.stackIdentitySha256 // "not proven"' billing-local-stack-combined.json)\`"
            else
              echo '- Combined result: not produced'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-local-stack-${{ inputs.journey }}-${{ github.run_id }}
          path: |
            billing-local-stack-receipt.json
            billing-local-stack-receipt.sha256
            billing-local-stack-identity.json
            billing-local-stack-destroyed.json
            billing-local-stack-combined.json
            billing-local-stack-combined.sha256
          if-no-files-found: warn
