name: Deliberate production release

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Separate explicit authorization to mutate production'
        type: boolean
        default: false
      expected_head_sha:
        description: 'Exact qualified current main SHA'
        type: string
        required: true
      operation:
        description: 'One separately authorized release operation'
        type: choice
        options: [frontend, edge-functions, account-closure-only, enable-coaching-readiness]
        required: true
      confirm:
        description: 'Type RELEASE <operation> AT <exact SHA>'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deliberate-production-release
  cancel-in-progress: false

jobs:
  production-policy:
    if: ${{ inputs.deploy_production == true && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.policy.outputs.allowed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - id: policy
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release-policy.mjs authorize

  validate-release:
    needs: production-policy
    if: ${{ inputs.deploy_production == true && needs.production-policy.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require exact operation confirmation
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$OPERATION" in frontend|edge-functions|account-closure-only|enable-coaching-readiness) ;; *) exit 1 ;; esac
          [ "$CONFIRM" = "RELEASE $OPERATION AT $EXPECTED_HEAD_SHA" ]

  release-edge:
    needs: [production-policy, validate-release]
    if: ${{ inputs.deploy_production == true && needs.production-policy.outputs.allowed == 'true' && inputs.operation == 'edge-functions' }}
    uses: ./.github/workflows/deploy-supabase-migrations.yml
    with:
      deploy_production: true
      expected_head_sha: ${{ inputs.expected_head_sha }}
      deploy_edge_functions: true
      operation: edge-functions
    secrets: inherit

  # Deletion rollout step 5 (plan #1952): exactly the account-closure bundle; no other function and no authority
  # invalidation. The ten-function edge-functions operation above is unchanged.
  release-account-closure:
    needs: [production-policy, validate-release]
    if: ${{ inputs.deploy_production == true && needs.production-policy.outputs.allowed == 'true' && inputs.operation == 'account-closure-only' }}
    uses: ./.github/workflows/deploy-supabase-migrations.yml
    with:
      deploy_production: true
      expected_head_sha: ${{ inputs.expected_head_sha }}
      deploy_edge_functions: false
      operation: account-closure-only
    secrets: inherit

  # This changes one runtime setting, not a function bundle or the generic secret sync.
  verify-coaching-readiness-release-gate:
    needs: [production-policy, validate-release]
    if: ${{ inputs.deploy_production == true && needs.production-policy.outputs.allowed == 'true' && inputs.operation == 'enable-coaching-readiness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require an existing main-only gate with reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/environments/production-db" |
            jq -e '.deployment_branch_policy.custom_branch_policies == true
              and any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)' >/dev/null
          gh api --paginate --slurp "repos/$REPOSITORY/environments/production-db/deployment-branch-policies" |
            jq -e '[.[].branch_policies[].name] == ["main"]' >/dev/null

  enable-coaching-readiness:
    needs: [verify-coaching-readiness-release-gate]
    if: ${{ inputs.deploy_production == true && inputs.operation == 'enable-coaching-readiness' && needs.verify-coaching-readiness-release-gate.result == 'success' }}
    environment: production-db
    concurrency:
      group: production-database-migrations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0
      - name: Verify the installed readiness schema and T2 prerequisites
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq postgresql-client
          bash scripts/supabase-pooler-connection.sh "$RUNNER_TEMP/t2-pooler.env"
          set -a; . "$RUNNER_TEMP/t2-pooler.env"; set +a
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          unset DB_URL
          bash scripts/assert-db-connectivity-tls.sh
          [ "$(PGOPTIONS='-c default_transaction_read_only=on' psql -XqAt -v ON_ERROR_STOP=1 \
            -c "SELECT EXISTS (SELECT FROM supabase_migrations.schema_migrations WHERE version = '20261126005433')")" = t ]
          node scripts/t2-migration-postflight.mjs verify edge-release
      - name: Recheck exact green main before invalidating drain authority
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release-policy.mjs authorize
      - name: Invalidate account-deletion drain authority before configuration changes
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/account-closure-invalidate.mjs
      - name: Set only the coaching readiness flag
        timeout-minutes: 1
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          case "$SUPABASE_PROJECT_ID" in
            *[!a-z0-9]*) exit 1 ;;
          esac
          [ "${#SUPABASE_PROJECT_ID}" -eq 20 ]
          [ -n "$SUPABASE_ACCESS_TOKEN" ]
          node scripts/production-release-policy.mjs authorize |
            jq -e --arg sha "$EXPECTED_HEAD_SHA" '.allowed == true and .state == "QUALIFIED" and .releaseSha == $sha' >/dev/null
          supabase secrets set COACHING_MODEL_READINESS_ENABLED=true --project-ref "$SUPABASE_PROJECT_ID"
          echo 'Supabase acknowledged the readiness flag write; app behavior remains unverified.' >> "$GITHUB_STEP_SUMMARY"

  release-frontend:
    needs: [production-policy, validate-release]
    if: ${{ inputs.deploy_production == true && needs.production-policy.outputs.allowed == 'true' && inputs.operation == 'frontend' }}
    # Reuse the existing protected mutation environment; do not create an unprotected release environment.
    environment: production-db
    concurrency:
      group: production-database-migrations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          install-dependencies: 'false'
      - name: Prepare the exact production build (no upload)
        env:
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [ -n "$VERCEL_ACCESS_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]
          npx --yes vercel@48.2.0 pull --yes --environment=production --token "$VERCEL_ACCESS_TOKEN"
          npx --yes vercel@48.2.0 build --prod --token "$VERCEL_ACCESS_TOKEN"
      - name: Recheck exact green main immediately before upload
        env:
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-release-policy.mjs authorize
      - name: Upload one prebuilt production release
        env:
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes vercel@48.2.0 deploy --prebuilt --prod --yes --token "$VERCEL_ACCESS_TOKEN"
      - name: Verify the canonical served identity
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if node scripts/production-release-policy.mjs served > "$RUNNER_TEMP/production-release-receipt.json"; then
              cat "$RUNNER_TEMP/production-release-receipt.json"
              echo "Verified served SHA: $EXPECTED_RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
              echo 'The scheduled canary reads the served release from production at run time; no binding needs advancing.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo '::error::HOLD — production upload attempted but served identity is unverified; do not repeat deployment blindly.'
          exit 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: production-release-receipt
          path: ${{ runner.temp }}/production-release-receipt.json
          if-no-files-found: warn
          retention-days: 1
