name: "Progress history PostgREST proof (disposable stack)"
# #1258 F3 — the API-layer rung for the Progress history read. `session_progress_evaluations` has three foreign keys to
# `sessions`, so an un-hinted embed is ambiguous to PostgREST (PGRST201) — a defect no mocked client can show. This
# drives the REAL loadSessionProgress and useLinkedRepeat through the installed @supabase/postgrest-js, with signed
# JWTs, against a real PostgREST on a disposable Postgres holding the migration-defined Progress relationships.
# No Production access, no secrets: the JWT secret below is disposable. Mirrors feedback-postgrest-proof.yml.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'frontend/src/services/progress/loadSessionProgress.ts'
      - 'frontend/src/hooks/useLinkedRepeat.ts'
      - 'backend/supabase/migrations/20260731120000_session_progress_evaluations.sql'
      - 'backend/supabase/migrations/20260731130000_progress_recommendations.sql'
      - 'scripts/progress-postgrest-bootstrap.sh'
      - 'tests/http/progress-history-postgrest.http.ts'
      - 'tests/http/vitest.http.config.mjs'
      - '.github/workflows/progress-postgrest-proof.yml'
permissions:
  contents: read
concurrency:
  group: progress-postgrest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    name: "Progress history PostgREST (postgres:${{ matrix.pg }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable_ci_only
      PGDATABASE: matrix_test
      PGRST_JWT_SECRET: disposable-ci-only-secret-at-least-32-chars-long
      PGRST_PORT: '3999'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Install psql client (bounded)
        run: |
          timeout 180 sudo apt-get update -qq || { echo "::error::apt-get update exceeded its 180s bound"; exit 1; }
          timeout 180 sudo apt-get install -y -qq postgresql-client \
            || { echo "::error::apt-get install exceeded its 180s bound"; exit 1; }
          set -o pipefail
          psql -Atc 'select version()'

      - name: Bootstrap the disposable schema (migration-defined relationships only)
        run: |
          # BEFORE PostgREST starts: its anonymous role (`anon`, as on Supabase) must exist for the readiness probe.
          set -o pipefail
          bash scripts/progress-postgrest-bootstrap.sh | tee progress-pgrst-${{ matrix.pg }}.txt

      - name: Start disposable PostgREST
        run: |
          docker run -d --name pgrst --network host \
            -e PGRST_DB_URI="postgres://postgres:disposable_ci_only@127.0.0.1:5432/matrix_test" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$PGRST_JWT_SECRET" \
            -e PGRST_SERVER_PORT="$PGRST_PORT" \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:${PGRST_PORT}/" >/dev/null && break
            sleep 2
          done
          curl -sf "http://127.0.0.1:${PGRST_PORT}/" >/dev/null || { echo '::error::PostgREST did not become ready'; docker logs pgrst; exit 1; }

      - name: Progress history PostgREST proof (real service + installed postgrest-js)
        env:
          PROGRESS_PGRST_URL: http://127.0.0.1:3999
        run: |
          # pipefail is REQUIRED: GitHub runs steps with `bash -e` only, and a tee would otherwise mask a FAIL.
          set -o pipefail
          pnpm exec vitest run --config tests/http/vitest.http.config.mjs --reporter=verbose tests/http/progress-history-postgrest.http.ts 2>&1 | tee -a progress-pgrst-${{ matrix.pg }}.txt

      - name: PostgREST logs on failure
        if: failure()
        run: docker logs pgrst || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Progress history PostgREST proof — postgres:${{ matrix.pg }}"
            echo '```'
            grep -E '^bootstrap:|✓|×|Tests |Test Files' progress-pgrst-${{ matrix.pg }}.txt 2>/dev/null || echo 'no result captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
