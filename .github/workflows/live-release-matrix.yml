name: Live Release Matrix

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        required: true
        default: all
        type: choice
        options:
          - all
          - attribution-proof
          - orphan-audit
          - orphan-check
          - custom-words
          - native-preflight
          - cloud-token-gates
          - cloud-artifact
          - stt-switching-contract
          - private-cache
          - first-time-tester-private-trial
          - private-sample-telemetry
          - stripe-webhook-readiness
          - stripe-checkout-readiness
          - stripe-billing-portal-readiness
          - stripe-paid-soft-launch-runtime
          - stripe-price-audit
      zero_hf_audit:
        description: 'Require Private model requests to stay same-origin /models with no HuggingFace traffic'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live-custom-words:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'custom-words' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run Live Custom Words Persistence
        env:
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          BASIC_TEST_EMAIL: ${{ secrets.BASIC_TEST_EMAIL }}
          BASIC_TEST_PASSWORD: ${{ secrets.BASIC_TEST_PASSWORD }}
          BASE_URL: https://speaksharp-public.vercel.app/
        run: pnpm exec playwright test tests/live/user-filler-words-persistence.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list

      - name: Upload Custom Words Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-custom-words-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-native-preflight:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'native-preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run Native Live Preflight Probe
        env:
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          BASE_URL: https://speaksharp-public.vercel.app/
        run: pnpm exec playwright test tests/live/analytics-live-native-probe.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list

      - name: Upload Native Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-native-preflight-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-cloud-token-gates:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'cloud-token-gates' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run Cloud Token Gate Proof
        env:
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE_URL: https://speaksharp-public.vercel.app/
        run: pnpm exec playwright test tests/live/cloud-token-gates.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list

      - name: Upload Cloud Token Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-cloud-token-gates-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-cloud-artifact:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'cloud-artifact' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: live-cloud-assemblyai-streaming
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run Cloud Live Artifact Proof
        env:
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          BASE_URL: https://speaksharp-public.vercel.app/
        # Cloud streaming is provider-limited. Keep one smoke, one worker, no immediate retries.
        # After AssemblyAI 1008/3009 "Too many concurrent sessions", wait 5-10 minutes before rerun.
        run: pnpm exec playwright test tests/live/cloud-artifact.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list --workers=1

      - name: Upload Cloud Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-cloud-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-stt-switching-contract:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'stt-switching-contract' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: live-stt-switching-contract
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run Live STT Switching Contract
        env:
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          BASE_URL: https://speaksharp-public.vercel.app/
        run: pnpm exec playwright test tests/live/stt-switching-contract.live.spec.ts --config=playwright.deployed-live.config.ts --project=deployed-live-chromium --reporter=list --workers=1

      - name: Upload STT Switching Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-stt-switching-contract-artifacts
          path: |
            blob-report/deployed-live/
            playwright-report/deployed-live/
            test-results/deployed-live/
          retention-days: 14

  live-attribution-proof:
    # #1033/#1055 live production attribution proof — the DEPLOYED app must persist
    # attribution_status=verified with a coherent engine tuple for a real Pro recording.
    # ISOLATION-ONLY (not part of `all`): it records on PRO_TEST via AssemblyAI, which requires one
    # concurrent Cloud session and is subject to the product's account-wide recording mutex — running it
    # alongside the other PRO/Cloud jobs in `all` would flake on provider/mutex concurrency.
    if: ${{ github.event.inputs.suite == 'attribution-proof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: live-attribution-proof
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run Live Attribution Proof
        env:
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          BASE_URL: https://speaksharp-public.vercel.app/
        run: pnpm exec playwright test tests/live/session-attribution-proof.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list --workers=1

      - name: Upload Attribution Proof Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-attribution-proof-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-pro-orphan-check:
    if: ${{ github.event.inputs.suite == 'orphan-check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'
      - name: Run Pro Orphan Read-only Audit
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          BASE_URL: https://speaksharp-public.vercel.app/
        run: pnpm exec playwright test tests/live/pro-orphan-audit.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list --workers=1

  live-free-sample-orphan-audit:
    # #964 — prove zero stt-switching-free-sample-* disposable Free fixtures remain after cleanup.
    # ISOLATION-ONLY (not part of `all`): it must run AFTER the stt-switching #964 diagnostic has created
    # AND cleaned up its own stt-switching-free-sample-* fixture. Inside `all` the two jobs race, so the
    # audit could false-fail (fixture still active) or false-pass (before a later failed cleanup leaks one).
    if: ${{ github.event.inputs.suite == 'orphan-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run Free-sample Orphan Audit
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE_URL: https://speaksharp-public.vercel.app/
        run: pnpm exec playwright test tests/live/free-sample-orphan-audit.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list --workers=1

  live-private-cache:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'private-cache' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run Private Cache First/Second Start Proof
        env:
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          BASE_URL: https://speaksharp-public.vercel.app/
          ZERO_HF_AUDIT_REQUIRED: ${{ github.event.inputs.zero_hf_audit || 'false' }}
        run: pnpm exec playwright test tests/live/private-cache.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list --workers=1

      - name: Upload Private Cache Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-private-cache-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-first-time-tester-private-trial:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'first-time-tester-private-trial' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run First-Time Tester Private Trial Proof
        env:
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          BASE_URL: https://speaksharp-public.vercel.app/
          # Required so the spec's afterEach can delete the fresh first-time account it mints
          # (otherwise it accumulates as first-time-tester-* residue).
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec playwright test tests/live/first-time-tester-private-trial.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list --workers=1

      - name: Upload First-Time Tester Private Trial Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-first-time-tester-private-trial-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/

  live-private-sample-telemetry:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'private-sample-telemetry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run Private-Sample Telemetry Live Wiring Proof
        env:
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          BASE_URL: https://speaksharp-public.vercel.app/
          # Required: the spec mints a fresh free account (unused Private sample), reads the saved
          # session's engine_version, and deletes the account in afterEach (so it never accumulates).
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec playwright test tests/live/private-sample-telemetry.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list --workers=1

      - name: Upload Private-Sample Telemetry Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-private-sample-telemetry-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-stripe-webhook-readiness:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'stripe-webhook-readiness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Stripe Webhook Readiness Proof
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          # LIVE proof: the spec signs with the LIVE endpoint whsec and reads STRIPE_LIVE_WEBHOOK_SECRET
          # (fail-fast if absent). The generic test STRIPE_WEBHOOK_SECRET it previously passed was dead
          # (this spec never reads it). Deviates from the matrix's test-mode default by design.
          STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}
        run: pnpm exec playwright test tests/live/stripe-webhook-readiness.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list

      - name: Upload Stripe Webhook Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-stripe-webhook-readiness-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-stripe-checkout-readiness:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'stripe-checkout-readiness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Stripe Checkout Readiness Proof
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
        run: pnpm exec playwright test tests/live/stripe-checkout-readiness.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list

      - name: Upload Stripe Checkout Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-stripe-checkout-readiness-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-stripe-billing-portal-readiness:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'stripe-billing-portal-readiness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run Stripe Billing Portal Readiness Proof
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # TEST proof (PRO_TEST is a test-mode customer) → explicit test-scoped key.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
        run: pnpm exec playwright test tests/live/stripe-billing-portal-readiness.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list

      - name: Upload Stripe Billing Portal Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-stripe-billing-portal-readiness-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-stripe-paid-soft-launch-runtime:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'stripe-paid-soft-launch-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          install-playwright: 'true'

      - name: Run Stripe Test-Mode Paid Soft Launch Runtime Proof
        env:
          BASE_URL: https://speaksharp-public.vercel.app/
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # TEST proof: COMPLETE_HOSTED_CHECKOUT is honored by the spec only in test mode.
          # Explicit test-scoped key + webhook + pro price.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_TEST_PRO_PRICE_ID }}
          STRIPE_COMPLETE_HOSTED_CHECKOUT: 'true'
        run: pnpm exec playwright test tests/live/stripe-paid-soft-launch-runtime.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list

      - name: Upload Stripe Paid Soft Launch Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-stripe-paid-soft-launch-runtime-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

  live-stripe-price-audit:
    if: ${{ github.event.inputs.suite == 'all' || github.event.inputs.suite == 'stripe-price-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Audit Stripe Price Configuration
        env:
          # TEST price audit: Pro is required (active product). Basic is future-reserved — pass the
          # test-scoped basic price ONLY if provisioned; when absent the audit skips Basic (reserved),
          # not a failure. No generic fallback — generic basic is not a launch gate.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_BASIC_PRICE_ID: ${{ secrets.STRIPE_TEST_BASIC_PRICE_ID }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_TEST_PRO_PRICE_ID }}
          EXPECTED_STRIPE_BASIC_AMOUNT: '499'
          EXPECTED_STRIPE_PRO_AMOUNT: '999'
          EXPECTED_STRIPE_BASIC_CURRENCY: usd
          EXPECTED_STRIPE_PRO_CURRENCY: usd
          EXPECTED_STRIPE_BASIC_INTERVAL: month
          EXPECTED_STRIPE_PRO_INTERVAL: month
        run: node scripts/stripe-price-audit.mjs
