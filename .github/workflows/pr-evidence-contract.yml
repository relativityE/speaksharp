name: PR Evidence Contract

# Trusted two-clock bot (#1316 v2). Enforcement resolves the validator/risk-map/schema
# from the TRUSTED base branch, never the PR head. The bot owns GitHub facts (code clock =
# head SHA; intent clock = Acceptance-criteria hash) and writes them into an idempotent
# managed block; the author owns prose only. A read-only token keeps PR-head content safe
# as data; the write scope is used solely to upsert the bot-managed block.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read

concurrency:
  group: pr-evidence-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  validate:
    name: Exact artifact and issue contract
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout PR head content (untrusted DATA only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Resolve the trusted base validator
        run: |
          set -euo pipefail
          mkdir -p .trusted
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          if git cat-file -e "${BASE_SHA}:scripts/pr-evidence-contract.mjs" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/pr-evidence-contract.mjs" > .trusted/pr-evidence-contract.mjs
            echo "::notice title=Trusted validator::Enforcing with the base validator from ${BASE_SHA}."
          else
            cp scripts/pr-evidence-contract.mjs .trusted/pr-evidence-contract.mjs
            echo "::warning title=Bootstrap validator::Base ${BASE_SHA} has no validator; using the PR-head candidate for this bootstrap PR only."
          fi
          echo "TRUSTED_VALIDATOR=$PWD/.trusted/pr-evidence-contract.mjs" >> "$GITHUB_ENV"

      - name: Prove the trusted validator rejects broken evidence (self-test)
        run: node "$TRUSTED_VALIDATOR" --self-test

      - name: Prove enforcement uses the trusted validator, not the PR head
        run: |
          set -euo pipefail
          printf '{"pull_request":{"body":"garbage","draft":false,"head":{"sha":"%s"},"base":{"sha":"%s"},"created_at":"2026-01-01T00:00:00Z"}}' \
            "$HEAD_SHA" "$BASE_SHA" > .bad-event.json
          printf 'export function validatePr(){return[]}\nif(import.meta.url==="file://"+process.argv[1]){process.exit(0)}\n' > .evil.mjs
          if GITHUB_EVENT_PATH=.bad-event.json node .evil.mjs; then
            echo "A PR-head 'always-pass' validator would FALSELY green an invalid body."
          fi
          if GITHUB_EVENT_PATH=.bad-event.json node "$TRUSTED_VALIDATOR"; then
            echo "::error::FALSE GREEN — the trusted validator passed an invalid body."; exit 1
          fi
          echo "PASS: the trusted validator rejects an invalid body regardless of the PR-head validator."

      - name: Gather GitHub-authoritative facts
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' | sort > changed_files.txt
          echo "Changed files:"; cat changed_files.txt

          # Primary governing issue = first referenced non-PR issue that predates the PR.
          node "$TRUSTED_VALIDATOR" --extract-issue-refs > refs.txt || true
          echo "null" > governing_issue.json
          PR_CREATED="${{ github.event.pull_request.created_at }}"
          while IFS= read -r n; do
            [ -z "$n" ] && continue
            issue=$(gh api "repos/${REPO}/issues/${n}" 2>/dev/null) || continue
            is_pr=$(printf '%s' "$issue" | jq 'has("pull_request")')
            created=$(printf '%s' "$issue" | jq -r '.created_at')
            if [ "$is_pr" = "false" ] && [ "$created" \< "$PR_CREATED" -o "$created" = "$PR_CREATED" ]; then
              printf '%s' "$issue" | jq '{number, body: (.body // ""), created_at}' > governing_issue.json
              break
            fi
          done < refs.txt
          echo "Governing issue:"; jq '{number, created_at}' governing_issue.json || true

          # Code clock's final-CI fact: the ci.yml run at this exact head.
          CI_JSON=$(gh run list --repo "$REPO" --commit "$HEAD_SHA" --workflow ci.yml --limit 1 --json status,conclusion,url 2>/dev/null || echo '[]')
          CI_STATUS=$(printf '%s' "$CI_JSON" | jq -r '.[0].status // "none"')
          CI_CONCL=$(printf '%s' "$CI_JSON" | jq -r '.[0].conclusion // "none"')
          CI_LINK=$(printf '%s' "$CI_JSON" | jq -r '.[0].url // ""')
          if [ "$CI_STATUS" = "completed" ]; then FINAL_CI="$CI_CONCL"; else FINAL_CI="pending"; fi
          echo "PR_FINAL_CI=$FINAL_CI" >> "$GITHUB_ENV"
          echo "PR_FINAL_CI_LINK=$CI_LINK" >> "$GITHUB_ENV"
          echo "Final CI: status=$CI_STATUS conclusion=$CI_CONCL -> $FINAL_CI"

      - name: Upsert the bot-managed facts block
        env:
          PR_CHANGED_FILES_FILE: changed_files.txt
          PR_GOVERNING_ISSUE_FILE: governing_issue.json
        run: |
          set -euo pipefail
          node "$TRUSTED_VALIDATOR" --emit-block > managed_block.txt
          echo "Managed block:"; cat managed_block.txt; echo
          gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body' > current_body.md || : > current_body.md
          node --input-type=module -e '
            import fs from "node:fs";
            const { upsertManagedBlock } = await import(process.env.TRUSTED_VALIDATOR);
            const body = fs.readFileSync("current_body.md","utf8");
            const block = fs.readFileSync("managed_block.txt","utf8").replace(/\n$/,"");
            fs.writeFileSync("merged_body.md", upsertManagedBlock(body, block));
          '
          if ! diff -q current_body.md merged_body.md >/dev/null 2>&1; then
            echo "Body changed; writing bot-managed block."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --body-file merged_body.md
          else
            echo "Bot-managed block already current; no write (idempotent)."
          fi

      - name: Enforce the PR evidence contract
        env:
          PR_CHANGED_FILES_FILE: changed_files.txt
          PR_GOVERNING_ISSUE_FILE: governing_issue.json
          PR_BODY_FILE: merged_body.md
        run: node "$TRUSTED_VALIDATOR"
