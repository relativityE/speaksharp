# #1306 — prove the read-authority preflight against the LIVE Management API, on its own.
#
# WHY THIS EXISTS SEPARATELY. The replica-inventory response schema is not something we should first
# encounter during a production-writing proof. This runs the preflight and nothing else: no browser, no
# database writes, no account creation. If the API contract differs from what the classifier expects,
# it surfaces here for free instead of turning attempt 9 into another inconclusive run.
#
# Output is the two derived tokens only — never the management token, project reference, URL or body.
name: '#1306 read-authority preflight (read-only)'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # The management token is scoped to THIS STEP ONLY, exactly as in the production proof.
      - name: Resolve read authority (read-only)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node --experimental-strip-types scripts/verify-read-authority.mjs

      - name: Report the derived verdict
        run: |
          echo "authority=${PROOF_READ_AUTHORITY:-<unset>}"
          echo "reason=${PROOF_READ_AUTHORITY_REASON:-<unset>}"
