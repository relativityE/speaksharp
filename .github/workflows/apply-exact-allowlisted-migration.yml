name: Apply one allowlisted migration (exact)

# One target per dispatch. Checked-in ordering, hashes, and classification keep every unselected pending
# migration apply-invisible. Source merge never authorizes a dispatch or production mutation.
on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'One checked-in migration target'
        required: true
        type: choice
        options:
          - '20260811143000'
          - '20260812030000'
          - '20260812039500'
          - '20260812040000'
          - '20260812041000'
          - '20260812042000'
      expected_head_sha:
        description: 'Exact 40-character main SHA authorized by the Product Owner'
        required: true
        type: string
      confirm:
        description: 'Exact allowlist-derived phrase, including filename, SHA-256, and main SHA'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  apply-one-allowlisted-migration:
    environment: production-db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
      SELECTED_TARGET_VERSION: ${{ inputs.target_version }}
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Validate exact main identity and authorization phrase
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONFIRM: ${{ inputs.confirm }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RESOLVED_SHA: ${{ github.sha }}
          RESOLVED_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          [[ "$EXPECTED_HEAD_SHA" =~ $sha_re ]] || { echo '::error::expected_head_sha must be a full lowercase SHA'; exit 1; }
          [ "$RESOLVED_REF" = "$DEFAULT_BRANCH" ] || { echo '::error::workflow must be dispatched from the default branch'; exit 1; }
          [ "$RESOLVED_SHA" = "$EXPECTED_HEAD_SHA" ] || { echo '::error::dispatch resolved a different SHA'; exit 1; }
          expected_phrase="$(node scripts/exact-migration-gate.mjs phrase "$EXPECTED_HEAD_SHA" | jq -r '.phrase')"
          [ "$CONFIRM" = "$expected_phrase" ] || { echo '::error::exact allowlist-derived authorization phrase missing'; exit 1; }
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          [ "$current_main" = "$EXPECTED_HEAD_SHA" ] || { echo '::error::default branch advanced before execution'; exit 1; }

          for status in in_progress queued waiting pending requested; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100")"
            others="$(jq --argjson current "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $current) | select(.name == "Deploy Supabase" or .name == "Apply webhook DB prerequisite (exact migration)" or .name == "Apply one allowlisted migration (exact)" or .name == "Migrations Preflight (read-only)")] | length' <<<"$runs")"
            [ "$others" = '0' ] || { echo '::error::another migration-capable or migration-preflight workflow is active or pending'; exit 1; }
          done

      - uses: supabase/setup-cli@v2
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 2.101.0

      - name: Verify checked-in allowlist and source identities
        id: contract
        working-directory: backend/supabase
        run: |
          set -euo pipefail
          contract="$(node ../../scripts/exact-migration-gate.mjs source .)"
          echo "$contract"
          echo "target_version=$(jq -r '.targetVersion' <<<"$contract")" >> "$GITHUB_OUTPUT"
          echo "target_file=$(jq -r '.targetFile' <<<"$contract")" >> "$GITHUB_OUTPUT"
          echo "target_sha256=$(jq -r '.targetSha256' <<<"$contract")" >> "$GITHUB_OUTPUT"
          echo "classification=$(jq -r '.classification' <<<"$contract")" >> "$GITHUB_OUTPUT"
          echo "requires_include_all=$(jq -r '.requiresIncludeAll' <<<"$contract")" >> "$GITHUB_OUTPUT"
          echo "excluded_versions=$(jq -r '.excludedVersions | join(" ")' <<<"$contract")" >> "$GITHUB_OUTPUT"

      - name: Establish exact pre-apply state
        working-directory: backend/supabase
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration list 2>&1 | tee "$RUNNER_TEMP/migrations-before.txt"
          node ../../scripts/exact-migration-gate.mjs before "$RUNNER_TEMP/migrations-before.txt"

      - name: Establish read-only production lint baseline
        working-directory: backend/supabase
        run: |
          set -euo pipefail
          supabase db lint --linked --schema public --level warning 2>&1 | tee "$RUNNER_TEMP/lint-before.txt"

      - name: Build isolated target-only migration workspace
        run: |
          set -euo pipefail
          node scripts/exact-migration-gate.mjs prepare-workspace backend/supabase "$RUNNER_TEMP"

      - name: Prove dry-run is target-only
        working-directory: ${{ runner.temp }}/exact-backend
        run: |
          set -euo pipefail
          push_args=()
          if [ '${{ steps.contract.outputs.requires_include_all }}' = 'true' ]; then
            push_args+=(--include-all)
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --dry-run "${push_args[@]}" 2>&1 | tee "$RUNNER_TEMP/exact-dry-run.txt"
          node "$GITHUB_WORKSPACE/scripts/exact-migration-gate.mjs" dry-run "$RUNNER_TEMP/exact-dry-run.txt"

      - name: Revalidate main immediately before apply
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          [ "$current_main" = "$EXPECTED_HEAD_SHA" ] || { echo '::error::default branch advanced after dry-run'; exit 1; }

      - name: Apply the exact reviewed migration
        id: apply
        continue-on-error: true
        working-directory: ${{ runner.temp }}/exact-backend
        run: |
          set -euo pipefail
          push_args=()
          if [ '${{ steps.contract.outputs.requires_include_all }}' = 'true' ]; then
            push_args+=(--include-all)
          fi
          supabase db push --yes "${push_args[@]}"

      - name: Verify target applied and every unselected pending migration remained pending
        id: verify
        if: ${{ always() && steps.apply.outcome != 'skipped' }}
        working-directory: backend/supabase
        run: |
          set -euo pipefail
          supabase migration list 2>&1 | tee "$RUNNER_TEMP/migrations-after.txt"
          node ../../scripts/exact-migration-gate.mjs after "$RUNNER_TEMP/migrations-before.txt" "$RUNNER_TEMP/migrations-after.txt"

      - name: Verify migration introduced no production lint change
        id: lint_verify
        if: ${{ always() && steps.apply.outcome != 'skipped' }}
        working-directory: backend/supabase
        run: |
          set -euo pipefail
          supabase db lint --linked --schema public --level warning 2>&1 | tee "$RUNNER_TEMP/lint-after.txt"
          node ../../scripts/exact-migration-gate.mjs lint-delta "$RUNNER_TEMP/lint-before.txt" "$RUNNER_TEMP/lint-after.txt"

      - name: Require unambiguous exact-operation success
        id: terminal
        if: always()
        run: node scripts/exact-migration-gate.mjs final "${{ steps.apply.outcome }}" "${{ steps.verify.outcome }}" "${{ steps.lint_verify.outcome }}"

      - name: Publish sanitized result
        if: always()
        run: |
          echo '## Exact allowlisted migration gate' >> "$GITHUB_STEP_SUMMARY"
          echo "- Checked-out SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authorized target: \`${{ steps.contract.outputs.target_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Filename: \`${{ steps.contract.outputs.target_file }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`${{ steps.contract.outputs.target_sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification: \`${{ steps.contract.outputs.classification }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Isolated out-of-order flag required: \`${{ steps.contract.outputs.requires_include_all }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Excluded pending migrations: \`${{ steps.contract.outputs.excluded_versions }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apply step outcome: \`${{ steps.apply.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Post-apply verification outcome: \`${{ steps.verify.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Baseline-relative lint outcome: \`${{ steps.lint_verify.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terminal exact-operation gate: \`${{ steps.terminal.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- The selected migration is the only authorized mutation. `--include-all` is permitted only for the isolated #1276 target and must be disclosed by its exact authorization phrase. No repair, broad-directory application, Edge deployment, payment configuration, or secrets/config change is performed.' >> "$GITHUB_STEP_SUMMARY"
