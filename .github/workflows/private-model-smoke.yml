name: Private v4 model-pipeline smoke (automated)

# B2 — Automated Private v4 model-pipeline smoke (a dependency + deterministic-inference REGRESSION
# GUARD for the DORMANT Private v4 stack — @huggingface/transformers — NOT a release proof and NOT
# coverage of production Private v2, which uses @xenova/transformers). Fetches the pinned v4 base_q4
# model, initializes it, exercises the cache, and runs deterministic inference on a fixed audio
# fixture, asserting a non-empty transcript with expected-token overlap. Emits a JSON artifact.
#
# THIS DOES NOT PROVE: browser UX, microphone capture, WebGPU, setup/consent UI, or no-audio-egress.
# Those require the manual real-device WebGPU proof (Option A); the browser WASM path is B1.
#
# Non-blocking: workflow_dispatch + weekly schedule only — never a PR-required check (model download
# is slow/network-bound by design).

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Model id to smoke (default: production v4 base_q4 floor)'
        required: false
        default: 'onnx-community/whisper-base.en'
      overlap_threshold:
        description: 'Minimum expected-token overlap to PASS (0..1)'
        required: false
        default: '0.6'
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC — catch model/CDN/package regressions weekly

permissions:
  contents: read

jobs:
  private-v4-model-smoke:
    name: Private v4 model-pipeline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Fast fail-early gate (Node 22): import the real @huggingface/transformers (v4) ESM bundle and
      # assert it loads before the expensive model download. Catches an onnxruntime-common resolution
      # regression (undeclared import hoisting to 1.14.0 CJS) in seconds instead of minutes.
      - name: Node 22 import preflight (v4 ESM boundary)
        run: node scripts/private-v4-import-preflight.mjs

      - name: Run Private v4 model-pipeline smoke
        env:
          MODEL_ID: ${{ github.event.inputs.model_id || 'onnx-community/whisper-base.en' }}
          OVERLAP_THRESHOLD: ${{ github.event.inputs.overlap_threshold || '0.6' }}
        run: node scripts/private-model-smoke.mjs

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-v4-model-smoke
          path: private-model-smoke.json
          retention-days: 1
          if-no-files-found: warn
