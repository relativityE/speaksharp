name: Issue Report Triage

# Triage digest of user-submitted issue reports so they are actually reviewed
# (closes the Report-Issue ops gap: insert works, but nobody watched the table).
#
# Read-only: queries production `user_issue_reports` via PostgREST with the service-role
# secret (RLS-bypass SELECT). Writes a digest to BOTH the run's job summary and stdout
# (the CI log) so release evidence can be read from the run log. The table stores no email;
# only the reporter's own typed fields + a truncated user_id hint are shown, and metadata
# values that look secret-ish are redacted; transcript/audio content is never printed
# (only whether it is present and its length).

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'How many hours of reports to include (default 24)'
        required: false
        default: '24'

permissions:
  contents: read

jobs:
  issue-triage:
    name: Daily issue-report triage digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build issue-report triage digest
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/triage.mjs" <<'NODE'
          const url = (process.env.SUPABASE_URL || '').replace(/\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY || '';
          const hours = Math.max(1, Number(process.env.LOOKBACK_HOURS || '24') || 24);
          if (!url || !key) { console.error('Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY'); process.exit(2); }

          const sinceIso = new Date(Date.now() - hours * 3600 * 1000).toISOString();
          const cols = 'id,created_at,severity,category,title,description,page_url,user_id,session_id,' +
            'metadata,include_transcript,transcript_excerpt,include_audio,audio_attachment_note';
          const endpoint = `${url}/rest/v1/user_issue_reports?created_at=gte.${encodeURIComponent(sinceIso)}` +
            `&select=${cols}&order=created_at.desc&limit=5`;

          const res = await fetch(endpoint, {
            headers: { apikey: key, Authorization: `Bearer ${key}`, Accept: 'application/json' },
          });
          if (!res.ok) { console.error(`PostgREST query failed: HTTP ${res.status}`); process.exit(1); }
          const rows = await res.json();

          const cell = (s, n) => {
            const t = String(s ?? '').replace(/[|\n\r]+/g, ' ').replace(/\s+/g, ' ').trim();
            return t.length > n ? t.slice(0, n) + '…' : t;
          };
          // Category display/normalization. Post-migration the table holds only new slugs, so this
          // mainly renders the friendly label for readable triage output. The legacy fallback is
          // defensive: if a stale-tab submission slipped an old value in, flag it and normalize.
          const CATEGORY_LABEL = {
            recording_transcription: 'Recording / transcription',
            analytics_sessions: 'Analytics / saved sessions',
            billing_subscription: 'Billing / subscription',
            account_signin: 'Account / sign-in',
            privacy_data: 'Privacy / data',
            speed_performance: 'Speed / performance',
            something_else: 'Something else',
          };
          const LEGACY_TO_SLUG = {
            stt: 'recording_transcription', analytics: 'analytics_sessions', billing: 'billing_subscription',
            account: 'account_signin', privacy: 'privacy_data', performance: 'speed_performance', general: 'something_else',
          };
          const normCategory = (raw) => {
            const v = String(raw ?? '').trim();
            const isLegacy = Object.prototype.hasOwnProperty.call(LEGACY_TO_SLUG, v);
            const slug = isLegacy ? LEGACY_TO_SLUG[v] : v;
            return { raw: v, slug, label: CATEGORY_LABEL[slug] || slug || '—', isLegacy };
          };
          // Never surface secret-ish metadata values (defence in depth; metadata should hold none).
          const SECRET = /token|secret|key|cookie|auth|password|bearer/i;
          // Redact secret-looking substrings inside free-text fields. title/description are the
          // reporter's own support message and MUST be readable by triage, but a user could paste
          // a token/key into them — scrub known secret shapes before printing (defence in depth).
          const redactText = (s) => String(s ?? '')
            .replace(/eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{4,}/g, '[REDACTED_JWT]')
            .replace(/\b(?:sk|pk|rk|whsec)_[A-Za-z0-9]{12,}/g, '[REDACTED_KEY]')
            .replace(/\bBearer\s+[A-Za-z0-9._-]{8,}/gi, 'Bearer [REDACTED]')
            .replace(/\b[A-Fa-f0-9]{40,}\b/g, '[REDACTED_HEX]')
            .replace(/\b(token|secret|password|api[_-]?key|authorization|cookie)\b\s*[:=]\s*\S+/gi, '$1=[REDACTED]');
          const mfield = (meta, k) => {
            if (!meta || typeof meta !== 'object' || !(k in meta) || meta[k] == null) return 'MISSING';
            if (SECRET.test(k)) return 'present (redacted)';
            const v = meta[k];
            return 'present: ' + cell(typeof v === 'object' ? JSON.stringify(v) : String(v), 48);
          };

          const out = [`## 🐞 Issue Report Triage — last ${hours}h`, ''];
          if (!Array.isArray(rows) || rows.length === 0) {
            out.push('_No new issue reports in this window._');
            console.log(out.join('\n'));
            process.exit(0);
          }
          out.push(`**${rows.length}** report(s) in window. Reviewer: **release-owner** (default).`);
          out.push('');
          out.push('| When (UTC) | Sev | Category | Title | Page |');
          out.push('|---|---|---|---|---|');
          for (const r of rows) {
            const c = normCategory(r.category);
            const catCell = c.isLegacy ? `${c.label} (legacy: ${c.raw})` : c.label;
            out.push(`| ${cell(r.created_at, 19)} | ${cell(r.severity, 10)} | ${cell(catCell, 34)} | ${cell(r.title, 40)} | ${cell(r.page_url, 36)} |`);
          }
          out.push('');
          // Per-report field verification (Beta-50 Report Issue gate evidence) — proves each
          // field is present without printing private transcript/audio content.
          out.push('### Field verification (latest reports)');
          for (const r of rows) {
            const m = r.metadata || {};
            out.push('');
            out.push(`- **id:** \`${cell(r.id, 36)}\` · **created_at:** ${cell(r.created_at, 19)}`);
            const c = normCategory(r.category);
            out.push(`  - category: \`${cell(r.category, 30)}\` → ${c.label}${c.isLegacy ? ` _(legacy value — normalizes to ${c.slug})_` : ''} · severity: \`${cell(r.severity, 12)}\``);
            out.push(`  - title: ${r.title ? redactText(cell(r.title, 120)) : 'MISSING'}`);
            out.push(`  - description: ${r.description ? redactText(cell(r.description, 600)) + ` _(${String(r.description).length} chars)_` : 'MISSING'}`);
            out.push(`  - page_url: ${r.page_url ? 'present (' + cell(r.page_url, 50) + ')' : 'MISSING'}`);
            out.push(`  - user_id: ${r.user_id ? cell(r.user_id, 8) + '…' : 'MISSING'} · session_id: ${r.session_id ? cell(r.session_id, 12) + '…' : 'null'}`);
            out.push(`  - metadata.route: ${mfield(m, 'route')}`);
            out.push(`  - metadata.userAgent: ${mfield(m, 'userAgent')}`);
            out.push(`  - metadata.viewport: ${mfield(m, 'viewport')}`);
            out.push(`  - metadata.timezone: ${mfield(m, 'timezone')}`);
            out.push(`  - metadata.plan: ${mfield(m, 'plan')}`);
            out.push(`  - metadata.sttMode: ${mfield(m, 'sttMode')}`);
            out.push(`  - metadata.runtimeState: ${mfield(m, 'runtimeState')}`);
            out.push(`  - include_transcript: \`${r.include_transcript}\``);
            out.push(`  - transcript_excerpt: ${r.transcript_excerpt == null ? 'null' : 'present (' + String(r.transcript_excerpt).length + ' chars, content redacted)'}`);
            out.push(`  - include_audio: \`${r.include_audio}\``);
            out.push(`  - audio_attachment_note: ${r.audio_attachment_note == null ? 'null' : 'present (' + cell(r.audio_attachment_note, 40) + ')'}`);
          }
          console.log(out.join('\n'));
          NODE
          node "$RUNNER_TEMP/triage.mjs" | tee -a "$GITHUB_STEP_SUMMARY"
