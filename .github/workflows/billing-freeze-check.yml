name: Billing Freeze Safety Check (read-only)

# READ-ONLY audit of live Stripe state for internal QA / test accounts (Beta-50 billing freeze).
# Manual dispatch only. scripts/billing-freeze-check.mjs issues Stripe GET requests ONLY — it can never
# create a charge/subscription/invoice/checkout session. Fails the job if any active subscription, open
# invoice, or open checkout session exists for the audited accounts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-freeze-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Billing freeze check (read-only live Stripe)
        env:
          # LIVE key — the deployed app runs live keys; read-only use here (GET only).
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
          # Non-destructive deployed-checkout probe (P0.1): the guard runs before auth/Stripe, so an
          # anonymous POST proves checkout is closed. Anon key only — never a user token.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Preferred: an explicit audit list (repo/org variable). Falls back to the test-email secrets.
          BILLING_FREEZE_EMAILS: ${{ vars.BILLING_FREEZE_EMAILS }}
          PRO_TEST_EMAIL: ${{ secrets.PRO_TEST_EMAIL }}
          CHECKOUT_TEST_EMAIL: ${{ secrets.CHECKOUT_TEST_EMAIL }}
          BASIC_TEST_EMAIL: ${{ secrets.BASIC_TEST_EMAIL }}
          # Sanitized (masked-email) JSON report path + a rendered run-page step summary,
          # so the full audit is auditable without grepping truncated step logs.
          BILLING_FREEZE_REPORT_PATH: billing-freeze-report.json
        run: node scripts/billing-freeze-check.mjs

      - name: Scan sanitized billing-freeze report
        id: review_evidence_scan
        if: always()
        run: node scripts/check-review-evidence-policy.mjs --scan-upload 'billing-freeze-check.yml::billing-freeze-report'

      - name: Upload sanitized billing-freeze report
        if: ${{ always() && steps.review_evidence_scan.outcome == 'success' }} # upload on PASS or FAIL only when sanitized
        uses: actions/upload-artifact@v4
        with:
          name: billing-freeze-report
          path: billing-freeze-report.json
          retention-days: 1
          if-no-files-found: warn
