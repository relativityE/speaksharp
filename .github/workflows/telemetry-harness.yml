name: telemetry-outbox-harness

# Behavioral proof for the P0 incident telemetry-outbox foundation. The FULL A–H suite runs against
# BOTH a real postgres:16 service (authoritative, multi-connection) AND PGlite (fast hermetic
# secondary). The SKIP LOCKED concurrency race also runs on postgres:16. Content-free: synthetic
# fixtures only. Dependencies are COMMITTED + PINNED (tests/db/package.json + package-lock.json) and
# installed with a FROZEN `npm ci` so versions are reviewed and SCA-visible — never a dynamic
# @latest install.

on:
  pull_request:
    paths:
      - 'backend/supabase/migrations/20260720*.sql'
      - 'backend/supabase/functions/telemetry-worker/**'
      - 'backend/supabase/functions/report-issue-alert/**'
      - 'backend/supabase/functions/_shared/**'
      - 'tests/db/**'
      - 'tests/deps/telemetry-outbox.test.js'
      - 'tests/deps/report-alert-rls.test.js'
      - '.github/workflows/telemetry-harness.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  behavioral-pglite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install harness deps (frozen)
        working-directory: tests/db
        run: npm ci
      - name: Behavioral suite (A–H) on PGlite
        working-directory: tests/db
        run: node run-behavioral.mjs

  behavioral-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install harness deps (frozen)
        working-directory: tests/db
        run: npm ci
      # Race first, on a CLEAN database — it counts global pending rows, so it must run before the
      # behavioral suite leaves state behind.
      - name: SKIP LOCKED concurrency race (2 real connections)
        working-directory: tests/db
        run: node skiplocked-race.mjs
      - name: Behavioral suite (A–H) on postgres:16
        working-directory: tests/db
        run: node run-behavioral.mjs
