name: Controlled Private STT Benchmarks

# Manual and release-driven only. This workflow measures the two internal Private implementations;
# it does not activate v4 and it makes no paid provider call.
on:
  workflow_dispatch:
    inputs:
      write_results:
        description: 'Write results to tests/STT_BENCHMARKS.json and open a PR'
        type: boolean
        default: true
      run_private_browser:
        description: 'Run comparable Private v2/v4 browser benchmarks'
        type: boolean
        default: true
      run_private_exact_buffer:
        description: 'Run one Private app-buffer capture for replay diagnostics'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark-private-browser:
    name: Private Browser Benchmarks (v2 + v4)
    if: inputs.run_private_browser != false || inputs.run_private_exact_buffer == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps

      - name: Generate audio fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          bash scripts/generate-fixtures.sh

      - name: Run Private exact app-buffer capture proof
        if: inputs.run_private_exact_buffer == true
        env:
          BASE_URL: http://127.0.0.1:5173
          LIVE_VITE_MODE: test
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          VITE_AUTH_MODE: real
          VITE_USE_MOCK_AUTH: 'false'
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PRO_TEST_EMAIL: ${{ vars.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          STT_MODES: private
          STT_FIXTURES: h1_6
          STT_INJECT_MIC_AUDIO: 'true'
          STT_PRIVATE_ENGINE: transformers-js
          STT_INCLUDE_AUDIO_DATA_URL: 'true'
          STT_DISABLE_WEBGPU: 'true'
          STT_POST_PLAYBACK_WAIT_MS: '5000'
          STT_CORPUS_OUT: /tmp/speaksharp-private-h1_6-exact-buffer-current.json
          HEADLESS: 'true'
        run: |
          cd frontend
          pnpm vite --port 5173 --mode test --logLevel error &
          server_pid=$!
          cd ..
          for i in {1..60}; do
            if curl -fsS "$BASE_URL" >/dev/null; then break; fi
            sleep 1
          done
          pnpm exec tsx scripts/manual-stt-corpus-proof.mjs
          kill "$server_pid" || true

      - name: Run Private browser benchmark suite
        if: inputs.run_private_browser != false
        env:
          LIVE_VITE_MODE: test
          VITE_USE_LIVE_DB: 'true'
          VITE_SKIP_MSW: 'true'
          VITE_AUTH_MODE: real
          VITE_USE_MOCK_AUTH: 'false'
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PRO_TEST_EMAIL: ${{ vars.PRO_TEST_EMAIL }}
          PRO_TEST_PASSWORD: ${{ secrets.PRO_TEST_PASSWORD }}
          STT_INCLUDE_AUDIO_DATA_URL: 'true'
        run: pnpm exec playwright test tests/live/benchmark-cpu.live.spec.ts tests/live/benchmark-v4.live.spec.ts --config=playwright.live.config.ts --project=live-stt-chromium --reporter=list
        timeout-minutes: 30

      - name: Upload Private exact app-buffer capture proof
        if: always() && inputs.run_private_exact_buffer == true
        uses: actions/upload-artifact@v6
        with:
          name: private-exact-app-buffer-proof
          path: /tmp/speaksharp-private-h1_6-exact-buffer-current.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Private browser benchmark artifacts
        if: always() && inputs.run_private_browser != false
        uses: actions/upload-artifact@v6
        with:
          name: private-browser-benchmark-artifacts
          path: |
            blob-report/live/
            playwright-report/
            test-results/live/
          retention-days: 14

      - name: Open PR with results
        if: success() && inputs.write_results != false
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update Private STT ceiling benchmarks'
          title: '[benchmark] Private STT ceiling measurement update'
          body: |
            Controlled benchmark run for Private v2 and the inactive v4 candidate.
            This evidence does not activate v4 or change customer entitlement.
          branch: 'chore/benchmark-private'
          add-paths: tests/STT_BENCHMARKS.json
