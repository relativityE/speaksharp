name: Beta Data Inventory (sanitized)

# Authoritative operational inventory of persisted product data (Supabase sessions + issue reports),
# independent of PostHog / client analytics. Emits ONLY sanitized aggregates (counts, hashed account
# ids, opaque row ids, metrics, booleans, transcript char-count/hash) — never prose/email/name and
# never the service-role secret.
#
# HARDENED: workflow_dispatch ONLY (no push trigger — a branch push must never run arbitrary code
# with SUPABASE_SERVICE_ROLE_KEY), gated behind a protected environment requiring owner approval, and
# retention pinned to 1 day for any artifact. FOLLOW-UP (tracked): replace the service-role key with a
# dedicated READ-ONLY database credential / restricted RPC so this tooling never holds write access.

on:
  workflow_dispatch:
    inputs:
      boundary:
        description: 'Inventory boundary (UTC ISO). Default = invitation window.'
        required: false
        default: '2026-07-18T17:43:56Z'

permissions:
  contents: read

concurrency:
  group: beta-data-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-data-inventory:
    name: beta-data-inventory
    runs-on: ubuntu-latest
    # Protected environment → owner approval gate before the service-role secret is exposed.
    environment: production-db
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run sanitized inventory
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          # TODO(read-only): swap for a read-only credential / restricted RPC (no write access).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INVENTORY_BOUNDARY: ${{ github.event.inputs.boundary || '2026-07-18T17:43:56Z' }}
        run: node scripts/beta-data-inventory.mjs
