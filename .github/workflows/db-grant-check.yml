name: DB grant check (read-only)

# READ-ONLY security verification: reports EXECUTE grants on RPCs so we can confirm whether a function
# is publicly executable (account-enumeration / SECURITY DEFINER exposure risk). SELECT-only against the
# catalog via the Supabase Management API SQL endpoint. No writes, no deletes, no row data access.
#
# Two closed modes (no free-form SQL/signature input):
#   - full_scan (#1261): enumerate EVERY SECURITY DEFINER function with four-role EXECUTE state and
#     definition-level search_path, plus the PUBLIC/anon exposure and unsafe-path subsets.
#   - get_user_id_by_email: the original fixed #979 RPC check.
# All queries are fixed catalog SELECTs — no row/user data is read.

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Choose one fixed, read-only catalog audit.'
        required: true
        type: choice
        options:
          - full_scan
          - get_user_id_by_email
        default: full_scan

permissions:
  contents: read

jobs:
  grant-check:
    name: RPC EXECUTE grant check (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query fixed #979 RPC grants (SELECT-only)
        if: ${{ inputs.scan_mode == 'get_user_id_by_email' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID"; exit 2; fi
          FN='public.get_user_id_by_email(text)'
          SQL="SELECT has_function_privilege('public','public.get_user_id_by_email(text)','EXECUTE') AS public_exec, has_function_privilege('anon','public.get_user_id_by_email(text)','EXECUTE') AS anon_exec, has_function_privilege('authenticated','public.get_user_id_by_email(text)','EXECUTE') AS authenticated_exec, has_function_privilege('service_role','public.get_user_id_by_email(text)','EXECUTE') AS service_role_exec;"
          BODY=$(printf '{"query":%s}' "$(printf '%s' "$SQL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          RES=$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$BODY")
          printf '%s' "$RES" | python3 -c 'import json,sys; d=json.load(sys.stdin); keys={"public_exec","anon_exec","authenticated_exec","service_role_exec"}; assert isinstance(d,list) and len(d)==1 and isinstance(d[0],dict) and keys <= d[0].keys(), "invalid grant-check response"; assert all(isinstance(d[0][k],bool) for k in keys), "non-boolean grant result"'
          echo "## DB grant check — \`${FN}\`" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$RES" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Full SECURITY DEFINER exposure scan (SELECT-only, #1261)
        if: ${{ inputs.scan_mode == 'full_scan' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID"; exit 2; fi
          run_sql() {
            local sql="$1" field="$2" kind="$3" body response
            body=$(printf '{"query":%s}' "$(printf '%s' "$sql" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
            response=$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$body")
            printf '%s' "$response" | python3 -c 'import json,sys; field,kind=sys.argv[1:]; d=json.load(sys.stdin); assert isinstance(d,list) and len(d)==1 and isinstance(d[0],dict) and field in d[0], "invalid query response"; value=d[0][field]; assert (kind=="integer" and isinstance(value,int) and not isinstance(value,bool)) or (kind=="array" and isinstance(value,list)), "invalid response field type"' "$field" "$kind"
            printf '%s\n' "$response"
          }
          COUNT="SELECT count(*) AS secdef_total FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.prosecdef AND n.nspname NOT IN ('pg_catalog','information_schema');"
          ALL_FUNCTIONS="SELECT coalesce(json_agg(row_to_json(t) ORDER BY t.schema, t.fn, t.args), '[]'::json) AS functions FROM (SELECT n.nspname AS schema, p.proname AS fn, pg_get_function_identity_arguments(p.oid) AS args, has_function_privilege('public', p.oid, 'EXECUTE') AS public_exec, has_function_privilege('anon', p.oid, 'EXECUTE') AS anon_exec, has_function_privilege('authenticated', p.oid, 'EXECUTE') AS authenticated_exec, has_function_privilege('service_role', p.oid, 'EXECUTE') AS service_role_exec, (SELECT c FROM unnest(coalesce(p.proconfig, ARRAY[]::text[])) c WHERE c LIKE 'search_path=%' LIMIT 1) AS search_path FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.prosecdef AND n.nspname NOT IN ('pg_catalog','information_schema')) t;"
          EXPOSED="SELECT coalesce(json_agg(row_to_json(t) ORDER BY t.schema, t.fn, t.args), '[]'::json) AS exposed FROM (SELECT n.nspname AS schema, p.proname AS fn, pg_get_function_identity_arguments(p.oid) AS args, has_function_privilege('public', p.oid, 'EXECUTE') AS public_exec, has_function_privilege('anon', p.oid, 'EXECUTE') AS anon_exec, has_function_privilege('authenticated', p.oid, 'EXECUTE') AS authenticated_exec, has_function_privilege('service_role', p.oid, 'EXECUTE') AS service_role_exec, (SELECT c FROM unnest(coalesce(p.proconfig, ARRAY[]::text[])) c WHERE c LIKE 'search_path=%' LIMIT 1) AS search_path FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.prosecdef AND n.nspname NOT IN ('pg_catalog','information_schema') AND (has_function_privilege('public', p.oid, 'EXECUTE') OR has_function_privilege('anon', p.oid, 'EXECUTE'))) t;"
          UNSAFE_PATHS="SELECT coalesce(json_agg(row_to_json(t) ORDER BY t.schema, t.fn, t.args), '[]'::json) AS unsafe_search_paths FROM (SELECT n.nspname AS schema, p.proname AS fn, pg_get_function_identity_arguments(p.oid) AS args, (SELECT c FROM unnest(coalesce(p.proconfig, ARRAY[]::text[])) c WHERE c LIKE 'search_path=%' LIMIT 1) AS search_path FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.prosecdef AND n.nspname NOT IN ('pg_catalog','information_schema')) t WHERE t.search_path IS NULL OR regexp_replace(t.search_path, '\\s', '', 'g') !~ '(^|,)pg_temp$';"
          echo "## #1261 — SECURITY DEFINER hosted audit (read-only, catalog SELECTs only)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Total SECURITY DEFINER functions (non-system schemas)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$COUNT" secdef_total integer | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### All SECURITY DEFINER functions — four-role privileges and definition search_path" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$ALL_FUNCTIONS" functions array | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### EXPOSED to PUBLIC or anon (the risk set — empty ⇒ no hosted exposure)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$EXPOSED" exposed array | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### SECURITY DEFINER functions without explicit pg_temp last" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$UNSAFE_PATHS" unsafe_search_paths array | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
