name: DB grant check (read-only)

# READ-ONLY security verification: reports EXECUTE grants on RPCs so we can confirm whether a function
# is publicly executable (account-enumeration / SECURITY DEFINER exposure risk). SELECT-only against the
# catalog via the Supabase Management API SQL endpoint. No writes, no deletes, no row data access.
#
# Two modes:
#   - default: has_function_privilege() for one `function_signature` (PUBLIC/anon/authenticated/service_role).
#   - full_scan=true (#1261): enumerate EVERY SECURITY DEFINER function that PUBLIC or anon can EXECUTE,
#     plus every public SECURITY DEFINER function whose search_path does NOT end in pg_temp (injection surface).
#     Both are pure catalog SELECTs — no row/user data is read.
#
# Safety (#1261 hardening):
#   - `function_signature` is validated against a strict allowlist regex before use (SQL-injection guard);
#     a non-conforming value fails the job rather than reaching the SQL string.
#   - HTTP is fail-closed: curl uses --fail-with-body and the HTTP status is asserted 200; a non-2xx or a
#     response carrying an API error field fails the job (a failed call can never look successful).

on:
  workflow_dispatch:
    inputs:
      function_signature:
        description: 'Function signature to check, e.g. public.get_user_id_by_email(text)'
        required: false
        default: 'public.get_user_id_by_email(text)'
      full_scan:
        description: 'Set to "true" to enumerate all exposed SECURITY DEFINER functions (#1261).'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  grant-check:
    name: RPC EXECUTE grant check (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Run read-only catalog query
        env:
          FULL_SCAN: ${{ github.event.inputs.full_scan }}
          FN_INPUT: ${{ github.event.inputs.function_signature }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID"; exit 2; fi

          # Fail-closed SELECT-only runner: asserts HTTP 200 (--fail-with-body) AND rejects any response
          # carrying an API error field, so a failed call can never be misread as an empty/successful result.
          run_sql() {
            local sql="$1" body resp http
            body=$(printf '{"query":%s}' "$(printf '%s' "$sql" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
            resp=$(curl -sS --fail-with-body -w $'\n%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" \
              -d "$body") || { echo "::error::HTTP request to Management API failed"; echo "$resp"; exit 1; }
            http="${resp##*$'\n'}"; local payload="${resp%$'\n'*}"
            if [ "$http" != "200" ]; then echo "::error::Management API returned HTTP $http"; echo "$payload"; exit 1; fi
            # Fail closed if the JSON is not an array (the SQL endpoint returns rows as a JSON array) or
            # carries an error/message field — never treat an error envelope as an empty result.
            printf '%s' "$payload" | python3 -c 'import json,sys
d=json.load(sys.stdin)
if isinstance(d,dict) and (d.get("error") or d.get("message")):
    sys.stderr.write("API error envelope\n"); sys.exit(1)
if not isinstance(d,list):
    sys.stderr.write("unexpected non-array response\n"); sys.exit(1)
print(json.dumps(d))' || { echo "::error::invalid or error response"; echo "$payload"; exit 1; }
          }

          if [ "${FULL_SCAN:-}" = "true" ]; then
            COUNT="SELECT count(*) AS secdef_total FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.prosecdef AND n.nspname NOT IN ('pg_catalog','information_schema');"
            EXPOSED="SELECT coalesce(json_agg(row_to_json(t) ORDER BY t.schema, t.fn), '[]'::json) AS exposed FROM (SELECT n.nspname AS schema, p.proname AS fn, pg_get_function_identity_arguments(p.oid) AS args, has_function_privilege('public', p.oid, 'EXECUTE') AS public_exec, has_function_privilege('anon', p.oid, 'EXECUTE') AS anon_exec, (SELECT string_agg(c, ', ') FROM unnest(coalesce(p.proconfig, ARRAY[]::text[])) c WHERE c LIKE 'search_path%') AS search_path FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.prosecdef AND n.nspname NOT IN ('pg_catalog','information_schema') AND (has_function_privilege('public', p.oid, 'EXECUTE') OR has_function_privilege('anon', p.oid, 'EXECUTE'))) t;"
            # Unsafe search_path = any SECURITY DEFINER function whose pinned search_path does NOT end in pg_temp
            # (or is unset). This is broader than 'null only' — public / public,auth without pg_temp last qualify.
            UNSAFE="SELECT coalesce(json_agg(row_to_json(t) ORDER BY t.fn), '[]'::json) AS unsafe_search_path FROM (SELECT p.proname AS fn, pg_get_function_identity_arguments(p.oid) AS args, (SELECT string_agg(c, ', ') FROM unnest(coalesce(p.proconfig, ARRAY[]::text[])) c WHERE c LIKE 'search_path%') AS search_path FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.prosecdef AND n.nspname NOT IN ('pg_catalog','information_schema') AND NOT EXISTS (SELECT 1 FROM unnest(coalesce(p.proconfig, ARRAY[]::text[])) c WHERE c ~ 'search_path=.*pg_temp\\s*$')) t;"
            echo "## #1261 — SECURITY DEFINER hosted audit (read-only, catalog SELECTs only)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "### Total SECURITY DEFINER functions (non-system schemas)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$COUNT" | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
            echo "### EXPOSED to PUBLIC or anon (the risk set — empty ⇒ no hosted exposure)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$EXPOSED" | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
            echo "### SECURITY DEFINER functions whose search_path does NOT end in pg_temp (unsafe)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$UNSAFE" | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            FN="${FN_INPUT:-public.get_user_id_by_email(text)}"
            # SQL-injection guard: strict allowlist — schema.function(comma-separated simple arg types) only.
            if ! printf '%s' "$FN" | grep -qE '^[a-zA-Z_][a-zA-Z0-9_]*\.[a-zA-Z_][a-zA-Z0-9_]*\([a-zA-Z0-9_ ,]*\)$'; then
              echo "::error::function_signature failed validation (expected schema.fn(argtypes), got: $FN)"; exit 2; fi
            SQL="SELECT has_function_privilege('public','${FN}','EXECUTE') AS public_exec, has_function_privilege('anon','${FN}','EXECUTE') AS anon_exec, has_function_privilege('authenticated','${FN}','EXECUTE') AS authenticated_exec, has_function_privilege('service_role','${FN}','EXECUTE') AS service_role_exec;"
            echo "## DB grant check — \`${FN}\`" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$SQL" | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
