name: DB grant check (read-only)

# READ-ONLY security verification: reports EXECUTE grants on RPCs so we can confirm whether a function
# is publicly executable (account-enumeration / SECURITY DEFINER exposure risk). SELECT-only against the
# catalog via the Supabase Management API SQL endpoint. No writes, no deletes, no row data access.
#
# Two modes:
#   - default: has_function_privilege() for one `function_signature` (PUBLIC/anon/authenticated/service_role).
#   - full_scan=true (#1261): enumerate EVERY SECURITY DEFINER function that PUBLIC or anon can EXECUTE,
#     plus every public SECURITY DEFINER function missing a pinned search_path (pg_temp-injection risk).
#     Both are pure catalog SELECTs — no row/user data is read.

on:
  workflow_dispatch:
    inputs:
      function_signature:
        description: 'Function signature to check, e.g. public.get_user_id_by_email(text)'
        required: false
        default: 'public.get_user_id_by_email(text)'
      full_scan:
        description: 'Set to "true" to enumerate all exposed SECURITY DEFINER functions (#1261).'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  grant-check:
    name: RPC EXECUTE grant check (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query EXECUTE grants for one function (SELECT-only)
        if: ${{ github.event.inputs.full_scan != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          FN: ${{ github.event.inputs.function_signature || 'public.get_user_id_by_email(text)' }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID"; exit 2; fi
          SQL="SELECT has_function_privilege('public','${FN}','EXECUTE') AS public_exec, has_function_privilege('anon','${FN}','EXECUTE') AS anon_exec, has_function_privilege('authenticated','${FN}','EXECUTE') AS authenticated_exec, has_function_privilege('service_role','${FN}','EXECUTE') AS service_role_exec;"
          BODY=$(printf '{"query":%s}' "$(printf '%s' "$SQL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
          RES=$(curl -s -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$BODY")
          echo "## DB grant check — \`${FN}\`" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$RES" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Full SECURITY DEFINER exposure scan (SELECT-only, #1261)
        if: ${{ github.event.inputs.full_scan == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID"; exit 2; fi
          run_sql() {
            local body
            body=$(printf '{"query":%s}' "$(printf '%s' "$1" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")
            curl -s -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H "Content-Type: application/json" -d "$body"
          }
          COUNT="SELECT count(*) AS secdef_total FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.prosecdef AND n.nspname NOT IN ('pg_catalog','information_schema');"
          EXPOSED="SELECT coalesce(json_agg(row_to_json(t) ORDER BY t.schema, t.fn), '[]'::json) AS exposed FROM (SELECT n.nspname AS schema, p.proname AS fn, pg_get_function_identity_arguments(p.oid) AS args, has_function_privilege('public', p.oid, 'EXECUTE') AS public_exec, has_function_privilege('anon', p.oid, 'EXECUTE') AS anon_exec, (SELECT string_agg(c, ', ') FROM unnest(coalesce(p.proconfig, ARRAY[]::text[])) c WHERE c LIKE 'search_path%') AS search_path FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.prosecdef AND n.nspname NOT IN ('pg_catalog','information_schema') AND (has_function_privilege('public', p.oid, 'EXECUTE') OR has_function_privilege('anon', p.oid, 'EXECUTE'))) t;"
          NOSPATH="SELECT coalesce(json_agg(row_to_json(t) ORDER BY t.fn), '[]'::json) AS missing_search_path FROM (SELECT p.proname AS fn, pg_get_function_identity_arguments(p.oid) AS args FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.prosecdef AND n.nspname = 'public' AND NOT EXISTS (SELECT 1 FROM unnest(coalesce(p.proconfig, ARRAY[]::text[])) c WHERE c LIKE 'search_path=%')) t;"
          echo "## #1261 — SECURITY DEFINER hosted audit (read-only, catalog SELECTs only)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Total SECURITY DEFINER functions (non-system schemas)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$COUNT" | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### EXPOSED to PUBLIC or anon (the risk set — empty ⇒ no hosted exposure)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$EXPOSED" | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### public SECURITY DEFINER functions with NO pinned search_path (pg_temp risk)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```json' | tee -a "$GITHUB_STEP_SUMMARY"; run_sql "$NOSPATH" | tee -a "$GITHUB_STEP_SUMMARY"; echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
