packages:
  - 'backend/functions/*'
  - 'frontend'

# #1195: pnpm settings live HERE (not package.json#pnpm) for pnpm v11. v11 no longer reads
# overrides / onlyBuiltDependencies / supportedArchitectures / auditConfig from package.json's `pnpm`
# field; leaving them there silently drops them (e.g. the security overrides), so they are consolidated
# below. Do NOT move these back to package.json.

onlyBuiltDependencies:
  - canvas
  - core-js
  - msw
  - sharp

# Security-forced version floors. These MUST remain enforced in pnpm-lock.yaml after any regen.
overrides:
  rimraf: ^5.0.0
  node-domexception: ^2.0.2
  glob: '>=10.5.0'
  basic-ftp: ^5.2.0
  protobufjs: ^7.5.5
  shell-quote: '>=1.8.4'

auditConfig:
  ignoreGhsas:
    - GHSA-5xrq-8626-4rwp

# P1.5: @huggingface/transformers@4.2.0 (dormant Private v4) directly imports `Tensor` from
# onnxruntime-common but does NOT declare it as a dependency; pnpm otherwise resolves the undeclared
# import to the hoisted CommonJS onnxruntime-common@1.14.0 from the @xenova/transformers (v2) tree,
# so the v4 ESM bundle fails at load with `SyntaxError: Named export 'Tensor' not found`. Declaring the
# ESM 1.24.3 build directly beside the v4 package fixes the resolution. This does NOT touch production
# Private v2 (@xenova/transformers@2.17.2), which keeps its own onnxruntime 1.14 tree.
packageExtensions:
  '@huggingface/transformers@4.2.0':
    dependencies:
      onnxruntime-common: 1.24.3

# Union of Linux (CI/Vercel, x64) + macOS (local dev, arm64) so both resolve platform binaries.
supportedArchitectures:
  os:
    - current
    - linux
    - darwin
  cpu:
    - current
    - x64
    - arm64
